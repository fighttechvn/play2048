/* iOS 12 / old WebKit have no Pointer Events — the games drive all input through
   pointerdown/move/up (+ setPointerCapture). Bridge touch (and old-desktop mouse)
   into synthetic pointer events so swiping/drawing works. No-op on modern engines. */
(function () {
  if (window.PointerEvent) return;
  var EP = window.Element && Element.prototype;
  if (EP && !EP.setPointerCapture) {
    EP.setPointerCapture = function () {};
    EP.releasePointerCapture = function () {};
    EP.hasPointerCapture = function () { return false; };
  }
  function mk(type, x, y, id, ptype) {
    var e;
    try { e = new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: x, clientY: y }); }
    catch (_) { e = document.createEvent("MouseEvents"); e.initMouseEvent(type, true, true, window, 0, 0, 0, x, y, false, false, false, false, 0, null); }
    e.pointerId = id; e.pointerType = ptype; e.isPrimary = true;
    e.pressure = type === "pointerup" || type === "pointercancel" ? 0 : 0.5;
    e.width = 1; e.height = 1;
    return e;
  }
  // --- touch → pointer (move/up go to the start target, mimicking pointer capture) ---
  var startTarget = null, touchActive = false, lastTouch = 0;
  function relay(type, touch, target) {
    var ev = mk(type, touch.clientX, touch.clientY, (touch.identifier || 0) + 1, "touch");
    return target.dispatchEvent(ev); // false if a handler called preventDefault()
  }
  document.addEventListener("touchstart", function (e) {
    touchActive = true; lastTouch = e.timeStamp || 0; startTarget = e.target;
    if (!relay("pointerdown", e.changedTouches[0], startTarget)) e.preventDefault();
  }, { passive: false });
  document.addEventListener("touchmove", function (e) {
    lastTouch = e.timeStamp || 0;
    if (!relay("pointermove", e.changedTouches[0], startTarget || e.target)) e.preventDefault();
  }, { passive: false });
  function end(type) {
    return function (e) {
      touchActive = false; lastTouch = e.timeStamp || 0;
      relay(type, e.changedTouches[0], startTarget || e.target); startTarget = null;
    };
  }
  document.addEventListener("touchend", end("pointerup"), { passive: false });
  document.addEventListener("touchcancel", end("pointercancel"), { passive: false });
  // --- mouse → pointer (old desktop); skip the synthetic mouse burst after a touch ---
  function fromMouse(type) {
    return function (e) {
      if (touchActive || (e.timeStamp || 0) - lastTouch < 700) return;
      e.target.dispatchEvent(mk(type, e.clientX, e.clientY, 1, "mouse"));
    };
  }
  document.addEventListener("mousedown", fromMouse("pointerdown"), true);
  document.addEventListener("mousemove", fromMouse("pointermove"), true);
  document.addEventListener("mouseup", fromMouse("pointerup"), true);
})();

function paramsForRound(round){var cells=Math.min(8,4+Math.floor((round-1)/5));var timeMs=Math.max(3500,8000-(round-1)*180);return {cells:cells,timeMs:timeMs};}
function normalize(cells){var mx=Infinity,my=Infinity;for(var i=0;i<cells.length;i++){if(cells[i][0]<mx)mx=cells[i][0];if(cells[i][1]<my)my=cells[i][1];}return cells.map(function(c){return [c[0]-mx,c[1]-my];}).sort(function(a,b){return a[0]-b[0]||a[1]-b[1];});}

function drawShape(cv,cells){

    var x=ox+cells[k][0]*unit,y=oy+cells[k][1]*unit;
    var r=Math.max(4,Math.floor(unit*0.18)),g=Math.max(2,Math.floor(unit*0.06));
    // rounded cell with a small gap so the structure reads clearly
    var xx=x+g,yy=y+g,ww=unit-2*g,hh=unit-2*g;
    ctx.beginPath();
    ctx.moveTo(xx+r,yy);
    ctx.arcTo(xx+ww,yy,xx+ww,yy+hh,r);
    ctx.arcTo(xx+ww,yy+hh,xx,yy+hh,r);
    ctx.arcTo(xx,yy+hh,xx,yy,r);
    ctx.arcTo(xx,yy,xx+ww,yy,r);
    ctx.closePath();
    ctx.fill();
  }
}

// ── Game state ────────────────────────────────────────────────────────────
let round=1,Q=null,deadline=0,timerId=null,lives=3,score=0,best=+(localStorage.getItem(KEY)||0),state="idle",timers=[];
let rnd=mulberry32(((Date.now()%2147483647)>>>0)||1);
const $=function(id){return document.getElementById(id);};
const cvA=$("cvA"),cvB=$("cvB"),fill=$("timerfill");
function later(fn,ms){timers.push(setTimeout(fn,ms));}
function clearTimers(){for(var i=0;i<timers.length;i++)clearTimeout(timers[i]);timers=[];if(timerId){clearInterval(timerId);timerId=null;}}
function hearts(){var s="";for(var i=0;i<3;i++)s+=(i<lives?"♥":"♡");$("lives").textContent=s;}
function setStatus(t,cls){var st=$("status");st.textContent=t;st.className="pill"+(cls?" "+cls:"");}
function setPill(){$("lvl").textContent="Rotate · "+score;}
function banner(t,ms){
  var b=$("banner");b.textContent=t;
  b.classList.remove("on");void b.offsetWidth;b.classList.add("on");
  later(function(){b.classList.remove("on");},ms||900);
}
function setBtns(on){$("sameBtn").disabled=!on;$("mirrorBtn").disabled=!on;}
function startTimer(ms){
  deadline=Date.now()+ms;
  fill.style.width="100%";fill.classList.remove("low");
  if(timerId)clearInterval(timerId);
  timerId=setInterval(function(){
    var left=deadline-Date.now();
    var f=Math.max(0,left/ms);
    fill.style.width=(f*100)+"%";
    if(f<0.25)fill.classList.add("low");
    if(left<=0){clearInterval(timerId);timerId=null;if(state==="play")grade(null);}
  },50);
}
function nextQuestion(){
  Q=genQuestion(round,rnd);
  drawShape(cvA,Q.target);
  drawShape(cvB,Q.probe);
  setBtns(true);
  state="play";
  setStatus(S.think);
  startTimer(Q.timeMs);
}
function grade(saidMirror){
  if(state!=="play")return;
  state="pause";
  if(timerId){clearInterval(timerId);timerId=null;}
  setBtns(false);
  var timeout=saidMirror===null;
  var ok=!timeout&&saidMirror===Q.mirrored;
  if(ok){
    score++;round++;
    if(score>best){best=score;try{localStorage.setItem(KEY,String(best));}catch(e){}}
    setPill();
    tone(659.25,0.12,"sine",0.18);
    setStatus(S.right,"ok");
    later(nextQuestion,450);
  }else{
    lives--;hearts();
    $("shapes").classList.add("shake");
    tone(130,0.35,"square",0.14);
    later(function(){$("shapes").classList.remove("shake");},450);
    setStatus(timeout?S.slow:S.wrong,"err");
    if(lives<=0){later(gameOver,900);return;}
    round++; // move on — no repeats, the ramp itself provides relief
    later(nextQuestion,1100);
  }
}
function gameOver(){
  state="over";
  GBLB.report(score);
  $("goTitle").textContent=S.over;
  $("goScore").textContent=S.score+": "+score;
  $("goBest").textContent=S.best+": "+best;
  $("wino").style.display="grid";
}
function startRun(){
  clearTimers();
  $("wino").style.display="none";$("starto").style.display="none";
  round=1;lives=3;score=0;state="pause";
  rnd=mulberry32(((Date.now()%2147483647)>>>0)||1);
  hearts();setPill();
  GBLB.start();
  later(nextQuestion,300);
}
function press(btn,saidMirror){
  if(state!=="play")return;
  ensureAudio();
  btn.classList.add("press");later(function(){btn.classList.remove("press");},110);
  grade(saidMirror);
}
$("sameBtn").addEventListener("pointerdown",function(ev){ev.preventDefault();press(this,false);});
$("mirrorBtn").addEventListener("pointerdown",function(ev){ev.preventDefault();press(this,true);});

// ── Start / restart ───────────────────────────────────────────────────────
$("startMsg").textContent=S.tap;
$("startBtn").textContent=S.play;
$("again").textContent=S.again;
$("sameBtn").textContent=S.same;
$("mirrorBtn").textContent=S.mirrorb;
$("labA").textContent=S.shape;
$("labB").textContent=S.probe;
if(LANG==="ar"){$("starto").dir="rtl";$("wino").dir="rtl";}
$("startBtn").onclick=function(){ensureAudio();if(TUT_ON&&!localStorage.getItem(TUTKEY)){$("starto").style.display="none";showTut();}else{startRun();}};
$("again").onclick=function(){ensureAudio();startRun();};

  vi:{t1:"Chào mừng đến Rotate",b1:"Hai hình: hình bên phải là hình bên trái đã xoay — hoặc ảnh gương của nó đã xoay.",t2:"SAME hay MIRROR",b2:"Xoay trong đầu. Nếu trùng khớp, nhấn SAME. Nếu chỉ khớp khi lật gương, nhấn MIRROR. Nhanh trước khi hết giờ — 3 mạng.",skip:"Bỏ qua",next:"Tiếp",play:"Chơi"},
  ko:{t1:"Rotate에 오신 것을 환영합니다",b1:"도형 두 개: 오른쪽은 왼쪽을 회전한 것 — 또는 거울상을 회전한 것입니다.",t2:"SAME 또는 MIRROR",b2:"머릿속으로 돌려 보세요. 겹쳐지면 SAME, 뒤집어야만 맞으면 MIRROR. 시간 내에 답하세요 — 라이프 3개.",skip:"건너뛰기",next:"다음",play:"플레이"},
  zh:{t1:"欢迎来到 Rotate",b1:"两个图形：右边是左边旋转后的样子——或是其镜像旋转后的样子。",t2:"SAME 还是 MIRROR",b2:"在脑中旋转。能重合就按SAME；只有翻转才能重合就按MIRROR。抢在时间前作答——3条命。",skip:"跳过",next:"下一步",play:"开始玩"},
  ja:{t1:"Rotate へようこそ",b1:"2つの図形：右は左を回転させたもの — または鏡像を回転させたものです。",t2:"SAMEかMIRRORか",b2:"頭の中で回転。重なればSAME、裏返さないと合わないならMIRROR。時間内に答えよう — ライフは3つ。",skip:"スキップ",next:"次へ",play:"プレイ"},
  ar:{t1:"مرحبًا بك في Rotate",b1:"شكلان: الأيمن هو الأيسر بعد التدوير — أو صورته المرآتية بعد التدوير.",t2:"SAME أم MIRROR",b2:"أدره في ذهنك. إن تطابق فاضغط SAME، وإن لم يتطابق إلا مقلوبًا فاضغط MIRROR. اسبق الوقت — لديك 3 محاولات.",skip:"تخطّي",next:"التالي",play:"العب"}
};
const M=TUT_T[LANG]||TUT_T.en;
var tutStep=0;
function showTut(){
  tutStep=0;
  if(LANG==="ar")$("tutCard").dir="rtl";
  renderTut();$("tut").classList.add("on");
}
function renderTut(){
  $("tutTitle").textContent=tutStep===0?M.t1:M.t2;
  $("tutBody").textContent=tutStep===0?M.b1:M.b2;
  $("tutSkip").textContent=M.skip;
  $("tutNext").textContent=tutStep===0?M.next:M.play;
}
function endTut(){
  try{localStorage.setItem(TUTKEY,"1");}catch(e){}
  $("tut").classList.remove("on");
  startRun();
}
$("tutNext").onclick=function(){if(tutStep===0){tutStep=1;renderTut();}else{endTut();}};
$("tutSkip").onclick=endTut;

// initial idle board behind the start overlay — a sample question, buttons off
(function(){
  var q=genQuestion(1,mulberry32(7));
  drawShape(cvA,q.target);drawShape(cvB,q.probe);
  setBtns(false);hearts();setStatus(S.think);setPill();
})();
</script>
