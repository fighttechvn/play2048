<meta charset="UTF-8" />
<script>
/* iOS 12 / old WebKit have no Pointer Events — the games drive all input through
   pointerdown/move/up (+ setPointerCapture). Bridge touch (and old-desktop mouse)
   into synthetic pointer events so swiping/drawing works. No-op on modern engines. */
(function () {
  if (window.PointerEvent) return;
  var EP = window.Element && Element.prototype;
  if (EP && !EP.setPointerCapture) {
    EP.setPointerCapture = function () {};
    EP.releasePointerCapture = function () {};
    EP.hasPointerCapture = function () { return false; };
  }
  function mk(type, x, y, id, ptype) {
    var e;
    try { e = new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: x, clientY: y }); }
    catch (_) { e = document.createEvent("MouseEvents"); e.initMouseEvent(type, true, true, window, 0, 0, 0, x, y, false, false, false, false, 0, null); }
    e.pointerId = id; e.pointerType = ptype; e.isPrimary = true;
    e.pressure = type === "pointerup" || type === "pointercancel" ? 0 : 0.5;
    e.width = 1; e.height = 1;
    return e;
  }
  // --- touch → pointer (move/up go to the start target, mimicking pointer capture) ---
  var startTarget = null, touchActive = false, lastTouch = 0;
  function relay(type, touch, target) {
    var ev = mk(type, touch.clientX, touch.clientY, (touch.identifier || 0) + 1, "touch");
    return target.dispatchEvent(ev); // false if a handler called preventDefault()
  }
  document.addEventListener("touchstart", function (e) {
    touchActive = true; lastTouch = e.timeStamp || 0; startTarget = e.target;
    if (!relay("pointerdown", e.changedTouches[0], startTarget)) e.preventDefault();
  }, { passive: false });
  document.addEventListener("touchmove", function (e) {
    lastTouch = e.timeStamp || 0;
    if (!relay("pointermove", e.changedTouches[0], startTarget || e.target)) e.preventDefault();
  }, { passive: false });
  function end(type) {
    return function (e) {
      touchActive = false; lastTouch = e.timeStamp || 0;
      relay(type, e.changedTouches[0], startTarget || e.target); startTarget = null;
    };
  }
  document.addEventListener("touchend", end("pointerup"), { passive: false });
  document.addEventListener("touchcancel", end("pointercancel"), { passive: false });
  // --- mouse → pointer (old desktop); skip the synthetic mouse burst after a touch ---
  function fromMouse(type) {
    return function (e) {
      if (touchActive || (e.timeStamp || 0) - lastTouch < 700) return;
      e.target.dispatchEvent(mk(type, e.clientX, e.clientY, 1, "mouse"));
    };
  }
  document.addEventListener("mousedown", fromMouse("pointerdown"), true);
  document.addEventListener("mousemove", fromMouse("pointermove"), true);
  document.addEventListener("mouseup", fromMouse("pointerup"), true);
})();
</script>

<script>
const KEY="math.best";
const ZKEY="math.zenbest";
const LANG=(function(){var p=new URLSearchParams(location.search).get("lang");var raw=p||localStorage.getItem("gobrain.locale")||localStorage.getItem("CapacitorStorage.gobrain.locale")||navigator.language||"en";var c=String(raw).toLowerCase().split("-")[0];return ["en","vi","ko","zh","ja","ar"].indexOf(c)>=0?c:"en";})();
// ── Leaderboard reporter (Go Brain) ───────────────────────────────────────
// Math Sprint is endless/score-based, so it POSTs a fixed `level: 1` with the
// score — the server ranks score games by score first, then time. Reads the
// shared player token (set by the hub, same origin). No token → silently skips.
// Mirrors the GBLB block in games/zip/index.html; keep in sync.
const GBLB=(function(){
  var GAME='math', t0=0;
  function base(){ try{var o=localStorage.getItem('gobrain.api.base'); if(o) return o.replace(/\/$/,'');}catch(e){}
    return (function(){try{var C=window.Capacitor||(window.parent&&window.parent.Capacitor);if(C&&typeof C.isNativePlatform==='function')return C.isNativePlatform();}catch(e){}return /^capacitor:|^ionic:/.test(location.protocol);})()?'https://gobrain.fighttech.vn/api/v1':'/api/v1'; }
  function token(){ try{return localStorage.getItem('CapacitorStorage.gobrain.player.token')||localStorage.getItem('gobrain.player.token');}catch(e){return null;} }
  function apiKey(){ try{return localStorage.getItem('gobrain.api.key')||'gobrain-dev-client-key';}catch(e){return 'gobrain-dev-client-key';} }
  function emit(name,params){ try{ if(window.parent&&window.parent!==window){ params=params||{}; params.game_id=GAME; window.parent.postMessage({__gb:1,name:name,params:params},'*'); } }catch(e){} }
  return {
    start:function(){ t0=Date.now(); emit('level_start',{}); },
    report:function(score){ var ms=t0?(Date.now()-t0):0; emit('game_over',{score:score,duration_ms:ms});
      var tok=token(); if(!tok||!t0) return; t0=0;
      try{ fetch(base()+'/scores',{method:'POST',headers:{'content-type':'application/json','x-api-key':apiKey(),'authorization':'Bearer '+tok},
        body:JSON.stringify({gameId:GAME,level:1,durationMs:Math.max(1,ms),score:score})}).catch(function(){}); }catch(e){} }
  };
})();

// ── Pure logic (kept in sync with games/math/logic.mjs — source of truth) ──
function phaseFor(i){ if(i<8)return 0; if(i<16)return 1; if(i<24)return 2; if(i<32)return 3; return 4; }
function evalParts(parts){
  const vals=[parts[0]], ops=[];
  for(let k=1;k<parts.length;k+=2){
    const op=parts[k], v=parts[k+1];
    if(op==='×') vals[vals.length-1]*=v;
    else if(op==='÷') vals[vals.length-1]/=v;
    else { ops.push(op); vals.push(v); }
  }
  let r=vals[0];
  for(let k=0;k<ops.length;k++) r=ops[k]==='+'? r+vals[k+1] : r-vals[k+1];
  return r;
}
function ri(rnd,lo,hi){ return lo+Math.floor(rnd()*(hi-lo+1)); }
function kindFor(phase,rnd){
  if(phase===0) return rnd()<0.5?'add1':'sub1';
  if(phase===1) return rnd()<0.5?'add2':'sub2';
  if(phase===2) return 'mul';
  if(phase===3) return 'div';
  if(rnd()<0.5) return 'mix';
  return ['add2','sub2','mul','div'][ri(rnd,0,3)];
}
function buildParts(kind,rnd){
  let a,b,c;
  switch(kind){
    case 'add1': return [ri(rnd,1,9),'+',ri(rnd,1,9)];
    case 'sub1': a=ri(rnd,1,9); b=ri(rnd,1,9); if(b>a){c=a;a=b;b=c;} return [a,'-',b];
    case 'add2': return [ri(rnd,10,99),'+',ri(rnd,10,99)];
    case 'sub2': a=ri(rnd,10,99); b=ri(rnd,10,99); if(b>a){c=a;a=b;b=c;} return [a,'-',b];
    case 'mul': return [ri(rnd,2,12),'×',ri(rnd,2,12)];
    case 'div': b=ri(rnd,2,9); return [b*ri(rnd,2,12),'÷',b];
    default: {
      const f=rnd();
      if(f<0.25) return [ri(rnd,2,20),'+',ri(rnd,2,9),'×',ri(rnd,2,9)];
      if(f<0.5){ b=ri(rnd,2,6); c=ri(rnd,2,6); return [b*c+ri(rnd,0,9),'-',b,'×',c]; }
      if(f<0.75) return [ri(rnd,2,9),'×',ri(rnd,2,9),'+',ri(rnd,2,20)];
      a=ri(rnd,2,9); b=ri(rnd,2,9); return [a,'×',b,'-',ri(rnd,1,a*b)];
    }
  }
}
function transposeDigits(n){
  if(n<10||n>99) return null;
  const t=(n%10)*10+Math.floor(n/10);
  return t===n?null:t;
}
function falseShown(actual,phase,rnd){
  let cand;
  if(phase>=4){
    const p=rnd();
    if(p<0.4) cand=actual+(rnd()<0.5?-1:1);
    else if(p<0.7) cand=actual+(rnd()<0.5?-10:10);
    else { cand=transposeDigits(actual); if(cand===null) cand=actual+(rnd()<0.5?-1:1); }
  } else {
    const d=ri(rnd,1,3);
    cand=rnd()<0.8? actual+(rnd()<0.5?-d:d) : actual+(rnd()<0.5?-10:10);
  }
  if(cand===actual||cand<0) cand=actual+1;
  return cand;
}
function genEquation(i,rnd){
  const phase=phaseFor(i);
  const kind=kindFor(phase,rnd);
  const parts=buildParts(kind,rnd);
  const actual=evalParts(parts);
  const wantTrue=rnd()<0.5;
  const shown=wantTrue?actual:falseShown(actual,phase,rnd);
  return {parts:parts, shown:shown, truth:shown===actual, phase:phase, kind:kind, text:parts.join(' ')+' = '+shown};
}
function points(rtMs,combo){
  const speed=Math.max(0,Math.min(100,Math.round((1500-rtMs)/10)));
  const mult=1+Math.min(combo,10)*0.1;
  return Math.round((100+speed)*mult);
}

      start:"数式は正しい？速い解答と連続正解で高得点。スプリント：60秒、ミスは−2秒。禅：タイマーなし、ライフ3。",
      sprint:"⏱ スプリント（60秒）",zen:"∞ 禅（3 ♥）",overS:"タイムアップ！",overZ:"ライフがなくなった！",
      score:"スコア",acc:"正確さ",rt:"平均速度",comboL:"最大コンボ",again:"もう一度",menu:"モード変更",nbest:"新記録！🎉",best:"ベスト: "},
  ar:{prompt:"صح أم خطأ؟",yes:"✓ صحيح",no:"✗ خطأ",
      start:"هل المعادلة صحيحة؟ الإجابات السريعة والسلاسل تمنح نقاطًا أكثر. السباق: 60 ثانية والخطأ −2 ثانية. الاسترخاء: بلا مؤقّت، 3 أرواح.",
      sprint:"⏱ سباق (60 ثانية)",zen:"∞ استرخاء (3 ♥)",overS:"انتهى الوقت!",overZ:"نفدت الأرواح!",
      score:"النقاط",acc:"الدقة",rt:"متوسط السرعة",comboL:"أفضل سلسلة",again:"العب مجددًا",menu:"تغيير الوضع",nbest:"رقم قياسي جديد! 🎉",best:"الأفضل: "}
};
const U=UI[LANG]||UI.en;
const $=function(id){return document.getElementById(id);};

const DUR=60000, WRONG_PENALTY=2000, ZEN_LIVES=3;
let running=false, lock=false, zen=false, lives=ZEN_LIVES, endAt=0, startT=0, rafId=0;
let eq=null, trialIdx=0, shownAt=0;
let score=0, combo=0, bestCombo=0, nCorrect=0, nWrong=0, sumRt=0;
let bestS=+(localStorage.getItem(KEY)||0), bestZ=+(localStorage.getItem(ZKEY)||0);
let lastTimeTxt="", reported=false;

$('yesBtn').textContent=U.yes; $('noBtn').textContent=U.no;
$('prompt').textContent=U.prompt;
$('stBody').textContent=U.start;
$('sprintBtn').textContent=U.sprint; $('zenBtn').textContent=U.zen;
$('slScore').textContent=U.score; $('slAcc').textContent=U.acc; $('slRt').textContent=U.rt; $('slCombo').textContent=U.comboL;
$('againBtn').textContent=U.again; $('menuBtn').textContent=U.menu;
$('bestPill').textContent='★ '+bestS;
if(LANG==='ar'){ $('startO').dir='rtl'; $('overO').dir='rtl'; }

function fitEq(){
  const el=$('eq'); let fs=46; el.style.fontSize=fs+'px';
  while(el.scrollWidth>el.clientWidth && fs>20){ fs-=3; el.style.fontSize=fs+'px'; }
}
function showEq(){
  eq=genEquation(trialIdx, Math.random); trialIdx++;
  $('eq').textContent=eq.text;
  fitEq();
  shownAt=performance.now(); lock=false;
}
function hearts(){ let s=''; for(let k=0;k<lives;k++)s+='♥'; for(let k=lives;k<ZEN_LIVES;k++)s+='♡'; return s; }
function setCombo(){
  const p=$('comboPill');
  if(combo>=2){ p.style.display='inline-block'; p.textContent='×'+(1+Math.min(combo,10)*0.1).toFixed(1); }
  else p.style.display='none';
}
let gainT=0;
function flashGain(txt,neg){
  const g=$('gain'); g.textContent=txt; g.className=neg?'neg':''; g.style.opacity='1';
  clearTimeout(gainT); gainT=setTimeout(function(){ g.style.opacity='0'; },450);
}
let flashT=0;
function flashStage(cls){
  const s=$('stage'); s.classList.remove('hit','miss'); void s.offsetWidth; s.classList.add(cls);
  clearTimeout(flashT); flashT=setTimeout(function(){ s.classList.remove('hit','miss'); },160);
}
function answer(saidTrue){
  if(!running||lock||!eq) return;
  lock=true;
  const now=performance.now(), rt=now-shownAt;
  if(saidTrue===eq.truth){
    const p=points(rt,combo);
    score+=p; combo++; if(combo>bestCombo)bestCombo=combo;
    nCorrect++; sumRt+=rt;
    $('score').textContent=String(score);
    flashGain('+'+p,false); flashStage('hit');
  } else {
    nWrong++; combo=0;
    if(zen){ lives--; $('time').textContent=hearts(); flashGain('-1♥',true); }
    else { endAt-=WRONG_PENALTY; flashGain('-2s',true); }
    flashStage('miss');
  }
  setCombo();
  if(zen&&lives<=0){ setTimeout(endRun,180); return; }
  setTimeout(function(){ if(running) showEq(); },150);
}
$('yesBtn').addEventListener('pointerdown',function(e){e.preventDefault();answer(true);});
$('noBtn').addEventListener('pointerdown',function(e){e.preventDefault();answer(false);});

function tick(){
  if(!running) return;
  if(!zen){
    const now=performance.now();
    const left=Math.max(0,endAt-now);
    const txt=(left/1000).toFixed(1)+'s';
    if(txt!==lastTimeTxt){ lastTimeTxt=txt; $('time').textContent=txt; $('time').classList.toggle('low',left<10000); }
    $('fill').style.transform='scaleX('+(left/DUR)+')';
    if(left<=0){ endRun(); return; }
  }
  rafId=requestAnimationFrame(tick);
}
function startRun(zenMode){
  zen=zenMode;
  $('startO').style.display='none'; $('overO').style.display='none';
  running=true; lock=false; reported=false; lives=ZEN_LIVES;
  score=0; combo=0; bestCombo=0; nCorrect=0; nWrong=0; sumRt=0; trialIdx=0; eq=null;
  lastTimeTxt="";
  $('score').textContent='0'; setCombo();
  $('bar').classList.toggle('off',zen);
  $('time').classList.remove('low');
  $('bestPill').textContent='★ '+(zen?bestZ:bestS);
  if(zen){ $('time').textContent=hearts(); }
  else { $('fill').style.transform='scaleX(1)'; }
  startT=performance.now(); endAt=startT+DUR;
  GBLB.start();
  showEq();
  cancelAnimationFrame(rafId); rafId=requestAnimationFrame(tick);
}
function endRun(){
  running=false; cancelAnimationFrame(rafId);
  $('eq').textContent=' ';
  const total=nCorrect+nWrong;
  const acc=total?Math.round(100*nCorrect/total):0;
  const avg=nCorrect?Math.round(sumRt/nCorrect):0;
  $('ovTitle').textContent=zen?U.overZ:U.overS;
  $('svScore').textContent=String(score);
  $('svAcc').textContent=acc+'%';
  $('svRt').textContent=avg+'ms';
  $('svCombo').textContent=String(bestCombo);
  let isBest;
  if(zen){ isBest=score>bestZ&&score>0; if(isBest){bestZ=score;try{localStorage.setItem(ZKEY,String(bestZ));}catch(e){}} }
  else { isBest=score>bestS&&score>0; if(isBest){bestS=score;try{localStorage.setItem(KEY,String(bestS));}catch(e){}} }
  $('bestPill').textContent='★ '+(zen?bestZ:bestS);
  $('newBest').textContent=isBest?U.nbest:(U.best+(zen?bestZ:bestS));
  $('overO').style.display='grid';
  reported=true;
  GBLB.report(score);
}
$('sprintBtn').onclick=function(){startRun(false);};
$('zenBtn').onclick=function(){startRun(true);};
$('againBtn').onclick=function(){startRun(zen);};
$('menuBtn').onclick=function(){$('overO').style.display='none';$('startO').style.display='grid';};
// Abandoning a run mid-way still records it.
addEventListener('pagehide',function(){ if(running&&!reported&&score>0){reported=true;GBLB.report(score);} });

$('startO').style.display='grid';
</script>
</body>
</html>
