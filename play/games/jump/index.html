<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
/* iOS 12 / old WebKit have no Pointer Events — the games drive all input through
   pointerdown/move/up (+ setPointerCapture). Bridge touch (and old-desktop mouse)
   into synthetic pointer events so swiping/drawing works. No-op on modern engines. */
(function () {
  if (window.PointerEvent) return;
  var EP = window.Element && Element.prototype;
  if (EP && !EP.setPointerCapture) {
    EP.setPointerCapture = function () {};
    EP.releasePointerCapture = function () {};
    EP.hasPointerCapture = function () { return false; };
  }
  function mk(type, x, y, id, ptype) {
    var e;
    try { e = new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: x, clientY: y }); }
    catch (_) { e = document.createEvent("MouseEvents"); e.initMouseEvent(type, true, true, window, 0, 0, 0, x, y, false, false, false, false, 0, null); }
    e.pointerId = id; e.pointerType = ptype; e.isPrimary = true;
    e.pressure = type === "pointerup" || type === "pointercancel" ? 0 : 0.5;
    e.width = 1; e.height = 1;
    return e;
  }
  // --- touch → pointer (move/up go to the start target, mimicking pointer capture) ---
  var startTarget = null, touchActive = false, lastTouch = 0;
  function relay(type, touch, target) {
    var ev = mk(type, touch.clientX, touch.clientY, (touch.identifier || 0) + 1, "touch");
    return target.dispatchEvent(ev); // false if a handler called preventDefault()
  }
  document.addEventListener("touchstart", function (e) {
    touchActive = true; lastTouch = e.timeStamp || 0; startTarget = e.target;
    if (!relay("pointerdown", e.changedTouches[0], startTarget)) e.preventDefault();
  }, { passive: false });
  document.addEventListener("touchmove", function (e) {
    lastTouch = e.timeStamp || 0;
    if (!relay("pointermove", e.changedTouches[0], startTarget || e.target)) e.preventDefault();
  }, { passive: false });
  function end(type) {
    return function (e) {
      touchActive = false; lastTouch = e.timeStamp || 0;
      relay(type, e.changedTouches[0], startTarget || e.target); startTarget = null;
    };
  }
  document.addEventListener("touchend", end("pointerup"), { passive: false });
  document.addEventListener("touchcancel", end("pointercancel"), { passive: false });
  // --- mouse → pointer (old desktop); skip the synthetic mouse burst after a touch ---
  function fromMouse(type) {
    return function (e) {
      if (touchActive || (e.timeStamp || 0) - lastTouch < 700) return;
      e.target.dispatchEvent(mk(type, e.clientX, e.clientY, 1, "mouse"));
    };
  }
  document.addEventListener("mousedown", fromMouse("pointerdown"), true);
  document.addEventListener("mousemove", fromMouse("pointermove"), true);
  document.addEventListener("mouseup", fromMouse("pointerup"), true);
})();
</script>

  #wrap{max-width:560px;margin:0 auto;padding:calc(62px + var(--saa-top, env(safe-area-inset-top, 0px))) calc(16px + var(--saa-right, env(safe-area-inset-right, 0px))) calc(16px + var(--saa-bottom, env(safe-area-inset-bottom, 0px))) calc(16px + var(--saa-left, env(safe-area-inset-left, 0px)));display:flex;flex-direction:column;gap:14px;min-height:100%}

<script>

  var T={

    zh:"<b>玩法。</b> 小圆球会自动弹跳——按住并左右拖动来控制它（它会跟随你的手指）。踩着平台向上跳：橙色平台会移动，裂纹平台踩一次就碎，粉色弹簧能把你弹上高空。跌出屏幕底部则游戏结束。",

    ar:"<b>طريقة اللعب.</b> يقفز الكائن تلقائيًا — المس واسحب يمينًا أو يسارًا لتوجيهه (يتبع إصبعك). اقفز على المنصات: البرتقالية تتحرك، والمتشققة تنكسر بعد قفزة واحدة، والنوابض الوردية تقذفك عاليًا. إذا سقطت من الأسفل انتهت الجولة."
  };
  var L=pick(),el=document.querySelector(".help");
  if(el){el.innerHTML=T[L]||T.en; if(L==="ar")el.dir="rtl";}

<div class="win" id="over"><div><h2 id="ovT">Game over</h2><p id="ovScore"></p><p id="ovBest"></p><button id="again">Play again</button></div></div>
<script>
const KEY="jump.best";
// Locale — same source order as the help card above.
const LANG=(function(){var p=new URLSearchParams(location.search).get("lang");var raw=p||localStorage.getItem("gobrain.locale")||localStorage.getItem("CapacitorStorage.gobrain.locale")||navigator.language||"en";var c=String(raw).toLowerCase().split("-")[0];return ["en","vi","ko","zh","ja","ar"].indexOf(c)>=0?c:"en";})();
// ── Leaderboard reporter (Go Brain) ───────────────────────────────────────
// Sky Jump is endless/score-based: POSTs a fixed `level: 1` with the score
// (max altitude in meters) on game over. Reads the shared player token (set by
// the hub, same origin). No token → silently skips. Mirrors games/zip; keep in sync.
const GBLB=(function(){
  var GAME='jump', t0=0;
  function base(){ try{var o=localStorage.getItem('gobrain.api.base'); if(o) return o.replace(/\/$/,'');}catch(e){}
    return (function(){try{var C=window.Capacitor||(window.parent&&window.parent.Capacitor);if(C&&typeof C.isNativePlatform==='function')return C.isNativePlatform();}catch(e){}return /^capacitor:|^ionic:/.test(location.protocol);})()?'https://gobrain.fighttech.vn/api/v1':'/api/v1'; }
  function token(){ try{return localStorage.getItem('CapacitorStorage.gobrain.player.token')||localStorage.getItem('gobrain.player.token');}catch(e){return null;} }
  function apiKey(){ try{return localStorage.getItem('gobrain.api.key')||'gobrain-dev-client-key';}catch(e){return 'gobrain-dev-client-key';} }
  function emit(name,params){ try{ if(window.parent&&window.parent!==window){ params=params||{}; params.game_id=GAME; window.parent.postMessage({__gb:1,name:name,params:params},'*'); } }catch(e){} }
  return {
    start:function(){ t0=Date.now(); emit('level_start',{}); },
    report:function(score){ var ms=t0?(Date.now()-t0):0; emit('game_over',{score:score,duration_ms:ms});
      var tok=token(); if(!tok||!t0) return; t0=0;
      try{ fetch(base()+'/scores',{method:'POST',headers:{'content-type':'application/json','x-api-key':apiKey(),'authorization':'Bearer '+tok},
        body:JSON.stringify({gameId:GAME,level:1,durationMs:Math.max(1,ms),score:score})}).catch(function(){}); }catch(e){} }
  };
})();

// Small localized UI strings (start hint + game-over overlay).
const UI={
  en:{tap:"Tap to launch",drag:"drag to steer",over:"Game over",score:"Altitude: ",best:"Best: ",nb:"New best! 🎉",again:"Play again",rs:"Restart",m:" m"},
  vi:{tap:"Chạm để bay lên",drag:"kéo để lái",over:"Kết thúc",score:"Độ cao: ",best:"Kỷ lục: ",nb:"Kỷ lục mới! 🎉",again:"Chơi lại",rs:"Chơi lại",m:" m"},
  ko:{tap:"탭하여 시작",drag:"드래그로 조종",over:"게임 오버",score:"고도: ",best:"최고 기록: ",nb:"신기록! 🎉",again:"다시 하기",rs:"다시 시작",m:" m"},
  zh:{tap:"点按起飞",drag:"拖动来控制",over:"游戏结束",score:"高度：",best:"最佳：",nb:"新纪录！🎉",again:"再玩一次",rs:"重新开始",m:" 米"},
  ja:{tap:"タップでスタート",drag:"ドラッグで操作",over:"ゲームオーバー",score:"高度: ",best:"ベスト: ",nb:"新記録！🎉",again:"もう一度",rs:"やり直す",m:" m"},
  ar:{tap:"انقر للانطلاق",drag:"اسحب للتوجيه",over:"انتهت اللعبة",score:"الارتفاع: ",best:"الأفضل: ",nb:"رقم قياسي جديد! 🎉",again:"العب مجددًا",rs:"إعادة",m:" م"}
};
const MSG=UI[LANG]||UI.en;
document.getElementById('restart').textContent=MSG.rs;
document.getElementById('again').textContent=MSG.again;
if(LANG==='ar'){var ovd=document.getElementById('over');if(ovd)ovd.dir='rtl';}

// ── Pure logic (inlined copy of logic.mjs — keep in sync) ─────────────────
const GRAVITY=2200, BOUNCE_V=980, SPRING_V=1750, MAX_GAP=180;
function paramsForAltitude(alt){
  const t=Math.min(1,Math.max(0,alt)/15000);
  P4A.gap=70+90*t;
  P4A.movingProb=0.3*Math.min(1,Math.max(0,alt)/6000);
  P4A.breakProb=0.25*Math.min(1,Math.max(0,alt)/9000);
  P4A.springProb=0.1-0.04*t;
  P4A.moveSpeed=40+80*t;
  return P4A;
}
const P4A={gap:0,movingProb:0,breakProb:0,springProb:0,moveSpeed:0}; // reused
function genPlatform(lastY,rand,W){
  const p=paramsForAltitude(lastY);
  const gap=Math.min(MAX_GAP,p.gap*(0.7+0.6*rand()));
  const w=Math.round(88-Math.min(20,lastY/1000));
  const y=lastY+gap;
  const x=rand()*(W-w);
  let type=0;
  const r=rand();
  if(r<p.movingProb) type=1;
  else if(r<p.movingProb+p.breakProb) type=2;
  const spr=type===0&&rand()<p.springProb;
  return {x:x,y:y,w:w,type:type,spr:spr,phase:rand()*6.283,spd:p.moveSpeed,dead:false,fv:0,sprT:0,cx:0,amp:0};
}

// ── State ─────────────────────────────────────────────────────────────────
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=function(id){return document.getElementById(id);};
let W=0,H=0,PR=17,FO=15;         // player radius, foot offset
let FONT_BIG='',FONT_SM='';
let plats=[], camY=-80, maxAlt=0, meters=0, shownM=-1;
let best=+(localStorage.getItem(KEY)||0);
let state='ready';               // ready | run | over
let px=0, py=0, pvy=0, ptx=0, sq=0, look=0;
let steering=false, acc=0, lastT=0, tNow=0;
// parallax dot layers (allocated once)
const DOTS1=[], DOTS2=[], TILE=1400;
for(let i=0;i<26;i++) DOTS1.push({x:Math.random(),y:Math.random()*TILE});
for(let i=0;i<18;i++) DOTS2.push({x:Math.random(),y:Math.random()*TILE});

function layout(){
  const wrap=document.getElementById('wrap');
  const availW=Math.min(wrap.clientWidth-52, 520);
  const availH=Math.max(360, window.innerHeight-235);
  const k=W?availW/W:1;
  W=Math.round(availW); H=Math.round(Math.min(availW*1.7, availH));
  cv.width=W*devicePixelRatio; cv.height=H*devicePixelRatio;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  FONT_BIG='bold 22px -apple-system,sans-serif';
  FONT_SM='600 15px -apple-system,sans-serif';
  if(k!==1&&isFinite(k)){ px*=k; ptx*=k; for(let i=0;i<plats.length;i++){ const p=plats[i]; p.x*=k; p.cx*=k; p.amp*=k; } }
}
function setupMoving(p){ p.amp=Math.max(10,(W-p.w)/2-4); p.cx=(W-p.w)/2; }
function genUntil(topY){
  let lastY=plats.length?plats[plats.length-1].y:0;
  while(lastY<topY){
    const p=genPlatform(lastY,Math.random,W);
    if(p.type===1) setupMoving(p);
    plats.push(p);
    lastY=p.y;
  }
}
function reset(){
  plats.length=0;
  plats.push({x:W/2-60,y:0,w:120,type:0,spr:false,phase:0,spd:0,dead:false,fv:0,sprT:0,cx:0,amp:0});
  camY=-80; maxAlt=0; meters=0; shownM=-1;
  px=W/2; py=FO; pvy=0; ptx=px; sq=0; look=0; steering=false;
  genUntil(camY+H+200);
  state='ready'; hud();
}
function startRun(){ state='run'; pvy=BOUNCE_V; sq=1; GBLB.start(); }
function hud(){
  if(meters!==shownM){ shownM=meters; $('hAlt').textContent='Sky Jump · '+meters+MSG.m; }
  $('hBest').textContent='★ '+Math.max(best,meters)+MSG.m;
}

// ── Input: finger x = target x (also covers left/right half-screen holds) ─
function cx(ev){ const rc=cv.getBoundingClientRect(); return (ev.clientX-rc.left)*(W/rc.width); }
function down(ev){ ev.preventDefault();
  try{cv.setPointerCapture(ev.pointerId);}catch(e){}
  if(state==='ready') startRun();
  if(state!=='run') return;
  steering=true; ptx=cx(ev);
}
function move(ev){ if(!steering) return; ev.preventDefault(); ptx=cx(ev); }
function up(ev){
  try{cv.releasePointerCapture(ev.pointerId);}catch(e){}
  if(steering){ steering=false; ptx=px; } // finger up → hold position
}
cv.addEventListener('pointerdown',down); cv.addEventListener('pointermove',move);
cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up); window.addEventListener('pointerup',up);
// iOS in-app webviews ignore touch-action:none for scroll suppression — a
// non-passive touchmove preventDefault is the only reliable way to keep the
// board drag from scrolling the page.
cv.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
// Desktop fallback: ←/→ (or A/D) steer, Space/Enter launches & replays.
let kb=0;
function kdir(k){ if(k==='ArrowLeft'||k==='a'||k==='A')return -1; if(k==='ArrowRight'||k==='d'||k==='D')return 1; return 0; }
addEventListener('keydown',function(e){
  const d=kdir(e.key);
  if(d){ kb=d; e.preventDefault(); return; }
  if(e.key===' '||e.key==='Enter'){
    e.preventDefault();
    if(state==='ready') startRun();
    else if(state==='over'){ $('over').style.display='none'; reset(); }
  }
});
addEventListener('keyup',function(e){ if(kdir(e.key)===kb&&kb!==0) kb=0; });

// ── Simulation (fixed timestep) ───────────────────────────────────────────
const STEP=1/120;
function phys(dt){
  if(state!=='run') return;
  // steer: smooth lerp toward the finger x (keyboard nudges the target)
  if(kb&&!steering) ptx=px+kb*50;
  const dx0=ptx-px;
  px+=dx0*Math.min(1,10*dt);
  look=Math.max(-1,Math.min(1,dx0/60));
  // wrap at edges
  if(px<-PR) px+=W+2*PR; else if(px>W+PR) px-=W+2*PR;
  const prevFeet=py-FO;
  pvy-=GRAVITY*dt; py+=pvy*dt;
  const feet=py-FO;
  if(pvy<0){
    for(let i=0;i<plats.length;i++){
      const p=plats[i];
      if(p.dead) continue;
      if(prevFeet>=p.y&&feet<=p.y&&p.y<prevFeet+400){
        const pxx=p.type===1?p.cx+Math.sin(tNow*p.spd/100+p.phase)*p.amp:p.x;
        if(px>pxx-PR*0.7&&px<pxx+p.w+PR*0.7){
          py=p.y+FO;
          pvy=p.spr?SPRING_V:BOUNCE_V;
          sq=1;
          if(p.spr) p.sprT=1;
          if(p.type===2){ p.dead=true; p.fv=0; }
          break;
        }
      }
    }
  }
  if(sq>0) sq-=3.2*dt;
  // dead breakables crumble downward
  for(let i=0;i<plats.length;i++){ const p=plats[i]; if(p.dead){ p.fv+=GRAVITY*0.4*dt; p.y-=p.fv*dt; } if(p.sprT>0)p.sprT-=4*dt; }
  // camera follows up only
  if(py-H*0.65>camY) camY=py-H*0.65;
  if(py>maxAlt){ maxAlt=py; const m=Math.floor(maxAlt/100); if(m!==meters){ meters=m; hud(); } }
  genUntil(camY+H+200);
  // recycle passed platforms
  while(plats.length&&plats[0].y<camY-80) plats.shift();
  // fell below the screen → game over
  if(py<camY-40) gameOver();
}
function gameOver(){
  state='over';
  const nb=meters>best;
  if(nb){ best=meters; try{localStorage.setItem(KEY,String(best));}catch(e){} }
  GBLB.report(meters);
  $('ovT').textContent=MSG.over;
  $('ovScore').textContent=MSG.score+meters+MSG.m;
  $('ovBest').textContent=nb?MSG.nb:(MSG.best+best+MSG.m);
  $('again').textContent=MSG.again;
  $('over').style.display='grid';
}
$('again').onclick=function(){ $('over').style.display='none'; reset(); };
$('restart').onclick=function(){ $('over').style.display='none'; reset(); };

// ── Rendering ─────────────────────────────────────────────────────────────
function sy(wy){ return H-(wy-camY); }
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function dots(list,f,rad,alpha){
  ctx.fillStyle='rgba(59,91,219,'+alpha+')';
  for(let i=0;i<list.length;i++){
    const d=list[i];
    let yy=(d.y-camY*f)%TILE; if(yy<0)yy+=TILE;
    ctx.beginPath(); ctx.arc(d.x*W,H-yy,rad,0,7); ctx.fill();
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // parallax background dots
  dots(DOTS1,0.35,2,0.10);
  dots(DOTS2,0.6,3,0.16);
  // platforms
  for(let i=0;i<plats.length;i++){
    const p=plats[i];
    const yy=sy(p.y);
    if(yy<-30||yy>H+40) continue;
    const pxx=p.type===1?p.cx+Math.sin(tNow*p.spd/100+p.phase)*p.amp:p.x;
    if(p.type===2){
      ctx.globalAlpha=p.dead?0.55:1;
      ctx.fillStyle='#ced4da'; rr(pxx,yy,p.w,13,6); ctx.fill();
      ctx.strokeStyle='#868e96'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(pxx+p.w*0.3,yy+2); ctx.lineTo(pxx+p.w*0.45,yy+7); ctx.lineTo(pxx+p.w*0.35,yy+11); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(pxx+p.w*0.68,yy+2); ctx.lineTo(pxx+p.w*0.6,yy+8); ctx.stroke();
      ctx.globalAlpha=1;
    } else {
      ctx.fillStyle=p.type===1?'#f59f00':'#4dabf7'; rr(pxx,yy,p.w,13,6); ctx.fill();
    }
    if(p.spr){
      // spring pad: compress on use
      const k=p.sprT>0?p.sprT:0;
      const sh=12-6*k;
      ctx.fillStyle='#e64980';
      rr(pxx+p.w/2-11,yy-sh,22,sh+3,3); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.fillRect(pxx+p.w/2-7,yy-sh+3,14,2);
    }
  }
  // blob character (squash & stretch)
  const yb=sy(py);
  let scx=1,scy=1;
  if(sq>0){ scx=1+0.28*sq; scy=1-0.34*sq; }
  else if(pvy>500){ const st=Math.min(0.22,(pvy-500)/3000); scx=1-st; scy=1+st; }
  ctx.save();
  ctx.translate(px,yb);
  ctx.scale(scx,scy);
  ctx.fillStyle='#51cf66';
  ctx.beginPath(); ctx.arc(0,0,PR,0,7); ctx.fill();
  ctx.strokeStyle='#2f9e44'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,PR,0,7); ctx.stroke();
  // eyes follow the steer direction
  const ex=look*3;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(-5.5+ex,-4,4.6,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(5.5+ex,-4,4.6,0,7); ctx.fill();
  ctx.fillStyle='#1a1a1a';
  ctx.beginPath(); ctx.arc(-5.5+ex*1.6,-4,2.1,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(5.5+ex*1.6,-4,2.1,0,7); ctx.fill();
  ctx.restore();
  // ready hint
  if(state==='ready'){
    const a=0.55+0.35*Math.sin(tNow*3);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(26,26,26,'+a+')'; ctx.font=FONT_BIG;
    ctx.fillText(MSG.tap,W/2,H*0.4);
    ctx.fillStyle='rgba(85,85,85,0.8)'; ctx.font=FONT_SM;
    ctx.fillText(MSG.drag,W/2,H*0.4+30);
  }
}

// ── Main loop ─────────────────────────────────────────────────────────────
function tick(ts){
  tNow=ts/1000;
  let dt=(ts-lastT)/1000; lastT=ts;
  if(dt>0.05) dt=0.05;
  acc+=dt;
  while(acc>=STEP){ phys(STEP); acc-=STEP; }
  draw();
  requestAnimationFrame(tick);
}
addEventListener('resize',function(){ layout(); });
layout(); reset();
requestAnimationFrame(function(ts){ lastT=ts; requestAnimationFrame(tick); });
</script>
</body>
