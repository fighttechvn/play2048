<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
/* iOS 12 / old WebKit have no Pointer Events — the games drive all input through
   pointerdown/move/up (+ setPointerCapture). Bridge touch (and old-desktop mouse)
   into synthetic pointer events so swiping/drawing works. No-op on modern engines. */
(function () {
  if (window.PointerEvent) return;
  var EP = window.Element && Element.prototype;
  if (EP && !EP.setPointerCapture) {
    EP.setPointerCapture = function () {};
    EP.releasePointerCapture = function () {};
    EP.hasPointerCapture = function () { return false; };
  }
  function mk(type, x, y, id, ptype) {
    var e;
    try { e = new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: x, clientY: y }); }
    catch (_) { e = document.createEvent("MouseEvents"); e.initMouseEvent(type, true, true, window, 0, 0, 0, x, y, false, false, false, false, 0, null); }
    e.pointerId = id; e.pointerType = ptype; e.isPrimary = true;
    e.pressure = type === "pointerup" || type === "pointercancel" ? 0 : 0.5;
    e.width = 1; e.height = 1;
    return e;
  }
  // --- touch → pointer (move/up go to the start target, mimicking pointer capture) ---
  var startTarget = null, touchActive = false, lastTouch = 0;
  function relay(type, touch, target) {
    var ev = mk(type, touch.clientX, touch.clientY, (touch.identifier || 0) + 1, "touch");
    return target.dispatchEvent(ev); // false if a handler called preventDefault()
  }
  document.addEventListener("touchstart", function (e) {
    touchActive = true; lastTouch = e.timeStamp || 0; startTarget = e.target;
    if (!relay("pointerdown", e.changedTouches[0], startTarget)) e.preventDefault();
  }, { passive: false });
  document.addEventListener("touchmove", function (e) {
    lastTouch = e.timeStamp || 0;
    if (!relay("pointermove", e.changedTouches[0], startTarget || e.target)) e.preventDefault();
  }, { passive: false });
  function end(type) {
    return function (e) {
      touchActive = false; lastTouch = e.timeStamp || 0;
      relay(type, e.changedTouches[0], startTarget || e.target); startTarget = null;
    };
  }
  document.addEventListener("touchend", end("pointerup"), { passive: false });
  document.addEventListener("touchcancel", end("pointercancel"), { passive: false });
  // --- mouse → pointer (old desktop); skip the synthetic mouse burst after a touch ---
  function fromMouse(type) {
    return function (e) {
      if (touchActive || (e.timeStamp || 0) - lastTouch < 700) return;
      e.target.dispatchEvent(mk(type, e.clientX, e.clientY, 1, "mouse"));
    };
  }
  document.addEventListener("mousedown", fromMouse("pointerdown"), true);
  document.addEventListener("mousemove", fromMouse("pointermove"), true);
  document.addEventListener("mouseup", fromMouse("pointerup"), true);
})();
</script>

<style>
  :root{--bg:#f2f0eb;--card:#fff;--ink:#1a1a1a;--field:#eceae3;--accent:#f2c14e;--accent2:#c8931f;--warn:#e03131;--btn:#fff;--bd:#d0d0d0}

  html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);overscroll-behavior:none}
  #wrap{max-width:560px;margin:0 auto;padding:calc(62px + var(--saa-top, env(safe-area-inset-top, 0px))) calc(16px + var(--saa-right, env(safe-area-inset-right, 0px))) calc(16px + var(--saa-bottom, env(safe-area-inset-bottom, 0px))) calc(16px + var(--saa-left, env(safe-area-inset-left, 0px)));display:flex;flex-direction:column;gap:14px;min-height:100%}
  /* the wrapper's top pad clears the host's floating chrome (back button left,
     leaderboard button right), so this row gets the full width */
  .top{display:flex;align-items:center;gap:8px;min-height:44px}
  .pill{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap;font-size:14px}
  #ttl{margin-right:auto}
  .board{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px}
  canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:8px}
  .btns{display:flex;gap:12px}
  .btn{flex:1;padding:14px;border-radius:999px;border:1px solid var(--bd);background:var(--btn);font-weight:700;font-size:16px;cursor:pointer}
  .btn:disabled{opacity:.45}
  .help{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 18px;font-size:14.5px;color:#555;line-height:1.5}
  .win{position:fixed;top:0;right:0;bottom:0;left:0;display:none;place-items:center;background:rgba(0,0,0,.5);z-index:9}
  .win div{background:#fff;border-radius:18px;padding:28px 32px;text-align:center;max-width:300px}
  .win h2{margin:0 0 6px}.win p{margin:0;color:#555;font-size:15px;line-height:1.5}
  .win button{margin-top:14px;padding:12px 26px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
  .pad{display:grid;direction:ltr;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:-4px;width:100%;max-width:380px;margin-left:auto;margin-right:auto}
  .pb{padding:0;border-radius:14px;border:1px solid var(--bd);background:#fff;font-size:30px;font-weight:700;cursor:pointer;color:var(--ink);touch-action:manipulation;min-height:74px}
  .pb:active{background:#fdf3d9}
  /* every key placed by hand: auto-flow carries on *after* an explicitly
     placed cell, so pinning only the up key pushes left into column 3. */
  #bu{grid-column:2;grid-row:1}
  #bl{grid-column:1;grid-row:2}
  #bd{grid-column:2;grid-row:2}
  #br{grid-column:3;grid-row:2}

  .swp{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:150px;padding:12px 16px;border-radius:18px;border:2px dashed var(--bd);background:var(--card);color:#8c8c8c;font-weight:700;font-size:14.5px;text-align:center;line-height:1.4;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

    en:"<b>How to play.</b> Steer with <b>▲ ◀ ▼ ▶</b> or swipe the maze, and eat every pellet to clear the level. A held direction waits for the next opening, so you can set up a turn early. The four big pellets in the corners flip the hunters for a few seconds — eat them then and each one is worth double the last, up to 1600. The corridor across the middle wraps from one side of the maze to the other, and the hunters take it more slowly than you do. Twenty mazes, three lives, and a fresh maze carved every level.",
    vi:"<b>Cách chơi.</b> Điều khiển bằng <b>▲ ◀ ▼ ▶</b> hoặc vuốt trên mê cung, ăn hết các hạt để qua màn. Giữ một hướng thì lệnh sẽ chờ đến ngã rẽ tiếp theo, nên bạn có thể ra lệnh sớm. Bốn hạt lớn ở góc làm bọn săn đuổi hoảng sợ trong vài giây — ăn chúng lúc đó, con sau gấp đôi con trước, tối đa 1600 điểm. Hành lang giữa mê cung nối thông hai bên, và bọn săn đuổi đi qua đó chậm hơn bạn. Hai mươi mê cung, ba mạng, và mỗi màn là một mê cung hoàn toàn mới.",
    ko:"<b>플레이 방법.</b> <b>▲ ◀ ▼ ▶</b> 또는 미로를 스와이프해 움직이고, 모든 알갱이를 먹으면 레벨 클리어입니다. 방향을 누르고 있으면 다음 갈림길에서 자동으로 꺾이므로 미리 입력해 두세요. 모서리의 큰 알갱이 4개는 몇 초간 추격자를 겁먹게 합니다 — 그때 잡아먹으면 200, 400, 800, 1600점으로 배가 됩니다. 미로 가운데의 통로는 좌우로 이어지며, 추격자는 당신보다 느리게 지나갑니다. 20개의 미로, 3개의 목숨, 레벨마다 새로 생성되는 미로.",
    zh:"<b>玩法。</b> 用 <b>▲ ◀ ▼ ▶</b> 或在迷宫上滑动来移动，吃光所有豆子即可过关。按住某个方向，指令会等到下一个路口才执行，所以可以提前拐弯。四角的大豆子会让追捕者惊慌几秒——趁机吃掉它们，每只依次翻倍，最高 1600 分。迷宫中间的通道左右相连，追捕者通过时比你慢。二十座迷宫，三条命，每关都是全新生成的迷宫。",
    ja:"<b>遊び方。</b> <b>▲ ◀ ▼ ▶</b> か迷路をスワイプして操作し、すべてのペレットを食べればレベルクリア。方向を押し続けると次の曲がり角まで指示が残るので、早めに入力できます。四隅の大きなペレットを取ると数秒間ハンターが怯えます — その間に食べると 200・400・800・1600 と倍々に。迷路中央の通路は左右がつながっており、ハンターはそこを通るのが遅くなります。20の迷路、3つの残機、レベルごとに新しく生成される迷路。",
    ar:"<b>طريقة اللعب.</b> تحرّك بـ <b>▲ ◀ ▼ ▶</b> أو مرّر إصبعك على المتاهة، وكُل كل الحبيبات لإنهاء المستوى. الاتجاه المضغوط ينتظر أول فتحة قادمة، فيمكنك تجهيز المنعطف مبكرًا. الحبيبات الأربع الكبيرة في الزوايا تُرعب المطاردين لثوانٍ — كُلهم حينها وتتضاعف قيمة كل واحد حتى 1600. الممر الأوسط يصل طرفَي المتاهة، والمطاردون يعبرونه أبطأ منك. عشرون متاهة، وثلاث محاولات، ومتاهة جديدة تُرسم في كل مستوى."
  };
  var L=pick(),el=document.getElementById("helpcard");
  if(el){el.innerHTML=T[L]||T.en; if(L==="ar")el.dir="rtl";}

<script>
const LANG=(function(){var p=new URLSearchParams(location.search).get("lang");var raw=p||localStorage.getItem("gobrain.locale")||localStorage.getItem("CapacitorStorage.gobrain.locale")||navigator.language||"en";var c=String(raw).toLowerCase().split("-")[0];return ["en","vi","ko","zh","ja","ar"].indexOf(c)>=0?c:"en";})();
const UI={
  en:{"level":"Level","start":"Tap to start","hint":"Swipe to steer","paused":"Paused — tap to resume","over":"Game over","victory":"All twenty mazes cleared!","again":"Play again","restart":"Restart","score":"Score","best":"Best","cleared":"MAZE CLEAR","fruit":"BONUS!"},
  vi:{"level":"Màn","start":"Chạm để bắt đầu","hint":"Vuốt để đi","paused":"Tạm dừng — chạm để tiếp tục","over":"Kết thúc!","victory":"Qua trọn 20 mê cung!","again":"Chơi lại","restart":"Chơi lại","score":"Điểm","best":"Cao nhất","cleared":"QUA MÊ CUNG","fruit":"THƯỞNG!"},
  ko:{"level":"레벨","start":"탭하여 시작","hint":"스와이프로 이동","paused":"일시정지 — 탭하여 계속","over":"게임 오버","victory":"20개 미로 모두 클리어!","again":"다시 하기","restart":"다시 시작","score":"점수","best":"최고","cleared":"미로 클리어","fruit":"보너스!"},
  zh:{"level":"关卡","start":"点按开始","hint":"滑动移动","paused":"已暂停——点按继续","over":"游戏结束","victory":"二十座迷宫全通！","again":"再玩一次","restart":"重新开始","score":"分数","best":"最高","cleared":"迷宫通关","fruit":"奖励！"},
  ja:{"level":"レベル","start":"タップでスタート","hint":"スワイプで移動","paused":"一時停止中 — タップで再開","over":"ゲームオーバー","victory":"全20迷路クリア！","again":"もう一度","restart":"リスタート","score":"スコア","best":"ベスト","cleared":"迷路クリア","fruit":"ボーナス！"},
  ar:{"level":"المستوى","start":"انقر للبدء","hint":"مرّر للتحرك","paused":"متوقف — انقر للمتابعة","over":"انتهت اللعبة","victory":"أنهيت المتاهات العشرين!","again":"العب مجددًا","restart":"إعادة","score":"النقاط","best":"الأفضل","cleared":"اكتملت المتاهة","fruit":"مكافأة!"}
};
const M=UI[LANG]||UI.en;
const $=id=>document.getElementById(id);
// ── Controls: big keys, or one swipe pad in their place. The choice lives under
// one key shared by every arcade game, so it follows the player between games.
const CTRL=(function(){
  const KEY='gobrain.bg.controls';
  const L={en:['Buttons','Swipe'],vi:['Nút','Vuốt'],ko:['버튼','스와이프'],zh:['按键','滑动'],ja:['ボタン','スワイプ'],ar:['أزرار','سحب']}[LANG]||['Buttons','Swipe'];
  const H={"en":"Swipe here to turn","vi":"Vuốt ở đây để rẽ","ko":"여기를 스와이프해 방향 전환","zh":"在此滑动转向","ja":"ここをスワイプして方向転換","ar":"مرّر هنا للانعطاف"};
  let mode='buttons';
  try{ if(localStorage.getItem(KEY)==='swipe') mode='swipe'; }catch(e){}
  const bs=$('ctl').getElementsByTagName('button');
  function paint(){
    document.body.classList.toggle('swipe',mode==='swipe');
    for(let i=0;i<bs.length;i++) bs[i].classList.toggle('on',bs[i].getAttribute('data-m')===mode);
  }
  for(let i=0;i<bs.length;i++){
    bs[i].getElementsByTagName('span')[0].textContent=' '+L[i];
    bs[i].setAttribute('aria-label',L[i]);
    bs[i].addEventListener('click',function(){
      mode=this.getAttribute('data-m');
      try{ localStorage.setItem(KEY,mode); }catch(e){}
      paint();
    });
  }
  $('swph').textContent=H[LANG]||H.en;
  paint();
  return {swipe:function(){ return mode==='swipe'; }};
})();
if(LANG==='ar'){document.documentElement.dir='rtl';document.querySelector('#wino div').dir='rtl';}
// ── Leaderboard reporter (Go Brain) — mirrors the GBLB block in games/zip. ──
const GBLB=(function(){
  var GAME='chomp', t0=0;
  function base(){ try{var o=localStorage.getItem('gobrain.api.base'); if(o) return o.replace(/\/$/,'');}catch(e){}
    return (function(){try{var C=window.Capacitor||(window.parent&&window.parent.Capacitor);if(C&&typeof C.isNativePlatform==='function')return C.isNativePlatform();}catch(e){}return /^capacitor:|^ionic:/.test(location.protocol);})()?'https://gobrain.fighttech.vn/api/v1':'/api/v1'; }
  function token(){ try{return localStorage.getItem('CapacitorStorage.gobrain.player.token')||localStorage.getItem('gobrain.player.token');}catch(e){return null;} }
  function apiKey(){ try{return localStorage.getItem('gobrain.api.key')||'gobrain-dev-client-key';}catch(e){return 'gobrain-dev-client-key';} }
  function emit(name,params){ try{ if(window.parent&&window.parent!==window){ params=params||{}; params.game_id=GAME; window.parent.postMessage({__gb:1,name:name,params:params},'*'); } }catch(e){} }
  return {
    start:function(){ t0=Date.now(); emit('level_start',{}); },
    report:function(level){ var ms=t0?(Date.now()-t0):0; emit('level_complete',{level:level,duration_ms:ms});
      var tok=token(); if(!tok||!t0) return; t0=0;
      try{ fetch(base()+'/scores',{method:'POST',headers:{'content-type':'application/json','x-api-key':apiKey(),'authorization':'Bearer '+tok},
        body:JSON.stringify({gameId:GAME,level:level,durationMs:ms})}).catch(function(){}); }catch(e){} }
  };
})();
// ── Shared shell ───────────────────────────────────────────────────────────
// Canvas fit, fixed-step loop, d-pad / swipe / keyboard input, pause. Every
// bundle inlines this verbatim; the per-game body below supplies tick + draw.
const READY=0,PLAYING=1,CLEAR=2,DEAD=3,PAUSED=4;
const cv=$('cv'), ctx=cv.getContext('2d');
let phase=READY, U=1, CW=0, CH=0, dpr=1, lastT=0, acc=0;
const IN={dir:null,fire:false,tap:false,drag:null};

function fit(uw,uh){
  // clientWidth includes the card's padding; the canvas only ever gets the
  // content box, so measuring the parent alone stretches the backing store
  // wider than the element and squashes everything horizontally.
  const p=cv.parentNode, cs=window.getComputedStyle(p);
  const pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const cssW=Math.min(p.clientWidth-pad, 460);
  dpr=Math.min(3, window.devicePixelRatio||1);
  U=cssW/uw; CW=cssW; CH=cssW*uh/uw;
  cv.width=Math.round(CW*dpr); cv.height=Math.round(CH*dpr);
  cv.style.height=CH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function rr(x,y,w,h,r,c){ ctx.fillStyle=c; ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}else{
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);}
  ctx.closePath(); ctx.fill();
}
function overlayText(top,bottom){
  ctx.fillStyle='rgba(20,20,20,.62)'; ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='700 '+Math.round(CW*0.058)+'px -apple-system,system-ui,sans-serif';
  ctx.fillText(top, CW/2, CH/2-CW*0.03);
  if(bottom){ ctx.font='500 '+Math.round(CW*0.038)+'px -apple-system,system-ui,sans-serif';
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillText(bottom, CW/2, CH/2+CW*0.045); }
  ctx.textAlign='start'; ctx.textBaseline='alphabetic';
}
function onStart(){}      // overridden by the body
function onResume(){ lastT=0; }
function tapStart(){
  if(phase===READY){ onStart(); return true; }
  if(phase===PAUSED){ phase=PLAYING; onResume(); return true; }
  return false;
}
function bindPad(map){    // [[elementId, dir], …]
  map.forEach(function(p){
    const el=$(p[0]); if(!el)return;
    el.addEventListener('pointerdown',function(e){e.preventDefault(); tapStart(); IN.dir=p[1]; IN.tapDir=p[1];});
    ['pointerup','pointercancel','pointerleave'].forEach(function(k){
      el.addEventListener(k,function(){ if(IN.dir===p[1]) IN.dir=null; });
    });
  });
}
function bindFire(id){
  const el=$(id); if(!el)return;
  el.addEventListener('pointerdown',function(e){e.preventDefault(); if(tapStart())return; IN.fire=true; IN.tap=true;});
  ['pointerup','pointercancel','pointerleave'].forEach(function(k){ el.addEventListener(k,function(){IN.fire=false;}); });
}
// Canvas: drag to steer, tap to act — the whole game stays one-thumbed.
function bindCanvas(dirs, opts){
  opts=opts||{};
  let x0=0,y0=0,t0=0,moved=0,on=false;
  cv.addEventListener('pointerdown',function(e){
    const r=cv.getBoundingClientRect();
    x0=e.clientX; y0=e.clientY; t0=Date.now(); moved=0; on=true;
    IN.drag={x:(e.clientX-r.left)/U, y:(e.clientY-r.top)/U, down:true};
    if(cv.setPointerCapture)try{cv.setPointerCapture(e.pointerId);}catch(_){}
    if(tapStart())return;
    if(opts.tapDown){ IN.tap=true; IN.fire=true; }
  });
  cv.addEventListener('pointermove',function(e){
    if(!on)return;
    const r=cv.getBoundingClientRect();
    IN.drag={x:(e.clientX-r.left)/U, y:(e.clientY-r.top)/U, down:true};
    const dx=e.clientX-x0, dy=e.clientY-y0;
    moved=Math.max(moved,Math.abs(dx),Math.abs(dy));
    if(!dirs||moved<14)return;
    IN.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?dirs[1]:dirs[3]):(dy>0?dirs[2]:dirs[0]);
  });
  function end(){ if(!on)return; on=false;
    if(moved<12&&Date.now()-t0<340&&!opts.tapDown){ IN.tap=true; }
    IN.fire=false; if(dirs)IN.dir=null;
    if(IN.drag) IN.drag.down=false;
  }
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',function(){on=false; IN.fire=false; if(dirs)IN.dir=null; if(IN.drag)IN.drag.down=false;});

// Swipe pad — stands in for the keys when the player picks swipe controls.
// Every 14px of travel reads as a fresh flick, so one gesture can chain turns;
// the last direction is held until the finger lifts. A quick tap is the action.
//   o.dirs [up,right,down,left] · o.drag (finger x → field x) · o.move(dx,dy)
//   (relative, in field units) · o.tapFire · o.holdFire (fire while touching)
function bindSwipe(o){
  const el=$('swp'); if(!el)return;
  let x0=0,y0=0,t0=0,moved=0,on=false,pid=null;
  function drag(e){
    const r=el.getBoundingClientRect(), c=cv.getBoundingClientRect();
    IN.drag={x:(e.clientX-r.left)/r.width*c.width/U, y:(e.clientY-r.top)/r.height*c.height/U, down:true};
  }
  el.addEventListener('pointerdown',function(e){
    e.preventDefault(); if(on)return;
    x0=e.clientX; y0=e.clientY; t0=Date.now(); moved=0; on=true; pid=e.pointerId;
    el.classList.add('on');
    if(el.setPointerCapture)try{el.setPointerCapture(e.pointerId);}catch(_){}
    if(tapStart()){ moved=99; return; }
    if(o.drag) drag(e);
    if(o.holdFire) IN.fire=true;
  });
  el.addEventListener('pointermove',function(e){
    if(!on||e.pointerId!==pid)return;
    if(o.drag) drag(e);
    const dx=e.clientX-x0, dy=e.clientY-y0;
    if(o.move){
      moved+=Math.abs(dx)+Math.abs(dy); x0=e.clientX; y0=e.clientY;
      if(phase===PLAYING) o.move(dx*1.4/U, dy*1.4/U);
      return;
    }
    if(Math.abs(dx)<14&&Math.abs(dy)<14)return;
    moved+=14; x0=e.clientX; y0=e.clientY;
    if(!o.dirs)return;
    const d=Math.abs(dx)>Math.abs(dy)?(dx>0?o.dirs[1]:o.dirs[3]):(dy>0?o.dirs[2]:o.dirs[0]);
    if(d!==IN.dir) IN.tapDir=d;
    IN.dir=d;
  });
  function end(e,cancel){
    if(!on||e.pointerId!==pid)return; on=false;
    el.classList.remove('on');
    if(!cancel&&o.tapFire&&moved<12&&Date.now()-t0<340){ IN.tap=true; IN.fire=true; }
    if(o.holdFire) IN.fire=false;
    if(o.drag&&IN.drag) IN.drag.down=false;
    if(o.dirs) IN.dir=null;
  }
  el.addEventListener('pointerup',function(e){ end(e,false); });
  el.addEventListener('pointercancel',function(e){ end(e,true); });
  el.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
}
function bindKeys(dirs){
  const K={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3,W:0,D:1,S:2,A:3};
  document.addEventListener('keydown',function(e){
    if(e.key==='p'||e.key==='P'){ if(phase===PLAYING)phase=PAUSED; else if(phase===PAUSED){phase=PLAYING;onResume();} e.preventDefault(); return; }
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(tapStart())return; IN.fire=true; IN.tap=true; return; }
    const i=K[e.key]; if(i===undefined)return;
    e.preventDefault();
    if(tapStart())return;
    if(dirs) IN.dir=dirs[i];
    IN.tapDir=dirs?dirs[i]:i;
  });
  document.addEventListener('keyup',function(e){
    if(e.key===' '||e.key==='Enter'){ IN.fire=false; return; }
    const i=K[e.key]; if(i===undefined||!dirs)return;
    if(IN.dir===dirs[i]) IN.dir=null;
  });
  document.addEventListener('touchmove',function(e){if(phase===PLAYING)e.preventDefault();},{passive:false});
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden'&&phase===PLAYING){phase=PAUSED;lastT=0;} });
}
// Fixed-step driver: tick() runs at exactly `hz`, draw() once per frame.
function run(tick, draw, hz){
  const stepMs=1000/(hz||60);
  (function frame(ts){
    requestAnimationFrame(frame);
    if(!lastT) lastT=ts;
    const dt=Math.min(150, ts-lastT); lastT=ts;
    if(phase===PLAYING){
      acc+=dt; let guard=0;
      while(acc>=stepMs && guard++<8){ acc-=stepMs; if(tick()===false) break; }
    } else acc=0;
    draw();
  })(0);
}
addEventListener('resize',function(){ if(typeof relayout==='function') relayout(); });
// ── Pure rules — inlined verbatim from logic.mjs (the tests import that file). ──
// ── Pellet Run — pure rules ────────────────────────────────────────────────
// A maze eater. The maze is carved fresh every level (left half, then
// mirrored, then braided open), so no two runs are the same board; what the
// curve tunes is how much of the maze the hunters can cover before you clear
// it. Nothing in here touches the DOM: index.html inlines this file verbatim
// and the tests import it.
//
// Everything moves cell-to-cell. An actor sits on (x, y), is travelling toward
// (nx, ny), and `p` is how far along it is, 0 → 1. That makes the whole game
// exactly reproducible from a seed, and makes "did they collide" a question
// about two cells rather than about two floats.

const COLS = 19;
const ROWS = 19;
const TUNNEL_ROW = 9;                // a corridor all the way across, and it wraps
const PEN_ROW = 7;                   // where the hunters live
const PEN_X = [8, 9, 10];
const START = { x: 9, y: 15 };
const LEVELS = 20;

const CONFIG = {
  lives: 3,
  playerSpeed: 1 / 8,                       // cells per tick
  fleeSlow: 0.6,                            // a frightened hunter is a slow hunter
  eyesSpeed: 0.28,                          // and a dead one hurries home
  pellet: 10,
  power: 50,
  hunterBase: 200,                          // 200 / 400 / 800 / 1600 in one power window
  fruitAt: [0.36, 0.72],                    // fractions of the board eaten
  fruitLife: 540,
  clearBonus: 500,
  lifeBonus: 250,
  deathFreeze: 70,
  penHold: 40,                              // ticks a respawned hunter waits in the pen
};

const KINDS = ["chaser", "ambusher", "flanker", "wanderer"];
const DIRS = [
  { name: "up", dx: 0, dy: -1 },
  { name: "left", dx: -1, dy: 0 },
  { name: "down", dx: 0, dy: 1 },
  { name: "right", dx: 1, dy: 0 },
];
const DIR_BY_NAME = {};
for (let i = 0; i < DIRS.length; i++) DIR_BY_NAME[DIRS[i].name] = i;
const OPPOSITE = { up: "down", down: "up", left: "right", right: "left" };

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const ease = (t) => t * t * (3 - 2 * t);

/**
 * The curve. `braid` is the knob that carries most of it: a fully braided maze
 * has no dead ends, so there is always a way out of a squeeze, and closing that
 * down level by level is what turns a stroll into a chase. Hunter count and
 * speed do the rest; the power pellets are the relief valve, and they get taken
 * away last.
 */
function paramsForLevel(i) {                       // i is 0-based
  const n = i + 1;
  const lin = i / (LEVELS - 1);
  // Straight line blended back into the smoothstep: easing alone leaves the
  // first four levels indistinguishable, which is four levels of tutorial for a
  // game whose tutorial is one level long.
  const t = 0.5 * lin + 0.5 * ease(lin);
  // Every fifth level is the breather — but never the last one, because a
  // finale that hands the player a rest is not a finale.
  const relief = n % 5 === 0 && n !== LEVELS ? 0.78 : 1;
  const r3 = (v) => Math.round(v * 1000) / 1000;
  return {
    n,
    hunters: Math.min(4, 2 + (t >= 0.16 ? 1 : 0) + (t >= 0.42 ? 1 : 0)),
    // The eater moves at 0.125 cells/tick. Hunters top out just under that, so
    // a straight footrace is always winnable and the danger stays positional —
    // pin the player between two of them and the speed never mattered.
    hunterSpeed: r3((0.085 + 0.028 * t) * relief),
    scatter: Math.round((250 - 150 * t) / relief),        // relief buys scatter time back
    chase: Math.round((360 + 540 * t) * relief),
    flee: Math.round((400 - 235 * t) * (relief < 1 ? 1.35 : 1)),
    // Braiding knocks out dead ends. Late mazes keep about two thirds of them
    // open: a maze with no loops left is not harder, it is just a series of
    // corridors you die in for having entered.
    braid: r3(0.95 - 0.33 * t * relief),
    powers: t < 0.3 ? 4 : t < 0.65 ? 3 : 2,
    fruit: 100 + Math.round(t * 400),
  };
}

// ── the maze ───────────────────────────────────────────────────────────────
const idx = (x, y) => y * COLS + x;
const wallAt = (w, x, y) => (x < 0 || x >= COLS || y < 0 || y >= ROWS ? 1 : w.grid[idx(x, y)]);

/** Wrap x on the tunnel row; everything else is bounded by the frame. */
function ahead(x, y, dirName) {
  const d = DIRS[DIR_BY_NAME[dirName]];
  let nx = x + d.dx;
  const ny = y + d.dy;
  if (y === TUNNEL_ROW && ny === TUNNEL_ROW) {
    if (nx < 0) nx = COLS - 1;
    else if (nx >= COLS) nx = 0;
  }
  return { x: nx, y: ny };
}
const open = (w, x, y, dirName) => {
  const n = ahead(x, y, dirName);
  return wallAt(w, n.x, n.y) === 0 ? n : null;
};

/**
 * Carve the left half with a recursive backtracker, mirror it, then braid.
 * Mirroring keeps the board readable — a symmetric maze reads as designed
 * rather than as noise — and it cannot disconnect anything, because both halves
 * hang off the centre column the carver already spanned.
 */
function carve(rand, braid) {
  const g = new Uint8Array(COLS * ROWS).fill(1);
  const HC = 5, HR = 9;                                   // half-grid: cell cols 0..4, rows 0..8
  const cx = (c) => 1 + c * 2, cy = (r) => 1 + r * 2;
  const seen = new Uint8Array(HC * HR);
  const stack = [[0, 0]];
  seen[0] = 1; g[idx(cx(0), cy(0))] = 0;
  while (stack.length) {
    const [c, r] = stack[stack.length - 1];
    const opts = [];
    if (r > 0 && !seen[(r - 1) * HC + c]) opts.push([c, r - 1]);
    if (r < HR - 1 && !seen[(r + 1) * HC + c]) opts.push([c, r + 1]);
    if (c > 0 && !seen[r * HC + (c - 1)]) opts.push([c - 1, r]);
    if (c < HC - 1 && !seen[r * HC + (c + 1)]) opts.push([c + 1, r]);
    if (!opts.length) { stack.pop(); continue; }
    const [nc, nr] = opts[Math.floor(rand() * opts.length)];
    seen[nr * HC + nc] = 1;
    g[idx(cx(nc), cy(nr))] = 0;
    g[idx((cx(c) + cx(nc)) / 2, (cy(r) + cy(nr)) / 2)] = 0;
    stack.push([nc, nr]);
  }
  // mirror: column 9 is the axis and stays as carved
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < 9; x++) g[idx(COLS - 1 - x, y)] = g[idx(x, y)];

  // Braid: every dead end that survives is a place the player can be trapped in,
  // so `braid` is literally how forgiving the level is.
  const deadEnds = [];
  for (let y = 1; y < ROWS - 1; y += 2) for (let x = 1; x < COLS - 1; x += 2) {
    if (g[idx(x, y)]) continue;
    let n = 0;
    for (const d of DIRS) if (!g[idx(x + d.dx, y + d.dy)]) n++;
    if (n <= 1) deadEnds.push([x, y]);
  }
  for (const [x, y] of deadEnds) {
    if (rand() >= braid) continue;
    const walls = [];
    for (const d of DIRS) {
      const wx = x + d.dx, wy = y + d.dy, bx = x + d.dx * 2, by = y + d.dy * 2;
      if (bx < 1 || bx > COLS - 2 || by < 1 || by > ROWS - 2) continue;
      if (g[idx(wx, wy)] && !g[idx(bx, by)]) walls.push([wx, wy]);
    }
    if (!walls.length) continue;
    const [wx, wy] = walls[Math.floor(rand() * walls.length)];
    g[idx(wx, wy)] = 0;
    g[idx(COLS - 1 - wx, wy)] = 0;                        // keep the mirror honest
  }

  // the tunnel highway, and the pen it feeds
  for (let x = 0; x < COLS; x++) g[idx(x, TUNNEL_ROW)] = 0;
  for (const x of PEN_X) g[idx(x, PEN_ROW)] = 0;
  g[idx(9, PEN_ROW + 1)] = 0;
  g[idx(START.x, START.y)] = 0;
  return g;
}

const isPen = (x, y) => (y === PEN_ROW && PEN_X.indexOf(x) >= 0) || (y === PEN_ROW + 1 && x === 9);

/** Floor cells, farthest-from-the-pen first — where the power pellets belong. */
function powerSpots(w, count) {
  const cells = [];
  for (let y = 1; y < ROWS - 1; y++) for (let x = 0; x < COLS; x++) {
    if (wallAt(w, x, y) || isPen(x, y) || y === TUNNEL_ROW) continue;
    if (x === START.x && y === START.y) continue;
    cells.push({ x, y, d: Math.abs(x - 9) + Math.abs(y - PEN_ROW) });
  }
  cells.sort((a, b) => b.d - a.d || a.y - b.y || a.x - b.x);
  const out = [];
  for (const c of cells) {
    if (out.length >= count) break;
    // spread them: two power pellets in the same corner is one power pellet
    if (out.some((o) => Math.abs(o.x - c.x) + Math.abs(o.y - c.y) < 8)) continue;
    out.push(c);
  }
  return out;
}

// ── actors ─────────────────────────────────────────────────────────────────
function place(a, x, y, dirName) {
  a.x = x; a.y = y; a.nx = x; a.ny = y; a.p = 0; a.dir = dirName;
}
function homeOf(i) {
  return i < 3 ? { x: PEN_X[i], y: PEN_ROW } : { x: 9, y: PEN_ROW + 1 };
}

function createGame(level, rand, carry) {
  const w = {
    level,
    tick: 0,
    grid: carve(rand, level.braid),
    pellets: null,
    pelletsLeft: 0,
    pelletsTotal: 0,
    eaten: 0,
    player: { x: 0, y: 0, nx: 0, ny: 0, p: 0, dir: "left", want: null },
    hunters: [],
    mode: "scatter",
    modeT: level.scatter,
    modeIdx: 0,
    fleeT: 0,
    chain: 0,
    fruit: null,
    fruitDone: 0,
    lives: carry ? carry.lives : CONFIG.lives,
    score: carry ? carry.score : 0,
    deaths: 0,
    eatenHunters: 0,
    freeze: 0,
    won: false,
    over: false,
    reason: null,
  };
  w.pellets = new Uint8Array(COLS * ROWS);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (wallAt(w, x, y) || isPen(x, y)) continue;
    if (x === START.x && y === START.y) continue;
    w.pellets[idx(x, y)] = 1;
  }
  for (const s of powerSpots(w, level.powers)) w.pellets[idx(s.x, s.y)] = 2;
  for (let i = 0; i < w.pellets.length; i++) if (w.pellets[i]) w.pelletsTotal++;
  w.pelletsLeft = w.pelletsTotal;
  resetActors(w);
  return w;
}

function resetActors(w) {
  const p = w.player;
  place(p, START.x, START.y, "left");
  p.want = null;
  w.hunters = [];
  for (let i = 0; i < w.level.hunters; i++) {
    const h = { kind: KINDS[i], mode: "hunt", fleeT: 0, hold: i * CONFIG.penHold, home: homeOf(i) };
    place(h, h.home.x, h.home.y, i % 2 ? "left" : "right");
    w.hunters.push(h);
  }
  w.mode = "scatter"; w.modeT = w.level.scatter; w.modeIdx = 0;
  w.fleeT = 0; w.chain = 0;
}

// ── movement ───────────────────────────────────────────────────────────────
/**
 * Advance one actor by `speed` cells. Returns true on the tick it lands on a new
 * cell — every decision in the game hangs off that moment.
 */
function advance(w, a, speed, pick) {
  a.p += speed;
  if (a.p < 1) return false;
  a.p -= 1;
  a.x = a.nx; a.y = a.ny;
  const dir = pick(a);
  a.dir = dir;
  const n = dir ? open(w, a.x, a.y, dir) : null;
  if (n) { a.nx = n.x; a.ny = n.y; }
  else { a.nx = a.x; a.ny = a.y; a.p = 0; }
  return true;
}
/** A mid-move reversal is free: flip the ends and the progress with them. */
function reverse(a) {
  const ox = a.x, oy = a.y;
  a.x = a.nx; a.y = a.ny; a.nx = ox; a.ny = oy;
  a.p = 1 - a.p;
  a.dir = OPPOSITE[a.dir];
}
function legalDirs(w, x, y, exclude) {
  const out = [];
  for (const d of DIRS) {
    if (exclude && d.name === exclude) continue;
    if (open(w, x, y, d.name)) out.push(d.name);
  }
  return out;
}

/** Shortest x-distance on the board, tunnel included — the wrap is real cover. */
function dx(ax, bx) {
  const d = Math.abs(ax - bx);
  return Math.min(d, COLS - d);
}
const dist2 = (ax, ay, bx, by) => { const a = dx(ax, bx); return a * a + (ay - by) * (ay - by); };

const SCATTER_CORNER = [{ x: 1, y: 1 }, { x: COLS - 2, y: 1 }, { x: 1, y: ROWS - 2 }, { x: COLS - 2, y: ROWS - 2 }];

/**
 * Where a hunter wants to be. The four personalities differ only in this
 * function, and that is the whole of the AI: a chaser walks at you, an ambusher
 * walks at where you will be, a flanker walks at the far side of you from the
 * chaser, and a wanderer only closes in once it is already close.
 */
function hunterTarget(w, h, i) {
  const p = w.player;
  if (h.mode === "eyes") return h.home;
  if (h.mode === "flee") {                     // frightened: away from the player
    return { x: p.x < 9 ? COLS - 2 : 1, y: p.y < 9 ? ROWS - 2 : 1 };
  }
  if (w.mode === "scatter" && h.kind !== "chaser") return SCATTER_CORNER[i % 4];
  const d = DIRS[DIR_BY_NAME[p.dir]];
  switch (h.kind) {
    case "chaser": return { x: p.x, y: p.y };
    case "ambusher": return { x: p.x + d.dx * 4, y: p.y + d.dy * 4 };
    case "flanker": {
      const lead = { x: p.x + d.dx * 2, y: p.y + d.dy * 2 };
      const c = w.hunters[0];
      return { x: lead.x * 2 - c.x, y: lead.y * 2 - c.y };
    }
    default: {                                  // wanderer
      const far = dist2(h.x, h.y, p.x, p.y) > 49;
      return far ? SCATTER_CORNER[i % 4] : { x: p.x, y: p.y };
    }
  }
}

/** No reversing at a junction — that rule is what makes hunters chaseable. */
function pickHunterDir(w, h, i) {
  const opts = legalDirs(w, h.x, h.y, OPPOSITE[h.dir]);
  const list = opts.length ? opts : legalDirs(w, h.x, h.y, null);
  if (!list.length) return h.dir;
  const t = hunterTarget(w, h, i);
  let best = list[0], bestD = Infinity;
  for (const name of list) {                    // DIRS order breaks ties: up, left, down, right
    const n = ahead(h.x, h.y, name);
    const d = dist2(n.x, n.y, t.x, t.y);
    if (d < bestD) { bestD = d; best = name; }
  }
  return best;
}

// ── collisions, eating, dying ──────────────────────────────────────────────
function touching(p, h) {
  if (p.x === h.x && p.y === h.y) return true;
  if (p.nx === h.nx && p.ny === h.ny) return true;
  return p.x === h.nx && p.y === h.ny && p.nx === h.x && p.ny === h.y;
}
function addScore(w, n) { w.score += n; }

function eatAt(w, events) {
  const p = w.player;
  const k = idx(p.x, p.y);
  // The fruit first, and on its own: it sits on a cell whose pellet is usually
  // long gone by the time it appears, so gating it behind one would make it a
  // decoration rather than a reason to cross the board.
  if (w.fruit && p.x === w.fruit.x && p.y === w.fruit.y) {
    addScore(w, w.fruit.value);
    events.push({ type: "eatfruit", value: w.fruit.value });
    w.fruit = null;
  }
  const v = w.pellets[k];
  if (!v) return;
  w.pellets[k] = 0; w.pelletsLeft--; w.eaten++;
  if (v === 1) { addScore(w, CONFIG.pellet); events.push({ type: "pellet", x: p.x, y: p.y }); }
  else {
    addScore(w, CONFIG.power);
    w.fleeT = w.level.flee; w.chain = 0;
    for (const h of w.hunters) if (h.mode === "hunt") { h.mode = "flee"; reverse(h); }
    events.push({ type: "power", x: p.x, y: p.y });
  }
  const frac = 1 - w.pelletsLeft / w.pelletsTotal;
  if (w.fruitDone < CONFIG.fruitAt.length && frac >= CONFIG.fruitAt[w.fruitDone]) {
    w.fruitDone++;
    w.fruit = { x: 9, y: TUNNEL_ROW + 2 <= ROWS - 2 && !wallAt(w, 9, TUNNEL_ROW + 2) ? TUNNEL_ROW + 2 : TUNNEL_ROW, t: CONFIG.fruitLife, value: w.level.fruit };
    events.push({ type: "fruit", x: w.fruit.x, y: w.fruit.y });
  }
}

function die(w, events) {
  w.deaths++; w.lives--;
  events.push({ type: "death", lives: w.lives });
  if (w.lives <= 0) { w.over = true; w.reason = "caught"; events.push({ type: "gameover" }); return; }
  w.freeze = CONFIG.deathFreeze;
}

// ── the tick ───────────────────────────────────────────────────────────────
function step(w, input, rand) {
  const events = [];
  if (w.over) return events;
  w.tick++;

  if (input && input.dir) w.player.want = input.dir;

  if (w.freeze > 0) {
    if (--w.freeze === 0) resetActors(w);
    return events;
  }

  const p = w.player;
  // A reversal never has to wait for a cell edge — it is the one input that is
  // always legal, and making the player wait for it is how a maze game feels bad.
  if (p.want && p.want === OPPOSITE[p.dir] && (p.nx !== p.x || p.ny !== p.y)) {
    reverse(p); p.want = null;
  }
  const landed = advance(w, p, CONFIG.playerSpeed, (a) => {
    if (a.want && open(w, a.x, a.y, a.want)) { const d = a.want; a.want = null; return d; }
    if (open(w, a.x, a.y, a.dir)) return a.dir;
    return a.dir;                                  // nose to the wall, waiting for a turn
  });
  if (landed) eatAt(w, events);

  // the scatter / chase metronome, and the power window that overrides it
  if (w.fleeT > 0) {
    if (--w.fleeT === 0) {
      for (const h of w.hunters) if (h.mode === "flee") h.mode = "hunt";
      w.chain = 0;
      events.push({ type: "unfright" });
    }
  } else if (--w.modeT <= 0) {
    w.modeIdx++;
    w.mode = w.mode === "scatter" ? "chase" : "scatter";
    w.modeT = w.mode === "scatter" ? w.level.scatter : w.level.chase;
    for (const h of w.hunters) if (h.mode === "hunt") reverse(h);
    events.push({ type: "mode", mode: w.mode });
  }

  for (let i = 0; i < w.hunters.length; i++) {
    const h = w.hunters[i];
    if (h.hold > 0) { h.hold--; continue; }
    const speed = h.mode === "eyes" ? CONFIG.eyesSpeed
      : h.mode === "flee" ? w.level.hunterSpeed * CONFIG.fleeSlow
        : w.level.hunterSpeed;
    advance(w, h, speed, () => pickHunterDir(w, h, i));
    if (h.mode === "eyes" && h.x === h.home.x && h.y === h.home.y && h.p < speed) {
      h.mode = w.fleeT > 0 ? "flee" : "hunt";
      h.hold = CONFIG.penHold;
      events.push({ type: "revive", i });
    }
  }

  for (let i = 0; i < w.hunters.length; i++) {
    const h = w.hunters[i];
    if (h.mode === "eyes" || h.hold > 0) continue;
    if (!touching(p, h)) continue;
    if (h.mode === "flee") {
      w.chain = Math.min(4, w.chain + 1);
      w.eatenHunters++;
      const gain = CONFIG.hunterBase * Math.pow(2, w.chain - 1);
      addScore(w, gain);
      h.mode = "eyes";
      events.push({ type: "eat", i, gain, chain: w.chain, x: h.x, y: h.y });
    } else {
      die(w, events);
      return events;
    }
  }

  if (w.fruit && --w.fruit.t <= 0) { w.fruit = null; events.push({ type: "fruitgone" }); }

  if (w.pelletsLeft === 0) {
    w.won = true; w.over = true; w.reason = "clear";
    const bonus = CONFIG.clearBonus + w.lives * CONFIG.lifeBonus;
    addScore(w, bonus);
    w.bonus = bonus;
    events.push({ type: "clear", bonus });
  }
  void rand;
  return events;
}

function summary(w) {
  return {
    level: w.level.n,
    won: w.won,
    ticks: w.tick,
    score: w.score,
    lives: w.lives,
    deaths: w.deaths,
    pelletsLeft: w.pelletsLeft,
    pelletsTotal: w.pelletsTotal,
    eatenHunters: w.eatenHunters,
    bonus: w.bonus || 0,
    over: w.over,
    reason: w.reason,
  };
}
// ── Pellet Run: painting + the campaign ────────────────────────────────────
const BKEY='gobrain.chomp.best';
const C=6, TOP=11, BOT=8, UW=COLS*C, UH=ROWS*C+TOP+BOT;
let w=null, rand=Math.random, lvlIdx=0, best=+(localStorage.getItem(BKEY)||0)||0;
let pops=[], bits=[], banner=null, bannerT=0, inter=0, shake=0, dying=0, frame=0;
let maze=null, mazeU=0;

function relayout(){ fit(UW,UH); maze=null; paint(); }
function startLevel(i, carry){
  lvlIdx=i;
  w=createGame(paramsForLevel(i), rand, carry);
  pops=[]; bits=[]; shake=0; dying=0; inter=0; maze=null;
  banner=M.level+' '+(i+1); bannerT=80;
  GBLB.start(); lastT=0; acc=0; hud();
}
function newRun(){
  rand=mulberry32((Date.now()^0x9e3779b9)>>>0);
  $('wino').style.display='none';
  phase=PLAYING;
  startLevel(0,null);
}
onStart=newRun;
function hud(){
  if(!w)return;
  const s=summary(w);
  $('ttl').textContent=M.level+' '+s.level+'/'+LEVELS;
  $('sc').textContent=s.score.toLocaleString();
  $('bst').textContent='★ '+Math.max(best,s.score).toLocaleString();
}
function finish(won){
  phase=DEAD;
  const s=summary(w);
  best=Math.max(best,s.score);
  try{localStorage.setItem(BKEY,String(best));}catch(e){}
  $('overttl').textContent=won?M.victory:M.over;
  $('overmsg').textContent=M.level+' '+s.level+' · '+M.score+' '+s.score.toLocaleString()+' · '+M.best+' '+best.toLocaleString();
  $('again').textContent=M.again;
  $('wino').style.display='grid';
  hud();
}
function nextLevel(){
  if(lvlIdx+1>=LEVELS){ finish(true); return; }
  startLevel(lvlIdx+1,{lives:w.lives,score:w.score});
}

// ── input ──────────────────────────────────────────────────────────────────
bindPad([['bu','up'],['bl','left'],['bd','down'],['br','right']]);
bindCanvas(['up','right','down','left'],{});
bindSwipe({dirs:['up','right','down','left']});
bindKeys(['up','right','down','left']);
$('restart').onclick=newRun;
$('again').onclick=newRun;
$('restart').textContent=M.restart;
// A held direction is a standing request: the rules keep it until a corner can
// take it, so re-sending it every tick is what makes "turn at the next gap" work.
function pullDir(){ const d=IN.tapDir||IN.dir||null; IN.tapDir=null; return d; }

// ── tick ───────────────────────────────────────────────────────────────────
function tick(){
  frame++;
  if(dying>0){ dying--; return true; }
  if(inter>0){ if(--inter===0) nextLevel(); return true; }
  const evs=step(w,{dir:pullDir()},rand);
  for(const e of evs){
    if(e.type==='pellet'){ /* the quiet one */ }
    else if(e.type==='power'){ flashBits(e.x,e.y,10,'242,193,78'); }
    else if(e.type==='eat'){ pops.push({x:e.x,y:e.y,t:60,txt:'+'+e.gain}); flashBits(e.x,e.y,10,'110,200,255'); }
    else if(e.type==='eatfruit'){ pops.push({x:w.player.x,y:w.player.y,t:70,txt:'+'+e.value}); }
    else if(e.type==='fruit'){ banner=M.fruit; bannerT=60; }
    else if(e.type==='death'){ shake=16; dying=CONFIG.deathFreeze-6; flashBits(w.player.x,w.player.y,14,'242,193,78'); }
  }
  hud();
  if(w.over){
    if(w.won){ GBLB.report(lvlIdx+1); banner=M.cleared; bannerT=90; inter=80; return true; }
    finish(false); return false;
  }
  return true;
}
function flashBits(x,y,n,c){
  for(let i=0;i<n;i++) bits.push({x:x*C+C/2,y:y*C+C/2,
    vx:(Math.random()-0.5)*1.6,vy:(Math.random()-0.5)*1.6,t:24,c:c});
}

// ── painting ───────────────────────────────────────────────────────────────
const BG='#0d0d16', WALL='#2f49c8', WALL2='#5c74e8', DOT='#f0d9a8', POW='#f2c14e';
const GHOST=['#e8483d','#f09ad0','#5fd0e0','#f2a03d'];
function px(v){ return v*U; }
function my(v){ return (v+TOP)*U; }               // game-y → device-y, past the HUD

/**
 * The maze never changes inside a level, so it is painted once and blitted.
 * Wall cells are filled edge to edge and only the corners that face open
 * corridor are rounded — that is what turns nineteen squares a row into
 * something the eye reads as walls rather than as a field of buttons.
 */
function buildMaze(){
  const cw=Math.round(UW*U), ch=Math.round(ROWS*C*U), d=Math.min(3,window.devicePixelRatio||1);
  maze=document.createElement('canvas');
  maze.width=Math.round(cw*d); maze.height=Math.round(ch*d);
  const g=maze.getContext('2d');
  g.setTransform(d,0,0,d,0,0);
  g.fillStyle=BG; g.fillRect(0,0,cw,ch);
  const r=px(C*0.42), s=px(C), t=px(C*0.15);
  const solid=(x,y)=>(x<0||x>=COLS||y<0||y>=ROWS)?1:wallAt(w,x,y);
  /** One wall cell, with a radius per corner and each side pulled in by `in?`. */
  function cell(x,y,pad,fill){
    const up=solid(x,y-1),dn=solid(x,y+1),lf=solid(x-1,y),rt=solid(x+1,y);
    const X=px(x*C)+(lf?0:pad), Y=px(y*C)+(up?0:pad);
    const W=px(C)-(lf?0:pad)-(rt?0:pad), H=px(C)-(up?0:pad)-(dn?0:pad);
    const k=Math.max(0,r-pad);
    const tl=(!up&&!lf)?k:0, tr=(!up&&!rt)?k:0, br=(!dn&&!rt)?k:0, bl=(!dn&&!lf)?k:0;
    g.beginPath();
    g.moveTo(X+tl,Y);
    g.lineTo(X+W-tr,Y); if(tr) g.quadraticCurveTo(X+W,Y,X+W,Y+tr);
    g.lineTo(X+W,Y+H-br); if(br) g.quadraticCurveTo(X+W,Y+H,X+W-br,Y+H);
    g.lineTo(X+bl,Y+H); if(bl) g.quadraticCurveTo(X,Y+H,X,Y+H-bl);
    g.lineTo(X,Y+tl); if(tl) g.quadraticCurveTo(X,Y,X+tl,Y);
    g.closePath();
    g.fillStyle=fill; g.fill();
  }
  // Two passes rather than a stroke: stroking each cell would trace the edges
  // it shares with its neighbours too, and the maze would come out tiled.
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++) if(wallAt(w,x,y)) cell(x,y,0,WALL2);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++) if(wallAt(w,x,y)) cell(x,y,t,WALL);
  // the tunnel mouths are not walls, but they are not nothing either
  for(const x of [0,COLS-1]){
    g.fillStyle='rgba(92,116,232,.22)';
    g.fillRect(px(x*C),px(TUNNEL_ROW*C),px(C),px(C));
  }
  mazeU=U;
}
/** Interpolated position, minding the one seam the tunnel puts in the grid. */
function ipos(a){
  let dx=a.nx-a.x; if(dx>1)dx-=COLS; else if(dx<-1)dx+=COLS;
  let x=a.x+dx*a.p;
  if(x<-0.5)x+=COLS; else if(x>COLS-0.5)x-=COLS;
  return {x:x, y:a.y+(a.ny-a.y)*a.p};
}
function drawPellets(){
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const v=w.pellets[y*COLS+x];
    if(!v)continue;
    const cx=px(x*C+C/2), cy=my(y*C+C/2);
    if(v===1){ ctx.fillStyle=DOT; ctx.beginPath(); ctx.arc(cx,cy,px(C*0.15),0,7); ctx.fill(); }
    else{
      const pl=0.72+0.28*Math.sin(frame*0.13);
      ctx.fillStyle='rgba(242,193,78,'+(0.2*pl)+')';
      ctx.beginPath(); ctx.arc(cx,cy,px(C*0.52*pl),0,7); ctx.fill();
      ctx.fillStyle=POW; ctx.beginPath(); ctx.arc(cx,cy,px(C*0.3*pl),0,7); ctx.fill();
    }
  }
}
function drawFruit(){
  if(!w.fruit)return;
  if(w.fruit.t<120 && (frame>>3)%2)return;              // blinking out
  const cx=px(w.fruit.x*C+C/2), cy=my(w.fruit.y*C+C/2), r=px(C*0.26);
  ctx.fillStyle='#e0392b';
  ctx.beginPath(); ctx.arc(cx-r*0.55,cy+r*0.3,r,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+r*0.55,cy+r*0.3,r,0,7); ctx.fill();
  ctx.strokeStyle='#4caf50'; ctx.lineWidth=px(C*0.07); ctx.beginPath();
  ctx.moveTo(cx-r*0.5,cy); ctx.quadraticCurveTo(cx,cy-r*1.5,cx+r*0.5,cy); ctx.stroke();
}
const DVEC={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function drawPlayer(){
  const p=w.player, q=ipos(p), r=px(C*0.44);
  const cx=px(q.x*C+C/2), cy=my(q.y*C+C/2);
  if(dying>0){                                          // the classic slow fold
    const t=1-dying/(CONFIG.deathFreeze-6);
    if(t>=0.98)return;
    const a=Math.PI*t;
    ctx.fillStyle=POW; ctx.beginPath();
    ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,-Math.PI/2+a,-Math.PI/2-a+Math.PI*2); ctx.fill();
    return;
  }
  const v=DVEC[p.dir]||DVEC.left, base=Math.atan2(v[1],v[0]);
  const gap=(p.nx===p.x&&p.ny===p.y)?0.18:Math.abs(Math.sin(frame*0.22))*0.62;
  ctx.fillStyle=POW; ctx.beginPath();
  ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,base+gap,base-gap+Math.PI*2); ctx.closePath(); ctx.fill();
}
function drawHunter(h,i){
  if(h.hold>0 && h.mode!=='eyes' && (frame>>3)%2===0 && h.y<=PEN_ROW+1){ /* idling in the pen, still shown */ }
  const q=ipos(h), r=px(C*0.42);
  const cx=px(q.x*C+C/2), cy=my(q.y*C+C/2);
  const flee=h.mode==='flee';
  const blink=flee&&w.fleeT<110&&(frame>>2)%2===0;
  if(h.mode!=='eyes'){
    ctx.fillStyle=blink?'#f4f4f8':(flee?'#3a5ae8':GHOST[i%4]);
    ctx.beginPath();
    ctx.arc(cx,cy-r*0.12,r,Math.PI,0);
    ctx.lineTo(cx+r,cy+r*0.62);
    for(let k=0;k<3;k++){                               // the skirt
      const x0=cx+r-(k*2+1)*r/3, x1=cx+r-(k*2+2)*r/3;
      ctx.lineTo(x0,cy+r*0.9); ctx.lineTo(x1,cy+r*0.62);
    }
    ctx.lineTo(cx-r,cy+r*0.62);
    ctx.closePath(); ctx.fill();
  }
  if(flee||blink){
    ctx.fillStyle=blink?'#e0392b':'#f4f4f8';
    ctx.fillRect(cx-r*0.5,cy-r*0.35,px(C*0.12),px(C*0.12));
    ctx.fillRect(cx+r*0.5-px(C*0.12),cy-r*0.35,px(C*0.12),px(C*0.12));
    ctx.strokeStyle=blink?'#e0392b':'#f4f4f8'; ctx.lineWidth=px(C*0.07);
    ctx.beginPath();
    for(let k=0;k<=4;k++){ const x=cx-r*0.62+k*r*0.31, y=cy+r*0.34+(k%2?-r*0.16:0); k?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.stroke();
    return;
  }
  const v=DVEC[h.dir]||DVEC.left;
  for(const s of [-1,1]){
    const ex=cx+s*r*0.38, ey=cy-r*0.16;
    ctx.fillStyle='#f4f4f8'; ctx.beginPath();
    ctx.ellipse?ctx.ellipse(ex,ey,r*0.3,r*0.36,0,0,7):ctx.arc(ex,ey,r*0.32,0,7); ctx.fill();
    ctx.fillStyle='#1b1b40'; ctx.beginPath();
    ctx.arc(ex+v[0]*r*0.13,ey+v[1]*r*0.16,r*0.16,0,7); ctx.fill();
  }
}
function drawBar(){
  ctx.fillStyle='#15152a'; ctx.fillRect(0,0,CW,px(TOP));
  const s=summary(w);
  ctx.fillStyle='rgba(255,255,255,.55)'; ctx.textBaseline='middle';
  ctx.font='700 '+Math.round(px(TOP*0.42))+'px -apple-system,system-ui,sans-serif';
  ctx.textAlign='left'; ctx.fillText(M.level.toUpperCase()+' '+s.level, px(2), px(TOP*0.52));
  ctx.textAlign='right'; ctx.fillStyle=POW;
  ctx.fillText(s.score.toLocaleString(), CW-px(2), px(TOP*0.52));
  ctx.textAlign='start'; ctx.textBaseline='alphabetic';
  // lives, drawn as the thing they are
  const by=my(ROWS*C+BOT*0.45), r=px(C*0.36);
  ctx.fillStyle='#15152a'; ctx.fillRect(0,my(ROWS*C),CW,px(BOT));
  for(let i=0;i<w.lives;i++){
    const cx=px(3+i*C*0.95)+r;
    ctx.fillStyle=POW; ctx.beginPath();
    ctx.moveTo(cx,by); ctx.arc(cx,by,r,Math.PI+0.5,Math.PI-0.5+Math.PI*2); ctx.closePath(); ctx.fill();
  }
  // how much of the board is left, as a bar
  const frac=w.pelletsLeft/w.pelletsTotal, bw=CW*0.42;
  ctx.fillStyle='rgba(255,255,255,.13)'; rr(CW-px(3)-bw,by-px(1.1),bw,px(2.2),px(1.1),'rgba(255,255,255,.13)');
  rr(CW-px(3)-bw,by-px(1.1),bw*(1-frac),px(2.2),px(1.1),POW);
}
function paint(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=BG; ctx.fillRect(0,0,CW,CH);
  if(!w){ overlayText(M.start,M.hint); return; }
  if(!maze||mazeU!==U) buildMaze();
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake*0.5,(Math.random()-0.5)*shake*0.5); shake*=0.86; if(shake<0.4)shake=0; }
  ctx.drawImage(maze,0,px(TOP),CW,px(ROWS*C));
  drawPellets();
  drawFruit();
  for(let i=0;i<w.hunters.length;i++) if(w.hunters[i].mode==='eyes') drawHunter(w.hunters[i],i);
  for(let i=0;i<w.hunters.length;i++) if(w.hunters[i].mode!=='eyes') drawHunter(w.hunters[i],i);
  if(!(dying>0&&(CONFIG.deathFreeze-6-dying)<8)) drawPlayer();
  for(let i=bits.length-1;i>=0;i--){
    const b=bits[i]; b.x+=b.vx; b.y+=b.vy; b.t--;
    if(b.t<=0){ bits.splice(i,1); continue; }
    ctx.fillStyle='rgba('+b.c+','+(b.t/24)+')';
    ctx.fillRect(px(b.x),my(b.y),px(0.8),px(0.8));
  }
  ctx.font='700 '+Math.round(px(C*0.72))+'px -apple-system,system-ui,sans-serif';
  ctx.textAlign='center';
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t--;
    if(p.t<=0){ pops.splice(i,1); continue; }
    ctx.fillStyle='rgba(120,220,255,'+Math.min(1,p.t/26)+')';
    ctx.fillText(p.txt, px(p.x*C+C/2), my(p.y*C+C/2-(60-p.t)*0.1));
  }
  ctx.textAlign='start';
  ctx.restore();
  drawBar();
  if(bannerT>0){
    bannerT--;
    ctx.globalAlpha=Math.min(1,bannerT/22);
    ctx.fillStyle='rgba(13,13,22,.72)'; ctx.fillRect(0,CH*0.42,CW,CH*0.16);
    ctx.fillStyle=POW; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='800 '+Math.round(CW*0.062)+'px -apple-system,system-ui,sans-serif';
    ctx.fillText(banner,CW/2,CH*0.5);
    ctx.textAlign='start'; ctx.textBaseline='alphabetic'; ctx.globalAlpha=1;
  }
  if(phase===READY) overlayText(M.start,M.hint);
  else if(phase===PAUSED) overlayText(M.paused,'');
}

fit(UW,UH);
paint();
run(tick,paint,60);
</script>
</body>
</html>
