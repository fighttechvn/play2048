<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
/* iOS 12 / old WebKit have no Pointer Events — the games drive all input through
   pointerdown/move/up (+ setPointerCapture). Bridge touch (and old-desktop mouse)
   into synthetic pointer events so swiping/drawing works. No-op on modern engines. */
(function () {
  if (window.PointerEvent) return;
  var EP = window.Element && Element.prototype;
  if (EP && !EP.setPointerCapture) {
    EP.setPointerCapture = function () {};
    EP.releasePointerCapture = function () {};
    EP.hasPointerCapture = function () { return false; };
  }
  function mk(type, x, y, id, ptype) {
    var e;
    try { e = new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: x, clientY: y }); }
    catch (_) { e = document.createEvent("MouseEvents"); e.initMouseEvent(type, true, true, window, 0, 0, 0, x, y, false, false, false, false, 0, null); }
    e.pointerId = id; e.pointerType = ptype; e.isPrimary = true;
    e.pressure = type === "pointerup" || type === "pointercancel" ? 0 : 0.5;
    e.width = 1; e.height = 1;
    return e;
  }
  // --- touch → pointer (move/up go to the start target, mimicking pointer capture) ---
  var startTarget = null, touchActive = false, lastTouch = 0;
  function relay(type, touch, target) {
    var ev = mk(type, touch.clientX, touch.clientY, (touch.identifier || 0) + 1, "touch");
    return target.dispatchEvent(ev); // false if a handler called preventDefault()
  }
  document.addEventListener("touchstart", function (e) {
    touchActive = true; lastTouch = e.timeStamp || 0; startTarget = e.target;
    if (!relay("pointerdown", e.changedTouches[0], startTarget)) e.preventDefault();
  }, { passive: false });
  document.addEventListener("touchmove", function (e) {
    lastTouch = e.timeStamp || 0;
    if (!relay("pointermove", e.changedTouches[0], startTarget || e.target)) e.preventDefault();
  }, { passive: false });
  function end(type) {
    return function (e) {
      touchActive = false; lastTouch = e.timeStamp || 0;
      relay(type, e.changedTouches[0], startTarget || e.target); startTarget = null;
    };
  }
  document.addEventListener("touchend", end("pointerup"), { passive: false });
  document.addEventListener("touchcancel", end("pointercancel"), { passive: false });
  // --- mouse → pointer (old desktop); skip the synthetic mouse burst after a touch ---
  function fromMouse(type) {
    return function (e) {
      if (touchActive || (e.timeStamp || 0) - lastTouch < 700) return;
      e.target.dispatchEvent(mk(type, e.clientX, e.clientY, 1, "mouse"));
    };
  }
  document.addEventListener("mousedown", fromMouse("pointerdown"), true);
  document.addEventListener("mousemove", fromMouse("pointermove"), true);
  document.addEventListener("mouseup", fromMouse("pointerup"), true);
})();
</script>

  .top{display:flex;align-items:center;gap:8px;min-height:44px}
  .pill{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap;font-size:14px}

  .btns{display:flex;gap:12px}

  .btn:disabled{opacity:.45}
  .help{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 18px;font-size:14.5px;color:#555;line-height:1.5}
  .win{position:fixed;top:0;right:0;bottom:0;left:0;display:none;place-items:center;background:rgba(0,0,0,.5);z-index:9}

  let mode='buttons';

// ── Leaderboard reporter (Go Brain) — mirrors the GBLB block in games/zip. ──
const GBLB=(function(){
  var GAME='cross', t0=0;
  function base(){ try{var o=localStorage.getItem('gobrain.api.base'); if(o) return o.replace(/\/$/,'');}catch(e){}

// ── Shared shell ───────────────────────────────────────────────────────────
// Canvas fit, fixed-step loop, d-pad / swipe / keyboard input, pause. Every
// bundle inlines this verbatim; the per-game body below supplies tick + draw.
const READY=0,PLAYING=1,CLEAR=2,DEAD=3,PAUSED=4;
const cv=$('cv'), ctx=cv.getContext('2d');
let phase=READY, U=1, CW=0, CH=0, dpr=1, lastT=0, acc=0;
const IN={dir:null,fire:false,tap:false,drag:null};

function fit(uw,uh){
  // clientWidth includes the card's padding; the canvas only ever gets the
  // content box, so measuring the parent alone stretches the backing store
  // wider than the element and squashes everything horizontally.
  const p=cv.parentNode, cs=window.getComputedStyle(p);
  const pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const cssW=Math.min(p.clientWidth-pad, 460);
  dpr=Math.min(3, window.devicePixelRatio||1);
  U=cssW/uw; CW=cssW; CH=cssW*uh/uw;
  cv.width=Math.round(CW*dpr); cv.height=Math.round(CH*dpr);
  cv.style.height=CH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function rr(x,y,w,h,r,c){ ctx.fillStyle=c; ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}else{
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);}
  ctx.closePath(); ctx.fill();
}
function overlayText(top,bottom){
  ctx.fillStyle='rgba(20,20,20,.62)'; ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='700 '+Math.round(CW*0.058)+'px -apple-system,system-ui,sans-serif';
  ctx.fillText(top, CW/2, CH/2-CW*0.03);
  if(bottom){ ctx.font='500 '+Math.round(CW*0.038)+'px -apple-system,system-ui,sans-serif';
    ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillText(bottom, CW/2, CH/2+CW*0.045); }
  ctx.textAlign='start'; ctx.textBaseline='alphabetic';
}
function onStart(){}      // overridden by the body
function onResume(){ lastT=0; }
function tapStart(){
  if(phase===READY){ onStart(); return true; }
  if(phase===PAUSED){ phase=PLAYING; onResume(); return true; }
  return false;
}
function bindPad(map){    // [[elementId, dir], …]

// Fixed-step driver: tick() runs at exactly `hz`, draw() once per frame.
function run(tick, draw, hz){
  const stepMs=1000/(hz||60);

    requestAnimationFrame(frame);
    if(!lastT) lastT=ts;
    const dt=Math.min(150, ts-lastT); lastT=ts;
    if(phase===PLAYING){

// ── Pure rules — inlined verbatim from logic.mjs (the tests import that file). ──
// logic.mjs — Hop Line: five lanes of traffic, five lanes of river, and five
// bays to fill before the clock runs out. No canvas anywhere: the whole thing
// is a deterministic fixed-step simulation driven by an explicit RNG, so
// gen-levels.mjs can rate a level by playing it and the tests can pin the
// maths. index.html inlines this file verbatim.

const WIDTH = 100, CELL = 10;
const ROWS = 13;                   // 0 = the bays, 12 = the kerb you start on
const HEIGHT = ROWS * CELL;
const BAY_ROW = 0, START_ROW = 12, MEDIAN_ROW = 6;
const RIVER_ROWS = [1, 2, 3, 4, 5];
const ROAD_ROWS = [7, 8, 9, 10, 11];
const HOP_TICKS = 7;
/** Ticks of a hop still counted as airborne — see the traffic check in step(). */
const AIRBORNE = HOP_TICKS >> 1;               // a hop is committed: no steering mid-air
const FROG_W = 7;
const BAYS = 5;
const BAY_W = 12;
const LEVELS = 20;

const CONFIG = {
  lives: 3,
  timeTicks: 1800,          // 30 s per life at 60 Hz, before the level's own trim
  hopScore: 10,
  bayScore: 250,
  flyScore: 400,
  passengerScore: 600,
  levelBonus: 500,
  timeBonusPerTick: 0.5,
  flyEvery: 520,            // a fly settles in a free bay this often
  flyTicks: 320,
  gatorTicks: 420,          // …and a gator squats in one for this long
  gatorGap: 620,
  passengerTicks: 900,
  deathTicks: 60,
  turtleCycle: 200,         // dive rhythm: two thirds up, one third under
  turtleDown: 0.34,
};

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

const ease = (t) => t * t * (3 - 2 * t);                  // smoothstep

/**
 * The curve. Knobs, in the order they carry the ramp:
 *   1. speed        — how fast a lane runs (the headline dial)
 *   2. gap          — how much road there is between two cars
 *   3. turtles      — how many river lanes dive out from under you
 *   4. time         — the clock per life
 *   5. gators       — whether a bay can be occupied

 * generous, so mastery has somewhere to land before the next climb.

function paramsForLevel(i) {                       // i is 0-based
  const n = i + 1;
  const t = ease(i / (LEVELS - 1));
  const relief = n % 5 === 0 ? 0.78 : 1;
  const speed = Math.round((0.17 + 0.38 * t) * relief * 1000) / 1000;
  const gap = Math.round((46 - 15 * t) / relief);
  return {
    n,
    speed,
    gap,
    logGap: Math.round((46 - 13 * t) / relief),
    // The log length is the river's real dial: a short log is a target, not a
    // road. It gets the sawtooth too, or a relief level is only relief on land.
    logLen: Math.round((34 - 9 * t) / relief),
    turtles: t < 0.22 ? 0 : t < 0.62 ? 1 : 2,
    time: Math.round((CONFIG.timeTicks - 520 * t) * (relief < 1 ? 1.12 : 1)),
    gators: t > 0.3,
    passenger: t > 0.08,

}

const bayX = (i) => 4 + i * ((WIDTH - 8 - BAY_W) / (BAYS - 1));

/** Which bay a landing at `x` falls into, or -1 for the bank between them. */
function bayAt(x) {

  return -1;

/** One traffic lane. Items wrap modulo `total`, so a lane is an endless belt. */
function makeLane(kind, row, dir, speed, len, gap, rand, opts = {}) {
  const stride = len + gap;
  const count = Math.max(2, Math.ceil((WIDTH + len * 2) / stride));
  const total = count * stride;
  const off = rand() * stride;
  const items = [];
  for (let i = 0; i < count; i++) items.push({ x: (i * stride + off) % total, phase: Math.floor(rand() * CONFIG.turtleCycle) });
  return { kind, row, dir, speed, len, total, items, turtle: !!opts.turtle, truck: !!opts.truck };

function createGame(level, rand, carry) {
  const r = rand || Math.random;
  const lanes = [];
  const sp = level.speed;
  ROAD_ROWS.forEach((row, i) => {
    const dir = i % 2 === 0 ? -1 : 1;
    const truck = !!level.trucks && (i === 1 || i === 3);
    const len = truck ? 22 : 12;
    // the far lane is always the quick one — the last hop is the scary hop
    const mult = [1.28, 0.72, 1, 0.62, 0.86][i];   // the lane nearest the median is the quick one
    lanes.push(makeLane("road", row, dir, sp * mult, len, truck ? level.gap + 8 : level.gap, r, { truck }));
  });
  RIVER_ROWS.forEach((row, i) => {
    const dir = i % 2 === 0 ? 1 : -1;
    const turtle = i < (level.turtles || 0) * 2 && i % 2 === 1;
    const len = turtle ? 20 : level.logLen + (i === 2 ? 10 : 0);
    const mult = [0.9, 1.15, 0.7, 1.05, 0.85][i];
    lanes.push(makeLane("river", row, dir, sp * mult * 0.85, len, level.logGap, r, { turtle }));

    tick: 0,
    level,
    n: level.n,
    lanes,
    frog: { x: (WIDTH - FROG_W) / 2, row: START_ROW, hop: 0, fromX: 0, fromRow: START_ROW, riding: null },
    bays: new Array(BAYS).fill(false),
    lives: carry && carry.lives != null ? carry.lives : CONFIG.lives,
    score: (carry && carry.score) || 0,
    time: level.time,
    dead: 0,
    fly: null, flyT: CONFIG.flyEvery,
    gator: null, gatorT: CONFIG.gatorGap,
    passenger: null, passengerT: CONFIG.passengerTicks,

function laneAt(w, row) { return w.lanes.find((l) => l.row === row) || null; }
function submerged(lane, item, tick) {

  return ((tick + item.phase) % CONFIG.turtleCycle) / CONFIG.turtleCycle > 1 - CONFIG.turtleDown;
}
/** Every on-screen copy of an item: the belt wraps, so one item can be two. */
function spans(lane, item) {
  const out = [item.x];

  if (item.x > WIDTH) out.push(item.x - lane.total);

function platformUnder(w, row, x) {
  const lane = laneAt(w, row);
  if (!lane || lane.kind !== "river") return null;
  for (const it of lane.items) {
    if (!overlaps(lane, it, x + 1, FROG_W - 2)) continue;
    if (submerged(lane, it, w.tick)) return null;
    return { lane, item: it };

function die(w, reason, events) {

  w.deaths++;
  w.lives--;

  w.carrying = false;
  w.frog.riding = null;
  events.push({ type: "die", reason, x: w.frog.x, row: w.frog.row });

  w.farthest = START_ROW;

}

/** Land in a bay: fill it, bank the bonus, and go back to the kerb. */
function land(w, events) {
  const i = bayAt(w.frog.x);
  if (i < 0) { die(w, "bank", events); return; }
  if (w.bays[i]) { die(w, "occupied", events); return; }
  if (w.gator && w.gator.bay === i) { die(w, "gator", events); return; }
  w.bays[i] = true;
  let gained = CONFIG.bayScore;
  if (w.fly && w.fly.bay === i) { gained += CONFIG.flyScore; w.fly = null; events.push({ type: "fly", bay: i }); }
  if (w.carrying) { gained += CONFIG.passengerScore; w.carrying = false; events.push({ type: "deliver", bay: i }); }
  gained += Math.round(w.time * CONFIG.timeBonusPerTick);
  w.score += gained;
  events.push({ type: "bay", bay: i, score: gained });

    w.score += CONFIG.levelBonus;
    if (w.deaths === 0) { w.score += CONFIG.levelBonus; events.push({ type: "perfect" }); }

    events.push({ type: "clear", score: w.score });

/** One 60 Hz tick. `input` = { dir: "up"|"down"|"left"|"right"|null }. */
function step(w, input, rand) {
  const r = rand || Math.random;
  const events = [];
  if (w.over) return events;
  w.tick++;
  const dir = (input && input.dir) || null;

  for (const lane of w.lanes) {
    for (const it of lane.items) {
      it.x += lane.dir * lane.speed;
      if (it.x >= lane.total) it.x -= lane.total;
      else if (it.x < 0) it.x += lane.total;
    }
  }

  if (w.dead > 0) {
    if (--w.dead === 0 && !w.over) respawn(w);
    return events;
  }

  // ── the hop ──────────────────────────────────────────────────────────────
  const f = w.frog;
  if (f.hop > 0) {
    f.hop--;
    if (f.hop === 0) {
      f.fromRow = f.row;
      if (f.row === BAY_ROW) { land(w, events); return events; }
    }
  } else if (dir) {
    let nr = f.row, nx = f.x;
    if (dir === "up") nr = f.row - 1;
    else if (dir === "down") nr = Math.min(START_ROW, f.row + 1);
    else if (dir === "left") nx = f.x - CELL;
    else if (dir === "right") nx = f.x + CELL;
    if (nr < BAY_ROW) nr = BAY_ROW;
    if (nx < 0 || nx + FROG_W > WIDTH) { nx = f.x; }
    if (nr !== f.row || nx !== f.x) {
      f.fromX = f.x; f.fromRow = f.row;
      f.x = nx; f.row = nr; f.hop = HOP_TICKS; f.riding = null;
      w.hops++;
      if (nr < w.farthest) { w.farthest = nr; w.score += CONFIG.hopScore; }
      events.push({ type: "hop", row: nr, x: nx });
    }
  }

  // ── ride the river ───────────────────────────────────────────────────────
  const onRiver = RIVER_ROWS.indexOf(f.row) >= 0;
  if (onRiver && f.hop === 0) {
    const p = platformUnder(w, f.row, f.x);
    if (!p) { die(w, "water", events); return events; }
    f.riding = p.lane.turtle ? "turtle" : "log";
    f.x += p.lane.dir * p.lane.speed;
    // Ride to the bank and you go in with the log. This has to be checked
    // without clamping x first — clamping is what would keep the frog pinned at
    // the edge for ever instead of being carried off it.
    if (f.x < 0 || f.x + FROG_W > WIDTH) { die(w, "swept", events); return events; }
    // a passenger waits on a log and is picked up by sharing it
    if (w.passenger && w.passenger.row === f.row && !w.carrying &&
        Math.abs(w.passenger.x - f.x) < FROG_W) {
      w.carrying = true; w.passenger = null;
      events.push({ type: "pickup" });
    }
  } else if (!onRiver) f.riding = null;

  // ── the traffic ──────────────────────────────────────────────────────────
  // A hop is in the air for its first half: the frog already counts as being in
  // the new row for everything else, but a car cannot hit it until it is more
  // than halfway across. Without this a hop is fatal the instant it is started,
  // which reads as dying over a car the frog never touched.
  if (ROAD_ROWS.indexOf(f.row) >= 0 && f.hop <= AIRBORNE) {
    const lane = laneAt(w, f.row);
    for (const it of lane.items) {
      if (overlaps(lane, it, f.x, FROG_W)) { die(w, "hit", events); return events; }
    }
  }

  // ── the passenger drifts with its log ────────────────────────────────────
  if (w.passenger) {
    const lane = laneAt(w, w.passenger.row);
    w.passenger.x += lane.dir * lane.speed;
    w.passenger.t--;
    if (w.passenger.t <= 0 || w.passenger.x < -6 || w.passenger.x > WIDTH + 6) w.passenger = null;
  } else if (w.level.passenger && !w.carrying && --w.passengerT <= 0) {
    w.passengerT = CONFIG.passengerTicks;
    const row = RIVER_ROWS[Math.floor(r() * RIVER_ROWS.length)];
    const lane = laneAt(w, row);
    const it = lane.items[Math.floor(r() * lane.items.length)];
    if (!lane.turtle && it.x >= 0 && it.x + lane.len <= WIDTH) {
      w.passenger = { row, x: it.x + lane.len / 2 - FROG_W / 2, t: CONFIG.passengerTicks };
      events.push({ type: "passengerIn", row });
    }
  }

  // ── the fly and the gator take turns in the free bays ────────────────────
  const free = [];
  for (let i = 0; i < BAYS; i++) if (!w.bays[i]) free.push(i);
  if (w.fly) { if (--w.fly.t <= 0) w.fly = null; }
  else if (--w.flyT <= 0 && free.length) {
    w.flyT = CONFIG.flyEvery;
    w.fly = { bay: free[Math.floor(r() * free.length)], t: CONFIG.flyTicks };
    events.push({ type: "flyIn", bay: w.fly.bay });
  }
  if (w.gator) { if (--w.gator.t <= 0) w.gator = null; }
  else if (w.level.gators && --w.gatorT <= 0 && free.length > 1) {
    w.gatorT = CONFIG.gatorGap;
    const pick = free.filter((b) => !w.fly || w.fly.bay !== b);
    if (pick.length) {
      w.gator = { bay: pick[Math.floor(r() * pick.length)], t: CONFIG.gatorTicks };
      events.push({ type: "gatorIn", bay: w.gator.bay });
    }
  }

  // ── the clock ────────────────────────────────────────────────────────────
  if (--w.time <= 0) { w.time = 0; die(w, "time", events); return events; }
  return events;
}

    time: w.time, timePct: Math.round((w.time / w.level.time) * 100),
    carrying: w.carrying, hops: w.hops, deaths: w.deaths,
    over: w.over, won: w.won, reason: w.reason, ticks: w.tick,
  };
}

function finish(won){
  phase=DEAD;
  const s=summary(w);
  best=Math.max(best,s.score);
  try{localStorage.setItem(BKEY,String(best));}catch(e){}
  $('overttl').textContent=won?M.victory:M.over;
  $('overmsg').textContent=M.level+' '+s.level+' · '+M.score+' '+s.score.toLocaleString()+' · '+M.best+' '+best.toLocaleString();
  $('again').textContent=M.again;
  $('wino').style.display='grid';
  hud();
}
function nextLevel(){
  if(lvlIdx+1>=LEVELS){ finish(true); return; }
  startLevel(lvlIdx+1, {lives:w.lives, score:w.score});
}

// ── input: a four-way pad, swipes on the field, arrow keys ─────────────────
bindPad([['bu','up'],['bd','down'],['bl','left'],['br','right']]);
bindCanvas(['up','right','down','left'],{});
bindSwipe({dirs:['up','right','down','left']});
bindKeys(['up','right','down','left']);
$('restart').textContent=M.restart;
$('restart').onclick=newRun;
$('again').onclick=newRun;

// A hop is a discrete move, so the shell's held direction has to be consumed
// once per press — otherwise leaning on ◀ walks the frog straight into the river.
let queued=null, lastDir=null;
function pullDir(){
  const d=IN.tapDir||IN.dir||null;
  IN.tapDir=null;
  if(d&&d!==lastDir){ lastDir=d; return d; }
  if(!IN.dir) lastDir=null;
  return null;
}

// ── tick ───────────────────────────────────────────────────────────────────
function tick(){
  if(inter>0){ if(--inter===0) nextLevel(); return true; }
  const d=pullDir()||queued; queued=null;
  const evs=step(w,{dir:d},rand);
  for(const e of evs){
    if(e.type==='die'){
      shake=e.reason==='hit'?18:10;
      for(let i=0;i<14;i++) splash.push({x:e.x+FROG_W/2,y:e.row*CELL+CELL/2,
        vx:(Math.random()-0.5)*2.2,vy:(Math.random()-0.5)*2.2,t:26,
        c:e.reason==='hit'?'220,80,60':'120,180,230'});
    }
    else if(e.type==='bay'){ pops.push({x:bayCentres()[e.bay],y:CELL*1.4,t:52,txt:'+'+e.score}); }
    else if(e.type==='fly'){ pops.push({x:bayCentres()[e.bay],y:CELL*2.4,t:52,txt:M.fly}); }
    else if(e.type==='deliver'){ pops.push({x:bayCentres()[e.bay],y:CELL*2.4,t:52,txt:M.deliver}); }
    else if(e.type==='pickup'){ pops.push({x:w.frog.x+FROG_W/2,y:w.frog.row*CELL,t:44,txt:M.pickup}); }
    else if(e.type==='perfect'){ banner=M.perfect; bannerT=90; }
  }
  hud();
  if(w.over){
    if(w.won){ GBLB.report(lvlIdx+1); if(!bannerT||banner!==M.perfect){ banner=M.cleared; bannerT=90; } inter=80; return true; }
    finish(false); return false;
  }
  return true;
}

// ── painting ───────────────────────────────────────────────────────────────
const GRASS='#2f6b3d', ROAD='#26262b', WATER='#153a5c', KERB='#3d7a4a';
function px(v){ return v*U; }
function drawField(){
  ctx.fillStyle=WATER; ctx.fillRect(0,0,CW,px(MEDIAN_ROW*CELL));
  ctx.fillStyle=ROAD;  ctx.fillRect(0,px((MEDIAN_ROW+1)*CELL),CW,px(ROAD_ROWS.length*CELL));
  ctx.fillStyle=GRASS; ctx.fillRect(0,px(MEDIAN_ROW*CELL),CW,px(CELL));
  ctx.fillStyle=KERB;  ctx.fillRect(0,px(START_ROW*CELL),CW,px(CELL));
  // the ripples say "this is water" before the frog has to find out
  for(const r of ripple){ ctx.fillStyle='rgba(255,255,255,.07)';
    ctx.fillRect(px(r.x),px(r.y),px(r.s),px(0.6)); }
  // lane markings between the road rows
  ctx.fillStyle='rgba(255,255,255,.13)';
  for(let i=1;i<ROAD_ROWS.length;i++){
    const y=px(ROAD_ROWS[i]*CELL);
    for(let x=2;x<WIDTH;x+=8) ctx.fillRect(px(x),y-px(0.25),px(4),px(0.5));
  }
  drawBays();
}
function drawBays(){
  ctx.fillStyle='#1d4f2c'; ctx.fillRect(0,0,CW,px(CELL));
  const cs=bayCentres();
  for(let i=0;i<BAYS;i++){
    const x=cs[i]-BAY_W/2;
    ctx.fillStyle=w.bays[i]?'#4caf50':'#0d2a3f';
    ctx.fillRect(px(x),px(0.6),px(BAY_W),px(CELL-1.2));
    if(w.bays[i]) frog(cs[i]-FROG_W/2, 1.6, '#8bd44f');
    else if(w.gator&&w.gator.bay===i) gator(cs[i]);
    else if(w.fly&&w.fly.bay===i) fly(cs[i]);
  }
}
function fly(cx){
  ctx.fillStyle='#f0c419';
  ctx.fillRect(px(cx-1.6),px(CELL/2-1),px(3.2),px(2));
  ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.fillRect(px(cx-2.6),px(CELL/2-1.6),px(1),px(1.2));
  ctx.fillRect(px(cx+1.6),px(CELL/2-1.6),px(1),px(1.2));
}
function gator(cx){
  ctx.fillStyle='#2d7d46';
  ctx.fillRect(px(cx-4.5),px(CELL/2-1.4),px(9),px(3));
  ctx.fillStyle='#e03131';
  ctx.fillRect(px(cx+2.4),px(CELL/2-0.4),px(2.6),px(1.2));   // the open jaw
  ctx.fillStyle='#0d2a3f';
  ctx.fillRect(px(cx-2.6),px(CELL/2-2.2),px(1),px(1));
  ctx.fillRect(px(cx-0.6),px(CELL/2-2.2),px(1),px(1));
}
function drawLanes(){
  for(const lane of w.lanes){
    const y=lane.row*CELL;
    for(const it of lane.items) for(const sx of spans(lane,it)){
      if(sx>WIDTH||sx+lane.len<0) continue;
      if(lane.kind==='road') car(sx,y,lane);
      else if(lane.turtle) turtles(sx,y,lane,it);
      else log(sx,y,lane);
    }
  }
}
function car(x,y,lane){
  const c=lane.truck?'#c94f4f':(lane.dir<0?'#e0a33e':'#4f8fd6');
  rr(px(x),px(y+1.4),px(lane.len),px(CELL-2.8),px(1.2),c);
  ctx.fillStyle='rgba(255,255,255,.65)';
  const wx=lane.dir<0?x+0.8:x+lane.len-2.2;
  ctx.fillRect(px(wx),px(y+2.6),px(1.4),px(CELL-5.2));       // the lights face the way it drives
  if(lane.truck){ ctx.fillStyle='rgba(0,0,0,.22)';
    ctx.fillRect(px(x+lane.len*0.35),px(y+1.4),px(1),px(CELL-2.8)); }
}
function log(x,y,lane){
  rr(px(x),px(y+1.6),px(lane.len),px(CELL-3.2),px(1.4),'#7a4b2a');
  ctx.fillStyle='rgba(0,0,0,.18)';
  for(let i=6;i<lane.len-2;i+=7) ctx.fillRect(px(x+i),px(y+1.6),px(0.8),px(CELL-3.2));
}
function turtles(x,y,lane,it){
  const down=submerged(lane,it,w.tick);
  const soon=submerged(lane,it,w.tick+34);
  const n=Math.max(1,Math.round(lane.len/7));
  for(let i=0;i<n;i++){
    const cx=x+3.5+i*(lane.len/n);
    ctx.fillStyle=down?'rgba(120,180,230,.30)':soon?'#3f7f5f':'#4f9f6f';
    ctx.beginPath(); ctx.arc(px(cx),px(y+CELL/2),px(2.6),0,6.2832); ctx.fill();
    if(!down){ ctx.fillStyle='rgba(0,0,0,.22)';
      ctx.fillRect(px(cx-1),px(y+CELL/2-1),px(2),px(2)); }
  }
}
function frog(x,y,col){
  ctx.fillStyle=col||'#8bd44f';
  ctx.fillRect(px(x+1),px(y+1),px(FROG_W-2),px(FROG_W-2));   // body
  ctx.fillRect(px(x),px(y),px(2),px(2));                     // and four legs
  ctx.fillRect(px(x+FROG_W-2),px(y),px(2),px(2));
  ctx.fillRect(px(x),px(y+FROG_W-2),px(2),px(2));
  ctx.fillRect(px(x+FROG_W-2),px(y+FROG_W-2),px(2),px(2));
  ctx.fillStyle='#12240c';
  ctx.fillRect(px(x+1.6),px(y+1.6),px(1.2),px(1.2));
  ctx.fillRect(px(x+FROG_W-2.8),px(y+1.6),px(1.2),px(1.2));
}
function drawFrog(){
  const f=w.frog;
  if(w.dead>0&&Math.floor(w.dead/5)%2===0) return;           // the death flicker
  // a hop arcs: interpolate the row and lift the frog off the ground mid-jump
  const p=f.hop>0?(HOP_TICKS-f.hop)/HOP_TICKS:1;
  const row=f.fromRow+(f.row-f.fromRow)*p;
  const lift=f.hop>0?Math.sin(p*Math.PI)*2.2:0;
  const y=row*CELL+(CELL-FROG_W)/2-lift;
  if(f.hop>0){ ctx.fillStyle='rgba(0,0,0,.20)';
    ctx.fillRect(px(f.x+1),px(row*CELL+(CELL-FROG_W)/2+2),px(FROG_W-2),px(2)); }
  frog(f.x,y,w.carrying?'#ffd166':'#8bd44f');
  if(w.carrying){ ctx.fillStyle='#e0574f';
    ctx.fillRect(px(f.x+2),px(y-2.2),px(FROG_W-4),px(2)); }  // the passenger on your back
}
function drawPassenger(){
  if(!w.passenger)return;
  const p=w.passenger;
  ctx.fillStyle='#ffd166';
  ctx.fillRect(px(p.x+1.4),px(p.row*CELL+CELL/2-2),px(FROG_W-2.8),px(4));
  ctx.fillStyle='#e0574f';
  ctx.fillRect(px(p.x+1.4),px(p.row*CELL+CELL/2-3.4),px(FROG_W-2.8),px(1.4));
}
function drawHud(){
  // life pips on the kerb, and the clock draining across the bottom
  for(let i=0;i<w.lives-1;i++) frog(2+i*8, START_ROW*CELL+1.6, '#8bd44f');
  const pct=Math.max(0,w.time/w.level.time);
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.fillRect(px(WIDTH*0.34),px(HEIGHT-3.4),px(WIDTH*0.62),px(2.2));
  ctx.fillStyle=pct<0.25?'#e03131':pct<0.5?'#f0a202':'#4caf50';
  ctx.fillRect(px(WIDTH*0.34),px(HEIGHT-3.4),px(WIDTH*0.62*pct),px(2.2));
}
function paint(){
  if(!w){ ctx.fillStyle=WATER; ctx.fillRect(0,0,CW,CH); overlayText(M.start,M.hint); return; }
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake*0.35,(Math.random()-0.5)*shake*0.35); shake--; }
  drawField();
  drawLanes();
  drawPassenger();
  drawFrog();
  drawHud();
  ctx.restore();

  for(let i=splash.length-1;i>=0;i--){
    const s=splash[i]; s.x+=s.vx; s.y+=s.vy; s.vy+=0.05;
    if(--s.t<=0){ splash.splice(i,1); continue; }
    ctx.fillStyle='rgba('+s.c+','+(s.t/26)+')';
    ctx.fillRect(px(s.x),px(s.y),px(1.2),px(1.2));
  }
  ctx.textAlign='center';
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.y-=0.12;
    if(--p.t<=0){ pops.splice(i,1); continue; }
    ctx.globalAlpha=Math.min(1,p.t/22);
    ctx.fillStyle='#fff';
    ctx.font='700 '+Math.round(CW*0.042)+'px -apple-system,system-ui,sans-serif';
    ctx.fillText(p.txt,px(p.x),px(p.y));
    ctx.globalAlpha=1;
  }
  if(bannerT>0){
    bannerT--;
    ctx.globalAlpha=Math.min(1,bannerT/26);
    ctx.fillStyle='rgba(0,0,0,.55)';
    ctx.fillRect(0,CH/2-px(7),CW,px(14));
    ctx.fillStyle='#fff';
    ctx.font='700 '+Math.round(CW*0.062)+'px -apple-system,system-ui,sans-serif';
    ctx.fillText(banner,CW/2,CH/2+px(2));
    ctx.globalAlpha=1;
  }
  ctx.textAlign='start';
  if(phase===PAUSED) overlayText(M.paused,'');
}

seedRipples();
relayout();
overlayText(M.start,M.hint);
run(tick,paint,60);
</script>
