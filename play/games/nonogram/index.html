<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
/* iOS 12 / old WebKit have no Pointer Events — the games drive all input through
   pointerdown/move/up (+ setPointerCapture). Bridge touch (and old-desktop mouse)
   into synthetic pointer events so swiping/drawing works. No-op on modern engines. */
(function () {
  if (window.PointerEvent) return;
  var EP = window.Element && Element.prototype;
  if (EP && !EP.setPointerCapture) {
    EP.setPointerCapture = function () {};
    EP.releasePointerCapture = function () {};
    EP.hasPointerCapture = function () { return false; };
  }
  function mk(type, x, y, id, ptype) {
    var e;
    try { e = new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: x, clientY: y }); }
    catch (_) { e = document.createEvent("MouseEvents"); e.initMouseEvent(type, true, true, window, 0, 0, 0, x, y, false, false, false, false, 0, null); }
    e.pointerId = id; e.pointerType = ptype; e.isPrimary = true;
    e.pressure = type === "pointerup" || type === "pointercancel" ? 0 : 0.5;
    e.width = 1; e.height = 1;
    return e;
  }
  // --- touch → pointer (move/up go to the start target, mimicking pointer capture) ---
  var startTarget = null, touchActive = false, lastTouch = 0;
  function relay(type, touch, target) {
    var ev = mk(type, touch.clientX, touch.clientY, (touch.identifier || 0) + 1, "touch");
    return target.dispatchEvent(ev); // false if a handler called preventDefault()
  }
  document.addEventListener("touchstart", function (e) {
    touchActive = true; lastTouch = e.timeStamp || 0; startTarget = e.target;
    if (!relay("pointerdown", e.changedTouches[0], startTarget)) e.preventDefault();
  }, { passive: false });
  document.addEventListener("touchmove", function (e) {
    lastTouch = e.timeStamp || 0;
    if (!relay("pointermove", e.changedTouches[0], startTarget || e.target)) e.preventDefault();
  }, { passive: false });
  function end(type) {
    return function (e) {
      touchActive = false; lastTouch = e.timeStamp || 0;
      relay(type, e.changedTouches[0], startTarget || e.target); startTarget = null;
    };
  }
  document.addEventListener("touchend", end("pointerup"), { passive: false });
  document.addEventListener("touchcancel", end("pointercancel"), { passive: false });
  // --- mouse → pointer (old desktop); skip the synthetic mouse burst after a touch ---
  function fromMouse(type) {
    return function (e) {
      if (touchActive || (e.timeStamp || 0) - lastTouch < 700) return;
      e.target.dispatchEvent(mk(type, e.clientX, e.clientY, 1, "mouse"));
    };
  }
  document.addEventListener("mousedown", fromMouse("pointerdown"), true);
  document.addEventListener("mousemove", fromMouse("pointermove"), true);
  document.addEventListener("mouseup", fromMouse("pointerup"), true);
})();
</script>

<script>
/* Localized "how to play" — locale comes from the hub via ?lang=, else device. */
(function(){
  function pick(){var p=new URLSearchParams(location.search).get("lang");var raw=p||localStorage.getItem("gobrain.locale")||localStorage.getItem("CapacitorStorage.gobrain.locale")||navigator.language||"en";var c=String(raw).toLowerCase().split("-")[0];return ["en","vi","ko","zh","ja","ar"].indexOf(c)>=0?c:"en";}
  var T={

    vi:"<b>Cách chơi.</b> Các con số là độ dài của <b>các dãy ô được tô</b> trong mỗi hàng và cột, theo thứ tự. Dùng <b>Fill</b> để tô và <b>✕</b> để đánh dấu ô trống. Tô sai một ô mất một tim — mất cả ba tim thì chơi lại màn.",
    ko:"<b>플레이 방법.</b> 숫자는 각 행과 열에서 <b>연속으로 칠해진 칸</b>의 길이를 순서대로 나타냅니다. <b>Fill</b>로 칠하고 <b>✕</b>로 빈칸을 표시하세요. 틀리면 하트가 하나 줄어듭니다 — 셋 다 잃으면 레벨을 다시 시작합니다.",
    zh:"<b>玩法。</b> 数字表示每行每列中<b>连续填充格</b>的长度，按顺序排列。用 <b>Fill</b> 涂色，用 <b>✕</b> 标记空格。涂错一格扣一颗心——三颗心用完则重新开始本关。",
    ja:"<b>遊び方。</b> 数字は各行・各列の<b>連続して塗られたマス</b>の長さを順に示します。<b>Fill</b> で塗り、<b>✕</b> で空きマスに印を付けます。間違えるとハートが1つ減り、3つ失うとレベルをやり直します。",
    ar:"<b>طريقة اللعب.</b> الأرقام هي أطوال <b>سلاسل الخانات المملوءة</b> في كل صف وعمود، بالترتيب. استخدم <b>Fill</b> للتلوين و<b>✕</b> لتحديد الفراغات. الخانة الخاطئة تكلّفك قلبًا — اخسر الثلاثة ويُعاد المستوى."
  };
  var L=pick(),el=document.querySelector(".help");
  if(el){el.innerHTML=T[L]||T.en; if(L==="ar")el.dir="rtl";}

<script>
const KEY="nonogram.level";
const TUTKEY="nonogram.tutorialSeen";
const TUT_ON=(function(){var p=new URLSearchParams(location.search).get("tut");return !(p==="0"||p==="off"||p==="false");})(); // feature flag: hub passes ?tut=0 to disable
// Locale for the tutorial — same source order as the "how to play" help above.
const LANG=(function(){var p=new URLSearchParams(location.search).get("lang");var raw=p||localStorage.getItem("gobrain.locale")||localStorage.getItem("CapacitorStorage.gobrain.locale")||navigator.language||"en";var c=String(raw).toLowerCase().split("-")[0];return ["en","vi","ko","zh","ja","ar"].indexOf(c)>=0?c:"en";})();
// ── Leaderboard reporter (Go Brain) — see games/zip for notes; paste + change GAME ──
const GBLB=(function(){
  var GAME='nonogram', t0=0;
  function base(){ try{var o=localStorage.getItem('gobrain.api.base'); if(o) return o.replace(/\/$/,'');}catch(e){}
    return (function(){try{var C=window.Capacitor||(window.parent&&window.parent.Capacitor);if(C&&typeof C.isNativePlatform==='function')return C.isNativePlatform();}catch(e){}return /^capacitor:|^ionic:/.test(location.protocol);})()?'https://gobrain.fighttech.vn/api/v1':'/api/v1'; }
  function token(){ try{return localStorage.getItem('CapacitorStorage.gobrain.player.token')||localStorage.getItem('gobrain.player.token');}catch(e){return null;} }
  function apiKey(){ try{return localStorage.getItem('gobrain.api.key')||'gobrain-dev-client-key';}catch(e){return 'gobrain-dev-client-key';} }
  function emit(name,params){ try{ if(window.parent&&window.parent!==window){ params=params||{}; params.game_id=GAME; window.parent.postMessage({__gb:1,name:name,params:params},'*'); } }catch(e){} }
  return {
    start:function(){ t0=Date.now(); emit('level_start',{}); },
    report:function(level){ var ms=t0?(Date.now()-t0):0; emit('level_complete',{level:level,duration_ms:ms});
      var tok=token(); if(!tok||!t0) return; t0=0;
      try{ fetch(base()+'/scores',{method:'POST',headers:{'content-type':'application/json','x-api-key':apiKey(),'authorization':'Bearer '+tok},
        body:JSON.stringify({gameId:GAME,level:level,durationMs:ms})}).catch(function(){}); }catch(e){} }
  };
})();
// Cell states: 0 unknown · 1 filled · 2 ✕
let DATA=null, lvl=0, L=null, sol=null, st=null, errors=0, mode='fill', won=false;
let cell=0, gx=0, gy=0, clueW=0, clueH=0; // grid origin + clue margins
let rowDone=null, colDone=null;
let flashes=[], flashRAF=0;
let dragging=false, dragAction=null, lastCell=null;
let tutActive=false, tutStep=0, tutRAF=0, tutT=0, tutTarget=null; // first-run guided tutorial
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);

fetch('./levels.json').then(r=>r.json()).then(d=>{DATA=d; lvl=Math.min(+(localStorage.getItem(KEY)||0), d.levels.length-1); load(lvl);});

function load(i){
  L=DATA.levels[i]; errors=0; won=false; flashes=[];
  sol=L.solution.map(row=>{const a=[];for(let c=0;c<row.length;c++)a.push(+row[c]);return a;});
  st=[]; for(let r=0;r<L.size;r++){const row=[];for(let c=0;c<L.size;c++)row.push(0);st.push(row);}
  rowDone=new Array(L.size).fill(false); colDone=new Array(L.size).fill(false);
  layout(); refreshDone(false); draw(); hearts();
  $('lvl').textContent='Nonogram · '+(i+1);
  maybeStartTut(); GBLB.start();
}
function layout(){
  const wrap=document.getElementById('wrap');
  const W=Math.min(wrap.clientWidth-60, 520);
  const S=L.size;
  let maxRC=1,maxCC=1;
  for(const cl of L.rowClues)maxRC=Math.max(maxRC,cl.length);
  for(const cl of L.colClues)maxCC=Math.max(maxCC,cl.length);
  cell=Math.floor(W/(S+maxRC*0.62));
  clueW=Math.ceil(maxRC*cell*0.62)+4; clueH=Math.ceil(maxCC*cell*0.62)+4;
  gx=clueW; gy=clueH;
  const pw=clueW+S*cell+2, ph=clueH+S*cell+2;
  cv.width=pw*devicePixelRatio; cv.height=ph*devicePixelRatio;
  cv.style.width=pw+'px'; cv.style.height=ph+'px';
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

function draw(){
  const S=L.size;
  ctx.clearRect(0,0,cv.width,cv.height);
  const now=Date.now();
  // cells
  for(let r=0;r<S;r++)for(let c=0;c<S;c++){
    const x=gx+c*cell,y=gy+r*cell;
    const v=st[r][c];
    if(v===1){ctx.fillStyle=getCss('--fill');ctx.fillRect(x+1,y+1,cell-2,cell-2);}
    else if(v===2){
      ctx.strokeStyle='#b9b4a8';ctx.lineWidth=Math.max(1.5,cell*0.09);ctx.lineCap='round';
      const s=cell*0.18,cx2=x+cell/2,cy2=y+cell/2;
      ctx.beginPath();ctx.moveTo(cx2-s,cy2-s);ctx.lineTo(cx2+s,cy2+s);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx2+s,cy2-s);ctx.lineTo(cx2-s,cy2+s);ctx.stroke();
    }
  }
  // error flashes (red pulse on the wrongly tapped cell)
  flashes=flashes.filter(f=>now<f.until);
  for(const f of flashes){
    const a=(f.until-now)/450;
    ctx.fillStyle='rgba(224,49,49,'+(0.45*a).toFixed(3)+')';
    ctx.fillRect(gx+f.c*cell,gy+f.r*cell,cell,cell);
  }
  // grid — crisp thin lines; every 5th line heavier
  for(let i=0;i<=S;i++){
    const heavy=i%5===0;
    ctx.strokeStyle=heavy?'#8f8a7e':'#d5d1c7'; ctx.lineWidth=heavy?1.5:0.75;
    ctx.beginPath();ctx.moveTo(gx,gy+i*cell);ctx.lineTo(gx+S*cell,gy+i*cell);ctx.stroke();
    ctx.beginPath();ctx.moveTo(gx+i*cell,gy);ctx.lineTo(gx+i*cell,gy+S*cell);ctx.stroke();
  }
  // clues
  ctx.textBaseline='middle';
  const fs=Math.max(9,Math.round(cell*0.42));
  ctx.font='bold '+fs+'px -apple-system,sans-serif';
  for(let r=0;r<S;r++){
    const cls=L.rowClues[r].length?L.rowClues[r]:[0];
    ctx.fillStyle=rowDone[r]?getCss('--cluedim'):getCss('--clue');
    ctx.textAlign='right';
    let x=gx-5;
    for(let k=cls.length-1;k>=0;k--){ctx.fillText(cls[k],x,gy+r*cell+cell/2+1);x-=cell*0.62;}
  }
  for(let c=0;c<S;c++){
    const cls=L.colClues[c].length?L.colClues[c]:[0];
    ctx.fillStyle=colDone[c]?getCss('--cluedim'):getCss('--clue');
    ctx.textAlign='center';
    let y=gy-5-fs*0.45;
    for(let k=cls.length-1;k>=0;k--){ctx.fillText(cls[k],gx+c*cell+cell/2,y);y-=cell*0.62;}
  }
  if(tutActive && STEPS[tutStep] && STEPS[tutStep].key==='act') drawTutHint();
}
function flashLoop(){
  draw();
  if(flashes.length)flashRAF=requestAnimationFrame(flashLoop); else flashRAF=0;
}

function hearts(){
  const h=Math.max(0,3-errors);
  let s=''; for(let i=0;i<3;i++)s+=i<h?'♥':'♡';
  $('hearts').textContent=s;
}
function lineDone(kind,i){
  const S=L.size;
  for(let j=0;j<S;j++){
    const v=kind==='r'?sol[i][j]:sol[j][i];
    const s=kind==='r'?st[i][j]:st[j][i];
    if(v===1&&s!==1)return false;
  }
  return true;
}
// Recompute finished rows/cols; when one completes, its clues dim and the rest
// of the line is auto-✕'d (standard picross convenience).
function refreshDone(autox){
  const S=L.size;
  for(let r=0;r<S;r++){
    const d=lineDone('r',r);
    if(d&&autox)for(let c=0;c<S;c++)if(st[r][c]===0)st[r][c]=2;
    rowDone[r]=d;
  }
  for(let c=0;c<S;c++){
    const d=lineDone('c',c);
    if(d&&autox)for(let r=0;r<S;r++)if(st[r][c]===0)st[r][c]=2;
    colDone[c]=d;
  }
}

function cellAt(ev){
  const rect=cv.getBoundingClientRect();
  const c=Math.floor((ev.clientX-rect.left-gx)/cell), r=Math.floor((ev.clientY-rect.top-gy)/cell);
  if(r<0||c<0||r>=L.size||c>=L.size)return null; return [r,c];
}
function applyCell(r,c,action){
  if(won)return;
  if(action==='fill'){
    if(st[r][c]!==0)return;
    if(sol[r][c]===1){
      st[r][c]=1;
      refreshDone(true); draw(); checkWin();
      if(tutActive && STEPS[tutStep] && STEPS[tutStep].key==='act' && tutTarget && st[tutTarget[0]][tutTarget[1]]===1) nextTut();
    } else {
      st[r][c]=2; errors++; hearts();
      flashes.push({r:r,c:c,until:Date.now()+450});
      if(!flashRAF)flashRAF=requestAnimationFrame(flashLoop);
      dragging=false; // don't cascade mistakes through a drag
      if(errors>=3)$('ooh').style.display='grid';
    }
  } else if(action==='setx'){
    if(st[r][c]!==0)return;
    st[r][c]=2; draw();
  } else if(action==='clearx'){
    if(st[r][c]!==2)return;
    st[r][c]=0; draw();
  }
}
cv.addEventListener('pointerdown',ev=>{
  ev.preventDefault();
  try{cv.setPointerCapture(ev.pointerId);}catch(e){}
  const cl=cellAt(ev); if(!cl)return;
  const r=cl[0],c=cl[1];
  if(mode==='fill')dragAction='fill';
  else dragAction=st[r][c]===2?'clearx':'setx';
  dragging=true; lastCell=r+','+c;
  applyCell(r,c,dragAction);
});
cv.addEventListener('pointermove',ev=>{
  if(!dragging)return; ev.preventDefault();
  const cl=cellAt(ev); if(!cl)return;
  const k=cl[0]+','+cl[1]; if(k===lastCell)return; lastCell=k;
  applyCell(cl[0],cl[1],dragAction);
});
function endDrag(ev){dragging=false;lastCell=null;try{cv.releasePointerCapture(ev.pointerId);}catch(e){}}
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);window.addEventListener('pointerup',endDrag);
// iOS in-app webviews (Messenger/Facebook/Instagram) ignore touch-action:none and
// pointer-event preventDefault for scroll suppression — a drag on the board still
// scrolls/bounces the page. A non-passive touchmove preventDefault is the only
// reliable cross-webview way to keep a board drag from scrolling.
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

function setMode(m){
  mode=m;
  $('modeFill').classList.toggle('on',m==='fill');
  $('modeX').classList.toggle('on',m==='x');
}
$('modeFill').onclick=()=>setMode('fill');
$('modeX').onclick=()=>setMode('x');

function checkWin(){
  const S=L.size;
  for(let r=0;r<S;r++)for(let c=0;c<S;c++)if(sol[r][c]===1&&st[r][c]!==1)return;
  won=true;
  GBLB.report(lvl+1);
  $('winmsg').textContent='Level '+(lvl+1)+' of '+DATA.count+' complete.';
  $('wino').style.display='grid';
}
$('hint').onclick=()=>{ // reveal one correct square
  if(won)return;
  const S=L.size,opts=[];
  for(let r=0;r<S;r++)for(let c=0;c<S;c++)if(sol[r][c]===1&&st[r][c]!==1)opts.push([r,c]);
  if(!opts.length)return;
  const p=opts[(Math.random()*opts.length)|0];
  st[p[0]][p[1]]=1; refreshDone(true); draw(); checkWin();
};
$('reset').onclick=()=>{ if(won)return; load(lvl); };
$('restart').onclick=()=>{$('ooh').style.display='none';load(lvl);};
$('keepon').onclick=()=>{$('ooh').style.display='none';};
$('next').onclick=()=>{$('wino').style.display='none';lvl=Math.min(lvl+1,DATA.levels.length-1);localStorage.setItem(KEY,lvl);load(lvl);};
addEventListener('resize',()=>{if(L){layout();draw();if(tutActive)renderTut();}});

/* ── First-run guided tutorial ─────────────────────────────────────────────
   On the very first visit (only on Level 1) we explain what the clue numbers
   mean, then have the player fill a first correct square on a glowing cell.
   Shown once; the "seen" flag lives in localStorage. */
const TUT_T={
  en:{w_t:"Welcome to Nonogram",w_b:"The numbers are the lengths of the runs of filled squares in that row or column, in order — \"3 1\" means 3 filled, a gap, then 1.",start:"Start",
      t_t:"Fill a square",t_b:"Fill mode is on. Tap the glowing square to paint it.",
      f_t:"You've got it! 🎉",f_b:"Complete the picture. A wrong square costs a heart — use ✕ marks to note empties.",play:"Play",skip:"Skip"},
  vi:{w_t:"Chào mừng đến với Nonogram",w_b:"Các con số là độ dài các dãy ô được tô trong hàng hoặc cột đó, theo thứ tự — \"3 1\" nghĩa là 3 ô tô, cách quãng, rồi 1 ô.",start:"Bắt đầu",
      t_t:"Tô một ô",t_b:"Chế độ Fill đang bật. Chạm vào ô đang sáng để tô.",
      f_t:"Bạn làm được rồi! 🎉",f_b:"Hoàn thành bức tranh. Tô sai mất một tim — dùng dấu ✕ để ghi chú ô trống.",play:"Chơi",skip:"Bỏ qua"},
  ko:{w_t:"Nonogram에 오신 것을 환영합니다",w_b:"숫자는 그 행/열에서 연속으로 칠해진 칸의 길이를 순서대로 나타냅니다 — \"3 1\"은 3칸, 간격, 1칸입니다.",start:"시작",
      t_t:"칸 칠하기",t_b:"Fill 모드입니다. 빛나는 칸을 탭해 칠하세요.",
      f_t:"잘하셨어요! 🎉",f_b:"그림을 완성하세요. 틀리면 하트가 줄어듭니다 — ✕로 빈칸을 표시하세요.",play:"플레이",skip:"건너뛰기"},
  zh:{w_t:"欢迎来到 Nonogram",w_b:"数字表示该行或该列中连续填充格的长度，按顺序排列——\"3 1\"表示先3格，隔开，再1格。",start:"开始",
      t_t:"填一个格子",t_b:"当前是 Fill 模式。点按发光的格子将它涂上。",
      f_t:"你学会了！🎉",f_b:"完成图案。涂错会扣心——用 ✕ 标记空格。",play:"开始玩",skip:"跳过"},
  ja:{w_t:"Nonogram へようこそ",w_b:"数字はその行・列で連続して塗られるマスの長さを順に示します —「3 1」は3マス、間を空けて1マスです。",start:"スタート",
      t_t:"マスを塗ろう",t_b:"Fill モードです。光っているマスをタップして塗ります。",
      f_t:"できました！🎉",f_b:"絵を完成させましょう。間違えるとハートが減ります — ✕ で空きマスをメモ。",play:"プレイ",skip:"スキップ"},
  ar:{w_t:"مرحباً بك في Nonogram",w_b:"الأرقام هي أطوال سلاسل الخانات المملوءة في ذلك الصف أو العمود بالترتيب — \"3 1\" تعني 3 خانات، فراغ، ثم خانة واحدة.",start:"ابدأ",
      t_t:"املأ خانة",t_b:"وضع Fill مفعّل. انقر على الخانة المضيئة لتلوينها.",
      f_t:"أحسنت! 🎉",f_b:"أكمل الصورة. الخانة الخاطئة تكلّفك قلبًا — استخدم ✕ لتحديد الفراغات.",play:"العب",skip:"تخطّي"}
};
const M=TUT_T[LANG]||TUT_T.en;
const STEPS=[
  {key:"welcome",target:null,                title:M.w_t,body:M.w_b,btn:M.start},
  {key:"act",     target:()=>cv,       pad:6, interactive:true, title:M.t_t,body:M.t_b},
  {key:"finish",  target:null,                title:M.f_t,body:M.f_b,btn:M.play}
];

function maybeStartTut(){
  if(!TUT_ON)return;                       // feature flag off
  if(localStorage.getItem(TUTKEY))return;
  if(lvl!==0||tutActive)return;
  tutTarget=null;
  for(let r=0;r<L.size&&!tutTarget;r++)for(let c=0;c<L.size;c++)if(sol[r][c]===1){tutTarget=[r,c];break;}
  if(!tutTarget)return;
  setMode('fill');
  tutActive=true; tutStep=0; renderTut();
}
function setHole(rect,pad){
  pad=pad||8; const h=$('tutHole');
  $('tutBg').style.display='none'; h.style.display='block';
  h.style.left=(rect.left-pad)+'px'; h.style.top=(rect.top-pad)+'px';
  h.style.width=(rect.width+pad*2)+'px'; h.style.height=(rect.height+pad*2)+'px';
}
function placeCard(rect){
  const card=$('tutCard'); card.classList.remove('above','below');
  if(!rect){ card.style.top='50%'; card.style.transform='translate(-50%,-50%)'; return; }
  card.style.transform='translateX(-50%)';
  const ch=card.offsetHeight, below=rect.top<innerHeight*0.5;
  let top=below?rect.bottom+16:rect.top-16-ch;
  card.classList.add(below?'below':'above');
  card.style.top=Math.max(12,Math.min(top,innerHeight-ch-12))+'px';
}
function renderTut(){
  const s=STEPS[tutStep], tut=$('tut');
  tut.classList.add('on'); tut.classList.toggle('block',!s.interactive);
  if(LANG==='ar')$('tutCard').dir='rtl';
  $('tutTitle').textContent=s.title; $('tutBody').textContent=s.body;
  $('tutSkip').textContent=M.skip;
  const next=$('tutNext');
  if(s.interactive){ next.style.display='none'; }
  else { next.style.display='inline-block'; next.textContent=s.btn; }
  const tgt=s.target&&s.target();
  if(tgt){ const r=tgt.getBoundingClientRect(); setHole(r,s.pad); placeCard(r); }
  else { $('tutHole').style.display='none'; $('tutBg').style.display='block'; placeCard(null); }
  if(s.interactive && !tutRAF) tutRAF=requestAnimationFrame(tutAnimate);
}
function nextTut(){ tutStep++; if(tutStep>=STEPS.length){ endTut(); return; } renderTut(); }
function endTut(){
  tutActive=false; if(tutRAF){cancelAnimationFrame(tutRAF);tutRAF=0;}
  localStorage.setItem(TUTKEY,'1'); $('tut').classList.remove('on'); draw();
}
$('tutNext').onclick=nextTut;
$('tutSkip').onclick=endTut;

function tutAnimate(ts){
  tutT=ts||0;
  if(!(tutActive && STEPS[tutStep] && STEPS[tutStep].key==='act')){ tutRAF=0; return; }
  draw(); tutRAF=requestAnimationFrame(tutAnimate);
}
function drawTutHint(){
  if(!tutTarget)return;
  const r=tutTarget[0], c=tutTarget[1], t=tutT/1000, col=getCss('--acc')||'#3b5bdb';
  const x=gx+c*cell, y=gy+r*cell;
  const pulse=0.4+0.45*(0.5+0.5*Math.sin(t*3.4));
  ctx.save(); ctx.globalAlpha=pulse; ctx.strokeStyle=col; ctx.lineWidth=Math.max(3,cell*0.12);
  ctx.strokeRect(x+2,y+2,cell-4,cell-4); ctx.restore();
  const fp=0.5+0.5*Math.sin(t*3.4);
  ctx.save(); ctx.globalAlpha=0.9; ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(x+cell/2,y+cell/2,cell*(0.14+0.06*fp),0,7); ctx.fill();
  ctx.lineWidth=2.5; ctx.strokeStyle='#fff'; ctx.stroke(); ctx.restore();
}
</script>
