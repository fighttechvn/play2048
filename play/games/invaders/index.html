<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
/* iOS 12 / old WebKit have no Pointer Events — the games drive all input through
   pointerdown/move/up (+ setPointerCapture). Bridge touch (and old-desktop mouse)
   into synthetic pointer events so swiping/drawing works. No-op on modern engines. */
(function () {
  if (window.PointerEvent) return;
  var EP = window.Element && Element.prototype;
  if (EP && !EP.setPointerCapture) {
    EP.setPointerCapture = function () {};
    EP.releasePointerCapture = function () {};
    EP.hasPointerCapture = function () { return false; };
  }
  function mk(type, x, y, id, ptype) {
    var e;
    try { e = new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: x, clientY: y }); }
    catch (_) { e = document.createEvent("MouseEvents"); e.initMouseEvent(type, true, true, window, 0, 0, 0, x, y, false, false, false, false, 0, null); }
    e.pointerId = id; e.pointerType = ptype; e.isPrimary = true;
    e.pressure = type === "pointerup" || type === "pointercancel" ? 0 : 0.5;
    e.width = 1; e.height = 1;
    return e;
  }
  // --- touch → pointer (move/up go to the start target, mimicking pointer capture) ---
  var startTarget = null, touchActive = false, lastTouch = 0;
  function relay(type, touch, target) {
    var ev = mk(type, touch.clientX, touch.clientY, (touch.identifier || 0) + 1, "touch");
    return target.dispatchEvent(ev); // false if a handler called preventDefault()
  }
  document.addEventListener("touchstart", function (e) {
    touchActive = true; lastTouch = e.timeStamp || 0; startTarget = e.target;
    if (!relay("pointerdown", e.changedTouches[0], startTarget)) e.preventDefault();
  }, { passive: false });
  document.addEventListener("touchmove", function (e) {
    lastTouch = e.timeStamp || 0;
    if (!relay("pointermove", e.changedTouches[0], startTarget || e.target)) e.preventDefault();
  }, { passive: false });
  function end(type) {
    return function (e) {
      touchActive = false; lastTouch = e.timeStamp || 0;
      relay(type, e.changedTouches[0], startTarget || e.target); startTarget = null;
    };
  }
  document.addEventListener("touchend", end("pointerup"), { passive: false });
  document.addEventListener("touchcancel", end("pointercancel"), { passive: false });
  // --- mouse → pointer (old desktop); skip the synthetic mouse burst after a touch ---
  function fromMouse(type) {
    return function (e) {
      if (touchActive || (e.timeStamp || 0) - lastTouch < 700) return;
      e.target.dispatchEvent(mk(type, e.clientX, e.clientY, 1, "mouse"));
    };
  }
  document.addEventListener("mousedown", fromMouse("pointerdown"), true);
  document.addEventListener("mousemove", fromMouse("pointermove"), true);
  document.addEventListener("mouseup", fromMouse("pointerup"), true);
})();
</script>

<style>

  #wrap{max-width:560px;margin:0 auto;padding:calc(62px + var(--saa-top, env(safe-area-inset-top, 0px))) calc(16px + var(--saa-right, env(safe-area-inset-right, 0px))) calc(16px + var(--saa-bottom, env(safe-area-inset-bottom, 0px))) calc(16px + var(--saa-left, env(safe-area-inset-left, 0px)));display:flex;flex-direction:column;gap:14px;min-height:100%}
  /* the wrapper's top pad clears the host's floating chrome (back button left,
     leaderboard button right), so this row gets the full width */
  .top{display:flex;align-items:center;gap:8px;min-height:44px}
  .pill{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap;font-size:14px}
  #ttl{margin-right:auto}
  .board{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px}
  canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:8px}
  .btns{display:flex;gap:12px}
  .btn{flex:1;padding:14px;border-radius:999px;border:1px solid var(--bd);background:var(--btn);font-weight:700;font-size:16px;cursor:pointer}
  .btn:disabled{opacity:.45}
  .help{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 18px;font-size:14.5px;color:#555;line-height:1.5}
  .win{position:fixed;top:0;right:0;bottom:0;left:0;display:none;place-items:center;background:rgba(0,0,0,.5);z-index:9}
  .win div{background:#fff;border-radius:18px;padding:28px 32px;text-align:center;max-width:300px}
  .win h2{margin:0 0 6px}.win p{margin:0;color:#555;font-size:15px;line-height:1.5}
  .win button{margin-top:14px;padding:12px 26px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
  .pad{display:grid;direction:ltr;grid-template-columns:1fr 1.2fr 1fr;gap:12px;margin-top:-4px}
  .pb{padding:0;border-radius:14px;border:1px solid var(--bd);background:#fff;font-size:30px;font-weight:700;cursor:pointer;color:var(--ink);touch-action:manipulation;min-height:76px}
  .pb:active{background:#e9f1fa}
  .pb.fire{font-size:18px;letter-spacing:.06em;color:#fff;background:var(--accent);border-color:var(--accent2)}
  .pb.fire:active{background:var(--accent2)}

  .swp{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:150px;padding:12px 16px;border-radius:18px;border:2px dashed var(--bd);background:var(--card);color:#8c8c8c;font-weight:700;font-size:14.5px;text-align:center;line-height:1.4;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .swp b{font-size:30px;opacity:.45;margin-bottom:6px}
  .swp.on{background:#f3f1ea;border-color:#b9b9b9}
  body.swipe .pad{display:none}
  body.swipe .swp{display:flex}
  .seg{display:flex;flex:0 0 auto;border:1px solid var(--bd);border-radius:999px;background:var(--btn);padding:3px}

    ja:"<b>遊び方。</b> <b>◀ ▶</b> で移動（フィールドのドラッグでも可）、<b>FIRE</b> は押しっぱなしに。24 ウェーブが迫り、数が減るほど隊列は速くなります — 最後の 1 体が最速です。バンカーに隠れられますが、上下どちらからも削れていきます。光る敵を撃ち落として、落ちてくるものを回収：強化砲、シールド、予備機、スマートボム。被弾すると砲は 1 段階下がります。6 ウェーブごとに旗艦が出現し、1 体でも白い線に届いたらそのランは終わりです。",

  };
  var L=pick(),el=document.getElementById("helpcard");

  let mode='buttons';

// ── Shared shell ───────────────────────────────────────────────────────────
// Canvas fit, fixed-step loop, d-pad / swipe / keyboard input, pause. Every
// bundle inlines this verbatim; the per-game body below supplies tick + draw.
const READY=0,PLAYING=1,CLEAR=2,DEAD=3,PAUSED=4;
const cv=$('cv'), ctx=cv.getContext('2d');
let phase=READY, U=1, CW=0, CH=0, dpr=1, lastT=0, acc=0;
const IN={dir:null,fire:false,tap:false,drag:null};

function fit(uw,uh){
  // clientWidth includes the card's padding; the canvas only ever gets the
  // content box, so measuring the parent alone stretches the backing store
  // wider than the element and squashes everything horizontally.
  const p=cv.parentNode, cs=window.getComputedStyle(p);
  const pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
  const cssW=Math.min(p.clientWidth-pad, 460);
  dpr=Math.min(3, window.devicePixelRatio||1);
  U=cssW/uw; CW=cssW; CH=cssW*uh/uw;
  cv.width=Math.round(CW*dpr); cv.height=Math.round(CH*dpr);
  cv.style.height=CH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function rr(x,y,w,h,r,c){ ctx.fillStyle=c; ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);}else{

// ── Pure rules — inlined verbatim from logic.mjs (the tests import that file). ──
// logic.mjs — Sky Guard: the rules of the wave, with no canvas anywhere.
// A formation marches, erodes your bunkers and occasionally breaks ranks to
// dive at you. Everything is a deterministic fixed-step simulation driven by an
// explicit RNG, so gen-levels.mjs can rate a wave by playing it and the tests
// can pin the maths. index.html inlines this file verbatim.

const WIDTH = 120, HEIGHT = 152;
const SHIP_Y = 138, SHIP_W = 11, SHIP_H = 7;
const COLS_MAX = 8, ROWS_MAX = 5;
const CELL_W = 13, CELL_H = 12;

const TYPES = {
  grunt: { w: 8, h: 6, hp: 1, score: 10 },
  wing:  { w: 9, h: 6, hp: 1, score: 20 },
  elite: { w: 9, h: 7, hp: 2, score: 40 },
  boss:  { w: 34, h: 18, hp: 40, score: 1000 },
};
const GUNS = {
  single: { shots: 1, cool: 26, speed: 2.2, pierce: 0 },
  twin:   { shots: 2, cool: 24, speed: 2.3, pierce: 0 },
  rapid:  { shots: 3, cool: 12, speed: 2.6, pierce: 0 },
  lance:  { shots: 2, cool: 30, speed: 3.1, pierce: 2 },
};
const GUN_ORDER = ["single", "twin", "rapid", "lance"];
const DROPS = ["gun", "shield", "life", "bomb"];

const CONFIG = {
  lives: 3,
  shipSpeed: 1.05,
  stepDown: 5,              // how far the formation drops when it touches a wall
  fireCoolBase: 26,
  bombSpeed: 0.95,
  diveSpeed: 1.45,
  bunkerRows: 3, bunkerCols: 7, bunkerCell: 2.2,
  bunkerY: 118,
  ufoEvery: 620,            // ticks between bonus runs
  ufoSpeed: 0.85,
  ufoScore: [150, 300, 500],
  dropChance: 0.11,
  dropSpeed: 0.7,
  shieldTicks: 540,
  respawnTicks: 150,
  waveClearBonus: 250,
  perfectBonus: 500,        // no life lost this wave
  landingRow: SHIP_Y - 10,  // formation this low and the wave is lost
  maxPlayerBullets: 3,

const WAVES = 24;
const ease = (t) => t * t * (3 - 2 * t);                  // smoothstep

function paramsForLevel(i) {                       // i is 0-based
  const n = i + 1;
  const t = ease(i / (WAVES - 1));
  const boss = n % 6 === 0;
  const relief = n % 6 === 1 ? 0.75 : 1;                  // the dip after a boss
  const cols = Math.min(COLS_MAX, Math.round(4 + 4 * t));
  const rows = boss ? Math.min(2, 1 + Math.round(t)) : Math.min(ROWS_MAX, Math.round(2 + 3 * t));
  const kinds = [];
  for (let r = 0; r < rows; r++) {
    const depth = rows === 1 ? 1 : 1 - r / (rows - 1);     // top rows are the tough ones
    kinds.push(depth > 0.66 && t > 0.25 ? "elite" : depth > 0.33 ? "wing" : "grunt");
  }
  return {
    n,
    cols, rows, kinds,
    marchTicks: Math.round((40 - 19 * t) / relief),
    fireRate: Math.round((0.007 + 0.019 * t) * relief * 10000) / 10000,
    // A boss brings its own barrage; escorts only start breaking ranks from the
    // second one, so the first boss reads as a duel rather than a pile-on.
    divers: boss ? (n >= 12 ? 1 : 0) : t < 0.12 ? 0 : Math.min(2, Math.round(1 + t) * (relief < 1 ? 0 : 1)),
    boss: boss ? Math.round((0.25 + n / 30) * 100) / 100 : 0,
    bunkers: true,
  };
}

function mulberry32(a) {

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

/** A fresh set of four bunkers — each a small grid of blocks that chips away. */
function makeBunkers() {
  const out = [];
  const { bunkerRows: R, bunkerCols: C, bunkerCell: S, bunkerY: Y } = CONFIG;
  for (let b = 0; b < 4; b++) {
    const x0 = 12 + b * ((WIDTH - 24) / 3) - (C * S) / 2;
    const cells = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      // carve a doorway out of the middle of the bottom row — the classic shape
      if (r === R - 1 && c > 1 && c < C - 2) continue;
      cells.push({ x: x0 + c * S, y: Y + r * S, hp: 3 });
    }
    out.push(cells);
  }

}

/**
 * Build the world for a wave. `level` comes from levels.json:
 *   { n, cols, rows, kinds[], marchTicks, fireRate, divers, boss, bunkers }
 */
function createWorld(level, rand, carry) {
  const r = rand || Math.random;
  const w = {
    tick: 0,
    level,
    n: level.n,
    ship: { x: WIDTH / 2, cool: 0, gun: (carry && carry.gun) || "single", shield: CONFIG.shieldTicks / 3, dead: 0 },
    lives: carry && carry.lives != null ? carry.lives : CONFIG.lives,
    score: (carry && carry.score) || 0,
    aliens: [],
    dir: 1,
    marchT: level.marchTicks,
    bullets: [],
    bombs: [],
    drops: [],

    boss: null,

        kind, col, row,

/** March cadence: the fewer left, the faster they come. Classic, and still the
 *  best difficulty dial in the genre — it is the wave's own clock. */
function marchInterval(w) {
  const total = Math.max(1, w.level.cols * w.level.rows);
  const left = Math.max(1, w.aliens.length);
  const t = left / total;                                 // 1 → full formation
  return Math.max(4, Math.round(w.level.marchTicks * (0.22 + 0.78 * t)));

function overlap(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
}

function hitBunker(w, x, y, radius) {
  let hit = false;
  for (const cells of w.bunkers) {
    for (let i = cells.length - 1; i >= 0; i--) {
      const c = cells[i];
      if (Math.abs(c.x - x) <= radius + CONFIG.bunkerCell / 2 && Math.abs(c.y - y) <= radius + CONFIG.bunkerCell / 2) {
        c.hp--; hit = true;
        if (c.hp <= 0) cells.splice(i, 1);
      }
    }
  }
  return hit;
}

function fire(w) {
  const g = gun(w);
  if (w.ship.cool > 0 || w.ship.dead > 0) return false;
  const live = w.bullets.filter((b) => b.mine).length;
  if (live >= Math.min(CONFIG.maxPlayerBullets, g.shots)) return false;
  const spread = g.shots >= 2 ? 3 : 0;
  const lanes = g.shots === 1 ? [0] : g.shots === 2 ? [-spread, spread] : [0];
  for (const dx of lanes) w.bullets.push({ x: w.ship.x + dx, y: SHIP_Y - 5, vy: -g.speed, mine: true, pierce: g.pierce });

function kill(w, a, events) {

  w.score = Math.round(w.score);
  events.push({ type: "kill", x: a.x, y: a.y, kind: a.kind, score: TYPES[a.kind].score });
  if (a.carries) {
    const kinds = w.ship.gun === "lance" ? ["shield", "bomb", "life"] : DROPS;

function applyDrop(w, kind) {

    w.ship.gun = GUN_ORDER[Math.min(GUN_ORDER.length - 1, i + 1)];
  } else if (kind === "shield") w.ship.shield = CONFIG.shieldTicks;
  else if (kind === "life") w.lives++;

function loseLife(w, events) {

  w.ship.gun = GUN_ORDER[Math.max(0, GUN_ORDER.indexOf(w.ship.gun) - 1)];   // the gun takes the hit too
  w.bombs.length = 0;
  events.push({ type: "shipDown", x: w.ship.x, y: SHIP_Y, lives: w.lives });
  if (w.lives <= 0) { w.over = true; w.won = false; w.reason = "dead"; }

/** One 60 Hz tick. `input` = { dir: -1|0|1, fire: bool }. */
function step(w, input, rand) {
  const r = rand || Math.random;

  if (w.over) return events;
  w.tick++;

  // ── ship ─────────────────────────────────────────────────────────────────
  if (w.ship.dead > 0) {
    if (--w.ship.dead === 0) { w.ship.x = WIDTH / 2; w.ship.shield = CONFIG.shieldTicks / 2; }
  } else {
    if (inp.dir) w.ship.x = clamp(w.ship.x + inp.dir * CONFIG.shipSpeed, SHIP_W / 2 + 1, WIDTH - SHIP_W / 2 - 1);
    if (w.ship.cool > 0) w.ship.cool--;
    if (inp.fire) fire(w);
    if (w.ship.shield > 0) w.ship.shield--;
  }
  if (w.pendingBomb) {
    w.pendingBomb = false;
    for (const a of w.aliens.slice()) if (a.y > 40) { a.hp = 0; }
    for (let i = w.aliens.length - 1; i >= 0; i--) if (w.aliens[i].hp <= 0) { kill(w, w.aliens[i], events); w.aliens.splice(i, 1); }

      if (nx < 3 || nx + a.w > WIDTH - 3) { bump = true; break; }
    }
    if (bump) {
      w.dir *= -1;
      for (const a of w.aliens) a.hy += CONFIG.stepDown;
      events.push({ type: "march", down: true });
    } else {
      for (const a of w.aliens) a.hx += w.dir * 2;
      events.push({ type: "march", down: false });
    }

      a.dvx += (w.ship.x - a.x) * 0.0016;                 // it steers, loosely, at you
      a.dvx = clamp(a.dvx, -1.3, 1.3);
      a.diving--;
      if (a.y > HEIGHT + 8) { a.y = -8; a.x = a.hx; a.diving = 0; a.dvx = 0; }   // it loops around
      if (a.diving === 0) { a.dvx = 0; a.dvy = 0; }
    } else {
      a.x += (a.hx - a.x) * 0.25;
      a.y += (a.hy - a.y) * 0.25;
      if (Math.abs(a.x - a.hx) < 0.05) a.x = a.hx;
      if (Math.abs(a.y - a.hy) < 0.05) a.y = a.hy;
    }
  }

    const diving = w.aliens.filter((a) => a.diving).length;
    if (diving < w.level.divers && r() < 0.006 + w.n * 0.0006) {
      const pool = w.aliens.filter((a) => !a.diving);
      const a = pool[Math.floor(r() * pool.length)];
      if (a) {
        a.diving = 480;
        a.dvy = CONFIG.diveSpeed;
        a.dvx = (w.ship.x - a.x) * 0.02;
        events.push({ type: "dive", x: a.x, y: a.y });
      }
    }
  }

  // ── the formation's own guns ─────────────────────────────────────────────
  if (w.aliens.length && r() < w.level.fireRate) {
    // only the lowest alien in a column may shoot — the ones behind hold fire
    const byCol = new Map();
    for (const a of w.aliens) {
      const k = a.diving ? "d" + a.col : a.col;
      const cur = byCol.get(k);
      if (!cur || a.y > cur.y) byCol.set(k, a);
    }
    const shooters = [...byCol.values()];
    const a = shooters[Math.floor(r() * shooters.length)];
    if (a) w.bombs.push({ x: a.x, y: a.y + a.h / 2, vy: CONFIG.bombSpeed * (1 + w.n * 0.012), zig: a.kind === "elite" ? (r() < 0.5 ? -0.25 : 0.25) : 0 });
  }

  // ── boss ─────────────────────────────────────────────────────────────────
  if (w.boss) {
    const b = w.boss;
    b.x += b.dir * 0.55;

    b.y = 22 + Math.sin(w.tick * 0.012) * 6;
    if (--b.cool <= 0) {
      b.cool = Math.max(24, 70 - w.n);
      b.phase = (b.phase + 1) % 3;
      const lanes = b.phase === 0 ? [-10, 0, 10] : b.phase === 1 ? [-4, 4] : [0];
      for (const dx of lanes) w.bombs.push({ x: b.x + dx, y: b.y + b.h / 2, vy: CONFIG.bombSpeed * 1.25, zig: b.phase === 2 ? 0.3 : 0 });
      events.push({ type: "bossFire", phase: b.phase });
    }
  }

  // ── bullets ──────────────────────────────────────────────────────────────
  for (const b of w.bullets) b.y += b.vy;
  for (let i = w.bullets.length - 1; i >= 0; i--) {
    const b = w.bullets[i];
    if (b.y < -4) { w.bullets.splice(i, 1); continue; }
    if (hitBunker(w, b.x, b.y, 0.8)) { w.bullets.splice(i, 1); continue; }
    let consumed = false;
    for (let j = w.aliens.length - 1; j >= 0; j--) {
      const a = w.aliens[j];
      if (Math.abs(a.x - b.x) > a.w / 2 + 1 || Math.abs(a.y - b.y) > a.h / 2 + 1) continue;
      a.hp--;
      if (a.hp <= 0) { kill(w, a, events); w.aliens.splice(j, 1); }
      else events.push({ type: "ping", x: a.x, y: a.y });
      if (b.pierce > 0) b.pierce--; else consumed = true;
      break;
    }
    if (!consumed && w.boss && Math.abs(w.boss.x - b.x) < w.boss.w / 2 && Math.abs(w.boss.y - b.y) < w.boss.h / 2) {
      w.boss.hp--;
      events.push({ type: "ping", x: b.x, y: b.y, boss: true });
      if (w.boss.hp <= 0) {
        w.score += TYPES.boss.score;
        events.push({ type: "bossDown", x: w.boss.x, y: w.boss.y });
        w.boss = null;
      }
      if (b.pierce > 0) b.pierce--; else consumed = true;
    }
    if (!consumed && w.ufo && Math.abs(w.ufo.x - b.x) < 7 && Math.abs(w.ufo.y - b.y) < 4) {
      const s = CONFIG.ufoScore[Math.floor(r() * CONFIG.ufoScore.length)];
      w.score += s;
      events.push({ type: "ufo", x: w.ufo.x, y: w.ufo.y, score: s });
      w.ufo = null; consumed = true;
    }
    if (consumed) w.bullets.splice(i, 1);
  }

  // ── incoming ─────────────────────────────────────────────────────────────
  for (const b of w.bombs) { b.y += b.vy; if (b.zig) b.x += Math.sin(w.tick * 0.18) * b.zig; }
  for (let i = w.bombs.length - 1; i >= 0; i--) {
    const b = w.bombs[i];
    if (b.y > HEIGHT + 4) { w.bombs.splice(i, 1); continue; }
    if (hitBunker(w, b.x, b.y, 1.1)) { w.bombs.splice(i, 1); continue; }
    if (w.ship.dead === 0 && Math.abs(b.x - w.ship.x) < SHIP_W / 2 && Math.abs(b.y - SHIP_Y) < SHIP_H / 2 + 1) {
      w.bombs.splice(i, 1);
      if (w.ship.shield > 0) { w.ship.shield = 0; events.push({ type: "shieldPop", x: w.ship.x, y: SHIP_Y }); continue; }
      loseLife(w, events);          // this clears the sky, so stop walking it
      if (w.over) return events;
      break;
    }
  }
  // a diver that reaches you is as bad as a bomb
  if (w.ship.dead === 0) {
    for (const a of w.aliens) {
      if (!a.diving) continue;
      if (overlap({ x: a.x, y: a.y, w: a.w, h: a.h }, { x: w.ship.x, y: SHIP_Y, w: SHIP_W, h: SHIP_H })) {
        a.diving = 1; a.y = HEIGHT + 20;
        if (w.ship.shield > 0) { w.ship.shield = 0; events.push({ type: "shieldPop", x: w.ship.x, y: SHIP_Y }); }
        else loseLife(w, events);
        if (w.over) return events;
        break;
      }
    }
  }

  // ── drops ────────────────────────────────────────────────────────────────
  for (const d of w.drops) d.y += CONFIG.dropSpeed;
  for (let i = w.drops.length - 1; i >= 0; i--) {
    const d = w.drops[i];
    if (d.y > HEIGHT + 4) { w.drops.splice(i, 1); continue; }
    if (w.ship.dead === 0 && Math.abs(d.x - w.ship.x) < SHIP_W / 2 + 3 && Math.abs(d.y - SHIP_Y) < SHIP_H) {
      w.drops.splice(i, 1);
      applyDrop(w, d.kind);
      events.push({ type: "pickup", kind: d.kind, x: d.x, y: d.y });
    }
  }

  // ── bonus run ────────────────────────────────────────────────────────────
  if (w.ufo) {
    w.ufo.x += w.ufo.vx;
    if (w.ufo.x < -10 || w.ufo.x > WIDTH + 10) w.ufo = null;
  } else if (--w.ufoT <= 0 && w.aliens.length > 1) {
    w.ufoT = CONFIG.ufoEvery;
    const fromLeft = r() < 0.5;
    w.ufo = { x: fromLeft ? -8 : WIDTH + 8, y: 8, vx: (fromLeft ? 1 : -1) * CONFIG.ufoSpeed };
    events.push({ type: "ufoIn" });
  }

  // ── win / lose the wave ──────────────────────────────────────────────────
  const landed = w.aliens.some((a) => !a.diving && a.y + a.h / 2 >= CONFIG.landingRow);
  if (landed) {
    w.over = true; w.won = false; w.reason = "landed";
    w.lives = 0;
    events.push({ type: "landed" });
    return events;
  }
  if (!w.aliens.length && !w.boss) {
    w.score += CONFIG.waveClearBonus;
    if (!w.lostLifeThisWave) { w.score += CONFIG.perfectBonus; events.push({ type: "perfect" }); }
    w.over = true; w.won = true; w.reason = "clear";
    events.push({ type: "clear", score: w.score });
  }
  return events;
}

function summary(w) {
  return {
    wave: w.n, score: w.score, lives: w.lives, gun: w.ship.gun,
    left: w.aliens.length, boss: w.boss ? w.boss.hp : 0,
    bunkerBlocks: w.bunkers.reduce((a, b) => a + b.length, 0),
    over: w.over, won: w.won, reason: w.reason, ticks: w.tick,
  };
}
// ── Sky Guard: painting + the campaign ─────────────────────────────────────
const BKEY='gobrain.invaders.best';
let w=null, rand=Math.random, waveIdx=0, best=+(localStorage.getItem(BKEY)||0)||0;
let pops=[], sparks=[], shake=0, banner=null, bannerT=0, inter=0, stars=[];

function relayout(){ fit(WIDTH, HEIGHT); paint(); }
function seedStars(){ stars=[]; const r=mulberry32(7);
  for(let i=0;i<34;i++) stars.push({x:r()*WIDTH,y:r()*(CONFIG.bunkerY-6),s:r()<0.25?1.4:0.9}); }
function startWave(i, carry){
  waveIdx=i;
  w=createWorld(paramsForLevel(i), rand, carry);
  pops=[]; sparks=[]; shake=0; inter=0;
  banner=M.wave+' '+(i+1); bannerT=80;
  GBLB.start(); lastT=0; acc=0; hud();
}
function newRun(){
  rand=mulberry32((Date.now()^0x9e3779b9)>>>0);
  $('wino').style.display='none';
  phase=PLAYING;
  startWave(0, null);
}
onStart=newRun;
function hud(){
  if(!w)return;
  const s=summary(w);
  $('ttl').textContent=M.wave+' '+s.wave+'/'+WAVES;
  $('sc').textContent=s.score.toLocaleString();
  $('bst').textContent='★ '+Math.max(best,s.score).toLocaleString();
}
function finish(won){
  phase=DEAD;
  const s=summary(w);
  best=Math.max(best,s.score);
  try{localStorage.setItem(BKEY,String(best));}catch(e){}
  $('overttl').textContent=won?M.victory:s.reason==='landed'?M.overrun:M.over;
  $('overmsg').textContent=M.wave+' '+s.wave+' · '+M.score+' '+s.score.toLocaleString()+' · '+M.best+' '+best.toLocaleString();
  $('again').textContent=M.again;
  $('wino').style.display='grid';
  hud();
}
function nextWave(){
  const s=summary(w);
  if(waveIdx+1>=WAVES){ finish(true); return; }
  startWave(waveIdx+1, {lives:w.lives, score:w.score, gun:w.ship.gun});
}

// ── input ──────────────────────────────────────────────────────────────────
bindPad([['bl',-1],['br',1]]);
bindFire('bf');
bindCanvas(null,{tapDown:true});
bindSwipe({drag:true,holdFire:true});
bindKeys([0,1,0,-1]);
$('restart').textContent=M.restart;
$('restart').onclick=newRun;
$('again').onclick=newRun;

// ── tick ───────────────────────────────────────────────────────────────────
function tick(){
  if(inter>0){ if(--inter===0) nextWave(); return true; }
  let dir=IN.dir||0;
  if(IN.drag&&IN.drag.down){ const tx=IN.drag.x; dir = tx<w.ship.x-1.2?-1:tx>w.ship.x+1.2?1:0; }
  const shoot=IN.fire||IN.tap; IN.tap=false;
  const evs=step(w,{dir:dir,fire:shoot},rand);
  for(const e of evs){
    if(e.type==='kill'){ for(let i=0;i<5;i++) sparks.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*1.8,vy:(Math.random()-0.5)*1.8,t:20,c:'220,90,60'}); }
    else if(e.type==='ufo'){ pops.push({x:e.x,y:e.y+6,t:44,txt:'+'+e.score}); }
    else if(e.type==='pickup'){ pops.push({x:e.x,y:e.y,t:40,txt:M.drop[e.kind]||''}); }
    else if(e.type==='bomb'){ shake=16; }
    else if(e.type==='shieldPop'){ pops.push({x:e.x,y:e.y-8,t:28,txt:M.drop.shield}); }
    else if(e.type==='shipDown'){ shake=20; for(let i=0;i<18;i++) sparks.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*3.4,vy:(Math.random()-0.5)*3.4,t:30,c:'255,170,60'}); }
    else if(e.type==='bossDown'){ shake=22; for(let i=0;i<30;i++) sparks.push({x:e.x,y:e.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,t:36,c:'255,120,60'}); }
    else if(e.type==='perfect'){ banner=M.perfect; bannerT=90; }
  }
  hud();
  if(w.over){
    if(w.won){ GBLB.report(waveIdx+1); if(!bannerT||banner!==M.perfect){ banner=M.cleared; bannerT=90; } inter=80; return true; }
    finish(false); return false;
  }
  return true;
}

// ── painting ───────────────────────────────────────────────────────────────
const SKY='#0e1220', DEEP='#080b14';
function px(v){ return v*U; }
const SPR={
  grunt:['..XX..','.XXXX.','XXXXXX','XX..XX','XXXXXX','X.XX.X'],
  wing:['..XX..','.XXXX.','XX.XXX','XXXXXX','.XXXX.','X....X'],
  elite:['X.XX.X','.XXXX.','XXXXXX','XX..XX','.XXXX.','X.XX.X'],
};
const COL={grunt:'#7fb069',wing:'#f0a202',elite:'#d1495b'};
function sprite(a,frame){
  const rows=SPR[a.kind]||SPR.grunt, cw=a.w/6, ch=a.h/6;
  ctx.fillStyle=COL[a.kind]||'#7fb069';
  for(let r=0;r<rows.length;r++){
    const line=(r===rows.length-1&&frame)?rows[r].split('').reverse().join(''):rows[r];
    for(let c=0;c<line.length;c++) if(line[c]==='X')
      ctx.fillRect(px(a.x-a.w/2+c*cw),px(a.y-a.h/2+r*ch),Math.ceil(px(cw)),Math.ceil(px(ch)));
  }
  if(a.kind==='elite'&&a.hp>1){ ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.fillRect(px(a.x-a.w/2),px(a.y-a.h/2-1.4),px(a.w),px(0.9)); }
}
function drawField(){
  const g=ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,DEEP); g.addColorStop(1,SKY);
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
  for(const s of stars){ ctx.fillStyle='rgba(255,255,255,'+(s.s>1?0.5:0.26)+')';
    ctx.fillRect(px(s.x),px(s.y),px(s.s),px(s.s)); }
  ctx.fillStyle='rgba(255,255,255,.10)';
  ctx.fillRect(0,px(CONFIG.landingRow),CW,px(0.5));      // the line they must not cross
  ctx.fillStyle='rgba(255,255,255,.22)';
  ctx.fillRect(0,px(HEIGHT-2),CW,px(2));
}
function drawBunkers(){
  for(const cells of w.bunkers) for(const c of cells){
    ctx.fillStyle=c.hp>=3?'#3fa34d':c.hp===2?'#2f7d3a':'#1e5527';
    ctx.fillRect(px(c.x),px(c.y),Math.ceil(px(CONFIG.bunkerCell)),Math.ceil(px(CONFIG.bunkerCell)));
  }
}
function drawShip(){
  if(w.ship.dead>0){
    ctx.fillStyle='rgba(255,160,60,'+Math.min(0.7,w.ship.dead/CONFIG.respawnTicks)+')';
    ctx.fillRect(px(w.ship.x-4),px(SHIP_Y-2),px(8),px(4));
    return;
  }
  const x=w.ship.x;
  if(w.ship.shield>0&&(w.ship.shield>90||Math.floor(w.ship.shield/6)%2)){
    ctx.strokeStyle='rgba(120,200,255,.75)'; ctx.lineWidth=Math.max(1,px(0.9));
    ctx.beginPath(); ctx.arc(px(x),px(SHIP_Y),px(SHIP_W*0.78),Math.PI,0); ctx.stroke();
  }
  ctx.fillStyle=ACC;
  ctx.fillRect(px(x-SHIP_W/2),px(SHIP_Y+1),px(SHIP_W),px(SHIP_H/2));
  ctx.fillRect(px(x-SHIP_W/2+1.6),px(SHIP_Y-1.4),px(SHIP_W-3.2),px(2.6));
  ctx.fillRect(px(x-0.9),px(SHIP_Y-SHIP_H/2-1),px(1.8),px(3));
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.fillRect(px(x-0.5),px(SHIP_Y-SHIP_H/2-1),px(1),px(1.4));
}
function drawBoss(){
  const b=w.boss;
  rr(px(b.x-b.w/2),px(b.y-b.h/2),px(b.w),px(b.h),px(4),'#5b6376');
  rr(px(b.x-b.w/2+2),px(b.y-b.h/2+2),px(b.w-4),px(b.h*0.34),px(3),'#8a93a8');
  ctx.fillStyle=ACC;
  for(let i=-1;i<=1;i++) ctx.fillRect(px(b.x+i*9-1.6),px(b.y+b.h/2-3),px(3.2),px(3));
  ctx.fillStyle='rgba(255,80,70,'+(0.55+0.45*Math.sin(w.tick*0.12))+')';
  ctx.fillRect(px(b.x-3),px(b.y-1.5),px(6),px(3));
  const pct=b.hp/b.max;
  rr(px(6),px(4),px(WIDTH-12),px(2.6),px(1.3),'rgba(255,255,255,.18)');
  rr(px(6),px(4),Math.max(px(1),px(WIDTH-12)*pct),px(2.6),px(1.3),pct<0.3?'#e03131':'#f0a202');
}
function drawHud(){
  for(let i=0;i<Math.min(6,w.lives);i++){
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.fillRect(px(4+i*5),px(HEIGHT-6),px(3.4),px(2.2));
  }
  ctx.textAlign='right';
  ctx.font='700 '+Math.round(px(6.5))+'px -apple-system,system-ui,sans-serif';
  ctx.fillStyle=w.ship.gun==='single'?'rgba(255,255,255,.55)':ACC;
  ctx.fillText((M.guns[w.ship.gun]||'').toUpperCase(), px(WIDTH-4), px(HEIGHT-4));
  ctx.textAlign='start';
}
function paint(){
  if(!w){ ctx.fillStyle=DEEP; ctx.fillRect(0,0,CW,CH); return; }
  ctx.save();
  if(shake>0){ shake--; ctx.translate((Math.random()-0.5)*shake*0.6,(Math.random()-0.5)*shake*0.6); }
  drawField();
  const frame=Math.floor(w.tick/16)%2===1;
  if(w.ufo){ rr(px(w.ufo.x-6),px(w.ufo.y-2),px(12),px(4),px(2),'#c77dff');
    ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fillRect(px(w.ufo.x-2),px(w.ufo.y-3.6),px(4),px(1.6)); }
  if(w.boss) drawBoss();
  for(const a of w.aliens) sprite(a,frame);
  drawBunkers();
  ctx.fillStyle='#ffe066';
  for(const b of w.bullets) ctx.fillRect(px(b.x-0.5),px(b.y-2),px(1.2),px(3.4));
  ctx.fillStyle='#ff6b6b';
  for(const b of w.bombs) ctx.fillRect(px(b.x-0.6),px(b.y-1.6),px(1.4),px(3.2));
  for(const d of w.drops){
    const c=d.kind==='gun'?ACC:d.kind==='shield'?'#4dabf7':d.kind==='life'?'#3fa34d':'#f0a202';
    rr(px(d.x-2.6),px(d.y-2.6),px(5.2),px(5.2),px(1.6),c);
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.fillRect(px(d.x-1.6),px(d.y-0.5),px(3.2),px(1));
    if(d.kind!=='gun') ctx.fillRect(px(d.x-0.5),px(d.y-1.6),px(1),px(3.2));
  }
  drawShip();
  for(const s of sparks){ s.x+=s.vx; s.y+=s.vy; s.t--;
    ctx.fillStyle='rgba('+s.c+','+(s.t/30)+')'; ctx.fillRect(px(s.x),px(s.y),px(1.6),px(1.6)); }
  sparks=sparks.filter(s=>s.t>0);
  ctx.restore();
  drawHud();
  ctx.textAlign='center';
  for(const p of pops){ p.t--; p.y-=0.35;
    ctx.fillStyle='rgba(255,255,255,'+Math.min(1,p.t/20)+')';
    ctx.font='700 '+Math.round(px(6.5))+'px -apple-system,system-ui,sans-serif';
    ctx.fillText(p.txt, Math.max(px(16),Math.min(CW-px(16),px(p.x))), px(p.y)); }
  pops=pops.filter(p=>p.t>0);
  if(bannerT>0){ bannerT--;
    ctx.fillStyle='rgba(255,255,255,'+Math.min(1,bannerT/26)+')';
    ctx.font='800 '+Math.round(px(11))+'px -apple-system,system-ui,sans-serif';
    ctx.fillText(banner, CW/2, px(HEIGHT*0.42)); }
  ctx.textAlign='start';
  if(phase===READY) overlayText(M.start, M.hint);
  else if(phase===PAUSED) overlayText(M.paused,'');
}

// ── boot ───────────────────────────────────────────────────────────────────
const ACC=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#4c8dd4';
const ACC2=getComputedStyle(document.documentElement).getPropertyValue('--accent2').trim()||'#2b5f96';
seedStars();
$('ttl').textContent=M.wave+' 1/'+WAVES;
$('sc').textContent='0';
$('bst').textContent='★ '+best.toLocaleString();
relayout();
run(tick, paint, 60);
// levels.json is the tuning fingerprint; the curve itself is inlined above, so
// a failed fetch (file://) costs the game nothing.
fetch('./levels.json').then(function(r){return r.json();}).then(function(){}).catch(function(){});
</script>
